<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>Paris Walk — Guénégaud · Montmartre · Notre-Dame</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #f5f4f0;
    --panel: #ffffff;
    --ink: #1c1c1a;
    --muted: #6b6b66;
    --line: #e4e2dc;
    --accent: #1d4ed8;
    --accent-ink: #ffffff;
    --route: #2563eb;
    --route-done: #a3a3a3;
    --warn: #b45309;
    --ok: #15803d;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.08);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column;
    height: 100dvh; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; cursor: pointer; }

  /* ---------- top bar ---------- */
  header.bar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top));
    background: #1f2937; color: #f9fafb;
  }
  header.bar h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header.bar .stat { font-size: 12px; color: #cbd5e1; white-space: nowrap; }
  header.bar button {
    background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 999px;
    padding: 6px 11px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
  }
  header.bar button.on { background: #22c55e; color: #052e16; }
  header.bar button.busy { opacity: .7; }
  header.bar .menu { position: relative; }
  header.bar .menu-list {
    position: absolute; right: 0; top: 40px; background: var(--panel); color: var(--ink);
    border-radius: 12px; box-shadow: var(--shadow); min-width: 240px; z-index: 1200; padding: 6px; display: none;
  }
  header.bar .menu-list.open { display: block; }
  header.bar .menu-list button, header.bar .menu-list label {
    display: block; width: 100%; text-align: left; background: none; color: var(--ink); border: 0;
    padding: 10px 12px; border-radius: 8px; font-size: 14px; cursor: pointer;
  }
  header.bar .menu-list button:hover, header.bar .menu-list label:hover { background: var(--bg); }
  header.bar .menu-list small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  header.bar .menu-list hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }

  /* ---------- directions ---------- */
  walk-directions { display: block; background: var(--panel); border-bottom: 1px solid var(--line); }
  .dir-status {
    display: flex; align-items: center; gap: 8px; padding: 6px 14px 0; font-size: 12px; color: var(--muted);
  }
  .dir-status .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; }
  .dir-status .dot.live { background: var(--ok); box-shadow: 0 0 0 3px rgba(21,128,61,.18); }
  .dir-status .dot.off { background: var(--warn); }
  .dir-status .spacer { flex: 1; }
  .dir-list { list-style: none; margin: 0; padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 4px; }
  .dir-item { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; }
  .dir-item.primary { background: #eff6ff; padding: 10px 8px; }
  .dir-item .icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; background: var(--accent); color: var(--accent-ink); }
  .dir-item.primary .icon { width: 44px; height: 44px; }
  .dir-item:not(.primary) .icon { width: 34px; height: 34px; background: #e5e7eb; color: #374151; margin-left: 5px; }
  .dir-item .icon svg { width: 60%; height: 60%; }
  .dir-item .text { min-width: 0; }
  .dir-item .text .main { font-weight: 600; font-size: 16px; line-height: 1.25; }
  .dir-item.primary .text .main { font-size: 18px; }
  .dir-item:not(.primary) .text .main { font-weight: 500; font-size: 14px; color: #374151; }
  .dir-item .main b.road { font-weight: 800; color: #111827; }
  .dir-item:not(.primary) .main b.road { font-weight: 700; }
  .dir-item .main .towards { color: var(--muted); font-weight: 500; }
  .dir-item.sight { background: #fffbeb; }
  .dir-item.sight .icon { background: #f59e0b; color: #fff; width: 34px; height: 34px; margin-left: 5px; }
  .dir-item.sight .text .main { font-weight: 600; font-size: 14px; color: #92400e; }
  .dir-item.sight .dist { font-size: 13px; font-weight: 600; color: #92400e; }
  .dir-item .text .sub { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dir-item .dist { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; text-align: right; white-space: nowrap; }
  .dir-item:not(.primary) .dist { font-size: 13px; font-weight: 600; color: var(--muted); }
  .dir-empty { padding: 18px 14px; color: var(--muted); font-size: 14px; }
  .dir-status .iconbtn { border: 0; background: var(--bg); color: var(--muted); border-radius: 999px; width: 26px; height: 26px; font-size: 12px; display: grid; place-items: center; margin-left: 6px; }
  /* compact: only the status line and the next instruction */
  walk-directions.compact .dir-list li:not(.primary), walk-directions.compact .scrub { display: none; }
  walk-directions.compact .dir-list { padding-bottom: 6px; }
  walk-directions.compact .dir-item.primary { padding: 6px 8px; }
  walk-directions.compact .dir-item.primary .icon { width: 36px; height: 36px; }
  walk-directions.compact .dir-item.primary .text .main { font-size: 16px; }
  walk-directions.compact .dir-item.primary .dist { font-size: 16px; }
  /* full-screen map: header and sights hidden, directions float over the map */
  body.map-full { display: flex; flex-direction: column; }
  body.map-full header.bar, body.map-full walk-nearby, body.map-full .map-note { display: none !important; }
  body.map-full walk-map { flex: 1; }
  body.map-full walk-directions { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 8px; right: 8px; z-index: 1000; border-radius: 14px; border: 0; box-shadow: var(--shadow); overflow: hidden; }
  body.map-full walk-directions .dir-status { padding-top: 6px; }
  .dir-empty b { color: var(--ink); }

  /* ---------- preview scrubber ---------- */
  .scrub { display: flex; align-items: center; gap: 6px; padding: 4px 10px 10px; font-size: 12px; color: var(--muted); }
  .scrub input[type=range] { flex: 1; accent-color: var(--accent); }
  .scrub button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 8px; font-size: 12px; white-space: nowrap; }
  .scrub input[type=range] { min-width: 60px; }
  .scrub .lab { min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; font-size: 11px; }

  /* ---------- map ---------- */
  walk-map { display: block; flex: 1; min-height: 160px; position: relative; }
  walk-map .map { position: absolute; inset: 0; background: #e9e6df; }
  .map-fabs { position: absolute; right: 10px; bottom: 12px; z-index: 900; display: flex; flex-direction: column; gap: 8px; }
  .fab { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--panel); color: var(--ink); box-shadow: var(--shadow); display: grid; place-items: center; }
  .fab.on { background: var(--accent); color: #fff; }
  .fab svg { width: 20px; height: 20px; }
  .map-note { position: absolute; left: 10px; top: 10px; z-index: 900; background: rgba(255,255,255,.92); border-radius: 10px; padding: 6px 10px; font-size: 12px; color: var(--muted); box-shadow: var(--shadow); max-width: 70%; }
  .leaflet-container { font: inherit; }
  .you-marker { width: 18px; height: 18px; border-radius: 50%; background: #2563eb; border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(37,99,235,.45), 0 2px 6px rgba(0,0,0,.35); }
  .wp-marker { width: 22px; height: 22px; border-radius: 50%; background: #1f2937; color: #fff; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .wp-marker.done { background: #9ca3af; }
  .poi-marker { width: 12px; height: 12px; border-radius: 50%; background: #d97706; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .leaflet-popup-content { margin: 10px 12px; font-size: 13px; line-height: 1.35; }
  .leaflet-popup-content b { font-size: 14px; }

  /* ---------- nearby sheet ---------- */
  walk-nearby { display: flex; flex-direction: column; flex-shrink: 0; background: var(--panel); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(0,0,0,.06); z-index: 950; transition: max-height .25s ease; max-height: 52px; overflow: hidden; }
  walk-nearby.open { max-height: 58vh; }
  .sheet-head, .tabs { flex-shrink: 0; }
  .sheet-head { position: relative; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; cursor: pointer; user-select: none; }
  .sheet-head .grip { width: 36px; height: 4px; border-radius: 2px; background: #d4d4d4; position: absolute; left: 50%; transform: translateX(-50%); top: 6px; }
  .sheet-head h2 { font-size: 15px; margin: 0; flex: 1; }
  .sheet-head .count { font-size: 12px; color: var(--muted); }
  .tabs { display: flex; gap: 4px; padding: 0 10px 8px; }
  .tabs button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--muted); }
  .tabs button.on { background: #1f2937; color: #fff; border-color: #1f2937; }
  .sheet-body { overflow-y: auto; flex: 1; min-height: 0; padding: 0 10px 12px; -webkit-overflow-scrolling: touch; }
  .sheet-head .close { border: 0; background: var(--bg); color: var(--ink); border-radius: 999px; width: 30px; height: 30px; font-size: 16px; display: none; place-items: center; }
  walk-nearby.open .sheet-head .close { display: grid; }
  walk-nearby.open .sheet-head #chev { display: none; }
  .poi-head .caret { color: var(--muted); font-size: 11px; transition: transform .15s; }
  .poi.open .poi-head .caret { transform: rotate(180deg); }
  .poi { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; background: var(--panel); }
  .poi-head { display: flex; align-items: baseline; gap: 8px; cursor: pointer; }
  .poi-head .name { font-weight: 600; font-size: 14px; flex: 1; }
  .poi-head .kind { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .poi-head .dist { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .poi-body { display: none; margin-top: 8px; font-size: 13px; line-height: 1.45; color: #374151; }
  .poi.open .poi-body { display: block; }
  .poi-body .fact { margin: 0 0 6px; }
  .poi-body img { float: right; width: 84px; height: 84px; object-fit: cover; border-radius: 8px; margin: 0 0 6px 10px; }
  .poi-body .meta { font-size: 12px; color: var(--muted); margin-top: 6px; clear: both; }
  .poi-body a { color: var(--accent); }
  .poi-body .actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .poi-body .actions button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 10px; font-size: 12px; }
  .poi.highlight { border-color: #fcd34d; background: #fffbeb; }
  .sheet-empty { color: var(--muted); font-size: 13px; padding: 12px 6px; }
  .show-more { display: block; width: 100%; border: 1px dashed var(--line); background: var(--bg); color: var(--muted); border-radius: 10px; padding: 10px; font-size: 13px; margin: 4px 0 8px; }

  /* ---------- planner ---------- */
  #planner { display: none; flex-direction: column; background: var(--panel); border-bottom: 1px solid var(--line); max-height: 62vh; }
  body.planning #planner { display: flex; }
  body.planning walk-directions, body.planning walk-nearby, body.planning .map-note { display: none !important; }
  .plan-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px 6px; flex-shrink: 0; }
  .plan-head h2 { margin: 0; font-size: 16px; flex: 1; }
  .plan-head .close { border: 0; background: var(--bg); color: var(--ink); border-radius: 999px; width: 30px; height: 30px; font-size: 16px; }
  .plan-body { overflow-y: auto; padding: 0 12px 12px; min-height: 0; }
  .plan-body .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .plan-body input[type=text], .plan-body input[type=number], .plan-body textarea { font: inherit; font-size: 14px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--panel); color: var(--ink); }
  .plan-body input[type=text] { flex: 1; min-width: 120px; }
  .plan-body input[type=number] { width: 70px; }
  .plan-body textarea { width: 100%; resize: vertical; line-height: 1.4; }
  .plan-body button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  .plan-body button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .plan-body button:disabled { opacity: .45; cursor: default; }
  .plan-body label.chk { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
  .plan-hint { font-size: 12px; color: var(--muted); margin: -2px 0 8px; line-height: 1.4; }
  .plan-stops { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .plan-stop { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; }
  .plan-stop .n { width: 22px; height: 22px; border-radius: 50%; background: #15803d; color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .plan-stop.missing .n { background: #b91c1c; }
  .plan-stop.pending .n { background: #9ca3af; }
  .plan-stop .name { font-weight: 600; }
  .plan-stop .where { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plan-stop .ctl { display: flex; gap: 2px; }
  .plan-stop .ctl button { padding: 3px 7px; font-size: 12px; border-radius: 7px; }
  .plan-marker { width: 24px; height: 24px; border-radius: 50%; background: #15803d; color: #fff; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .plan-marker.start { background: #1d4ed8; }
  @media (min-width: 900px) {
    #planner { grid-row: 2; grid-column: 1; max-height: none; border-right: 1px solid var(--line); border-bottom: 0; }
  }

  /* ---------- toast / overlay ---------- */
  .toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 13px; z-index: 2000; box-shadow: var(--shadow); max-width: 90vw; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .overlay { position: fixed; inset: 0; background: rgba(245,244,240,.9); z-index: 1500; display: grid; place-items: center; text-align: center; padding: 24px; font-size: 15px; color: var(--muted); }
  .overlay .spinner { width: 28px; height: 28px; border: 3px solid #d1d5db; border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
  .overlay b { color: var(--ink); }
  .overlay button { margin-top: 12px; border: 0; background: var(--accent); color: #fff; border-radius: 8px; padding: 8px 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }

  @media (min-width: 900px) {
    body { display: grid; grid-template-columns: 400px 1fr; grid-template-rows: auto 1fr; }
    header.bar { grid-column: 1 / -1; }
    walk-directions { grid-row: 2; grid-column: 1; overflow-y: auto; border-right: 1px solid var(--line); border-bottom: 0; }
    walk-map { grid-row: 2; grid-column: 2; }
    walk-nearby { position: absolute; right: 12px; top: 64px; width: 360px; border-radius: var(--radius); border: 1px solid var(--line); box-shadow: var(--shadow); max-height: 52px; }
    walk-nearby.open { max-height: min(70vh, 720px); }
  
    .dir-list { gap: 8px; }
  }
</style>
</head>
<body>

<header class="bar">
  <h1 id="title">Paris walk</h1>
  <span class="stat" id="stat"></span>
  <button id="gpsBtn" title="Follow my position">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
    <span>GPS</span>
  </button>
  <div class="menu">
    <button id="menuBtn" title="More">⋯</button>
    <div class="menu-list" id="menuList">
      <button id="newWalkBtn">New walk…<small>Paste a list of places (from an AI or your own) or tap stops on the map</small></button>
      <label>Import a GPX file<small>Route / track points are snapped to footpaths</small><input type="file" id="gpxFile" accept=".gpx,application/gpx+xml" hidden></label>
      <button id="exportBtn">Export road-snapped GPX<small>Load it in any app that follows a track</small></button>
      <hr>
      <button id="rerouteBtn">Recalculate route<small>Clears the cached route and fetches again</small></button>
      <button id="resetBtn">Reset to the built-in Paris loop</button>
      <hr>
      <button id="aboutBtn">About &amp; data sources</button>
    </div>
  </div>
</header>

<div id="planner">
  <div class="plan-head"><h2>New walk</h2><button class="close" id="planClose" title="Close">✕</button></div>
  <div class="plan-body">
    <div class="row"><input type="text" id="planName" placeholder="Walk name (e.g. Marais afternoon)"><input type="text" id="planCity" placeholder="City" value="Paris"></div>
    <textarea id="planText" rows="5" placeholder="One stop per line, in walking order — optionally followed by a dash and a short note:&#10;Start: 19 Rue Guénégaud&#10;Pont Neuf — oldest bridge in Paris&#10;Place des Vosges — the city's oldest square"></textarea>
    <p class="plan-hint">Names only — the app looks up where each place is and snaps the walk to footpaths. Get a list from any AI with the prompt below, type your own, or tick "Tap map" and tap the stops on the map.</p>
    <div class="row">
      <label class="chk">About <input type="number" id="planKm" value="8" min="1" max="40"> km</label>
      <label class="chk"><input type="checkbox" id="planLoop" checked> Loop back to start</label>
      <label class="chk"><input type="checkbox" id="planTap"> Tap map to add stops</label>
    </div>
    <div class="row"><button id="planPrompt">Copy AI prompt</button><button id="planFind" class="primary">Find places</button></div>
    <ol class="plan-stops" id="planStops"></ol>
    <div class="row"><button id="planBuild" class="primary" disabled>Build route</button><span class="plan-hint" id="planStatus"></span></div>
  </div>
</div>
<walk-directions id="directions"></walk-directions>
<walk-map id="map"></walk-map>
<walk-nearby id="nearby"></walk-nearby>

<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div><div class="spinner"></div><div id="overlayText">Snapping the route to Paris streets…</div></div></div>

<script id="default-gpx" type="application/gpx+xml">
<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="ChatGPT" xmlns="http://www.topografix.com/GPX/1/1">
  <metadata>
    <name>Paris: Rue Guénégaud – Montmartre – Notre-Dame Loop</name>
    <desc>Sightseeing walk starting and finishing at 19 Rue Guénégaud, Paris.</desc>
  </metadata>
  <wpt lat="48.8557053" lon="2.3388305"><name>19 Rue Guénégaud</name><desc>Start and finish</desc></wpt>
  <wpt lat="48.8566500" lon="2.3411200"><name>Pont Neuf</name><desc>Cross toward the Right Bank</desc></wpt>
  <wpt lat="48.8637600" lon="2.3367300"><name>Palais Royal</name><desc>Gardens and courtyard</desc></wpt>
  <wpt lat="48.8652000" lon="2.3472000"><name>Rue Montorgueil</name><desc>Market and café street</desc></wpt>
  <wpt lat="48.8712000" lon="2.3410200"><name>Passage des Panoramas</name><desc>Historic covered passage</desc></wpt>
  <wpt lat="48.8844200" lon="2.3386400"><name>Place des Abbesses</name><desc>Gateway into Montmartre</desc></wpt>
  <wpt lat="48.8871700" lon="2.3368700"><name>Moulin de la Galette</name><desc>Historic Montmartre landmark</desc></wpt>
  <wpt lat="48.8887200" lon="2.3387400"><name>Rue de l'Abreuvoir</name><desc>Picturesque Montmartre street</desc></wpt>
  <wpt lat="48.8886500" lon="2.3402200"><name>Clos Montmartre</name><desc>Montmartre vineyard</desc></wpt>
  <wpt lat="48.8864700" lon="2.3408400"><name>Place du Tertre</name><desc>Artists' square</desc></wpt>
  <wpt lat="48.8867000" lon="2.3431000"><name>Sacré-Cœur</name><desc>Main Montmartre stop</desc></wpt>
  <wpt lat="48.8583400" lon="2.3374500"><name>Pont des Arts</name><desc>Return via the Seine</desc></wpt>
  <wpt lat="48.8530000" lon="2.3499000"><name>Notre-Dame</name><desc>Afternoon cathedral stop</desc></wpt>
  <rte>
    <name>Rue Guénégaud – Montmartre – Notre-Dame Loop</name>

  const q = `[out:json][timeout:60];way["highway"]["name"]["highway"!~"^(motorway|trunk|motorway_link|trunk_link)$"](around:35,${line});out geom;`;
  const res = await fetch(OVERPASS, { method: "POST", body: "data=" + encodeURIComponent(q), headers: { "Content-Type": "application/x-www-form-urlencoded" } });
  if (!res.ok) throw new Error(`Overpass ${res.status}`);

    name: w.tags["name:en"] && /^(footway|steps|pedestrian)$/.test(w.tags.highway) ? w.tags.name : w.tags.name,
    minor: /^(footway|steps|path|cycleway|service|crossing)$/.test(w.tags.highway) || w.tags.footway === "sidewalk",

}
function distToWay(p, pts) {

    best = Math.min(best, Math.hypot(px - t * bx, py - t * by));

}

}

function enrichRoute(route, ways) {
  const ms = route.maneuvers.map(m => ({ ...m }));
  for (const m of ms) {
    if (m.street || m.kind === "arrive") continue;
    const probe = [Math.min(m.d0 + 12, m.d1), (m.d0 + m.d1) / 2, Math.min(m.d0 + 40, m.d1)].map(d => positionAt(route, d).pos);
    const votes = {};
    for (const p of probe) { const n = nearestStreet(ways, p); if (n) votes[n] = (votes[n] || 0) + 1; }
    const name = Object.entries(votes).sort((a, b) => b[1] - a[1])[0]?.[0];
    if (!name) continue;
    m.street = name; m.named = "lookup";
    if (m.kind === "depart") m.text = `Head ${cardinal(bearing(route.shape[m.i0], route.shape[Math.min(m.i0 + 3, route.shape.length - 1)]))} on ${name}`;
    else if (/^(Continue|Keep|Bear|Head|Walk)/.test(m.text) || m.kind === "straight") m.text = `${m.text.replace(/ (on|onto|along) .*$/, "")} on ${name}`;
    else m.text = `${m.text.replace(/\.$/, "")} onto ${name}`;
  }
  // merge: same street as the previous instruction and only a gentle change of direction
  const out = [];
  for (const m of ms) {
    const prev = out[out.length - 1];
    if (prev && m.kind !== "arrive" && m.street && m.street === prev.street && /^(straight|slight-left|slight-right)$/.test(m.kind)) { prev.i1 = m.i1; prev.len += m.len; continue; }
    out.push(m);
  }
  return finishRoute(route.shape, out.map(({ i0, i1, text, street, kind, len }) => ({ i0, i1, text, street, kind, len })), route.time, route.provider);
}

/* =====================================================================
   Nearby POIs: Overpass along the route, Wikipedia summaries on demand
   ===================================================================== */
async function fetchPOIs(shape) {
  const simp = simplify(shape, 40);
  const line = simp.map(p => `${p[0].toFixed(5)},${p[1].toFixed(5)}`).join(",");
  const around = `(around:140,${line})`;
  const q = `[out:json][timeout:40];(
    nwr["tourism"~"^(attraction|museum|artwork|viewpoint|gallery|theme_park)$"]["name"]${around};
    nwr["historic"~"^(monument|memorial|building|castle|church|city_gate|fort|manor|palace|ruins|tower|wayside_cross|fountain|archaeological_site)$"]["name"]${around};
    nwr["amenity"~"^(place_of_worship|fountain|theatre|arts_centre|marketplace)$"]["name"]${around};
    nwr["building"~"^(cathedral|church|chapel|basilica|synagogue|palace|castle)$"]["name"]${around};
    nwr["leisure"~"^(garden|park)$"]["name"]${around};
    nwr["shop"~"^(pastry|bakery|chocolate|cheese|books)$"]["name"]["wikipedia"]${around};
    nwr["amenity"~"^(cafe|restaurant|bar)$"]["name"]["wikipedia"]${around};
  );out center tags 600;`;
  const res = await fetch(OVERPASS, { method: "POST", body: "data=" + encodeURIComponent(q), headers: { "Content-Type": "application/x-www-form-urlencoded" } });
  if (!res.ok) throw new Error(`Overpass ${res.status}`);
  const data = await res.json();
  const seen = new Set(), out = [];
  for (const el of data.elements || []) {
    const lat = el.lat ?? el.center?.lat, lon = el.lon ?? el.center?.lon, t = el.tags || {};
    if (lat == null || !t.name) continue;
    const key = t.name.toLowerCase() + "|" + (t.wikidata || "");
    if (seen.has(key)) continue; seen.add(key);
    out.push({ id: `${el.type}/${el.id}`, name: t["name:en"] || t["int_name"] || t.name, lat, lon, kind: poiKind(t), tags: t });
  }
  return out;
}
function poiKind(t) {
  if (t.tourism === "museum") return "museum";
  if (t.tourism === "artwork") return "artwork";
  if (t.tourism === "viewpoint") return "viewpoint";
  if (t.tourism === "gallery") return "gallery";
  if (t.amenity === "place_of_worship" || /church|chapel|cathedral|basilica|synagogue/.test(t.building || "")) return "church";
  if (t.historic) return t.historic.replace("_", " ");
  if (t.amenity === "fountain") return "fountain";
  if (t.amenity === "theatre") return "theatre";
  if (t.amenity === "marketplace") return "market";
  if (t.leisure) return t.leisure;
  if (t.shop) return t.shop;
  if (t.amenity) return t.amenity;
  return t.tourism || "sight";
}
async function wikiSummary(tags) {
  const summary = async (lang, title) => {
    const r = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title.replace(/ /g, "_"))}`);
    if (!r.ok) return null;
    const j = await r.json();
    if (!j.extract) return null;
    return { extract: j.extract, thumb: j.thumbnail?.source, url: j.content_urls?.desktop?.page || j.content_urls?.mobile?.page, lang };
  };
  const tryEn = async title => { try { return await summary("en", title); } catch { return null; } };
  // 1. explicit English article
  if (tags["wikipedia:en"]) { const s = await tryEn(tags["wikipedia:en"]); if (s) return s; }
  // 2. the wikipedia tag (usually fr:Title) — find the English equivalent through its language links
  let lang = null, title = null;
  if (tags.wikipedia) { const m = tags.wikipedia.match(/^(\w+):(.+)$/); if (m) { lang = m[1]; title = m[2]; } else { lang = "en"; title = tags.wikipedia; } }
  if (title && lang === "en") { const s = await tryEn(title); if (s) return s; }
  if (title && lang !== "en") {
    try {
      const r = await fetch(`https://${lang}.wikipedia.org/w/api.php?action=query&prop=langlinks&lllang=en&redirects=1&format=json&origin=*&titles=${encodeURIComponent(title)}`);
      const j = r.ok ? await r.json() : null;
      const en = Object.values(j?.query?.pages || {})[0]?.langlinks?.[0]?.["*"];
      if (en) { const s = await tryEn(en); if (s) return s; }
    } catch { }
  }
  // 3. Wikidata sitelinks → English article
  if (tags.wikidata) {
    try {
      const r = await fetch(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${encodeURIComponent(tags.wikidata)}&props=sitelinks&format=json&origin=*`);
      const ent = r.ok ? Object.values((await r.json()).entities || {})[0] : null;
      const sl = ent?.sitelinks || {};
      if (sl.enwiki) { const s = await tryEn(sl.enwiki.title); if (s) return s; }
      if (!title && sl.frwiki) { lang = "fr"; title = sl.frwiki.title; }
    } catch { }
  }
  // 4. no English article: fall back to the original language
  if (title && lang) { try { return await summary(lang, title); } catch { return null; } }
  return null;
}

/* Map-match a position to the route.
   Scores each segment by distance, plus penalties for going backwards, for jumping far ahead
   (the loop revisits streets) and for travelling against the route's direction (the loop also
   uses the same streets in opposite directions). `global` ignores the window around lastProgress. */
function matchToRoute(route, pos, opts = {}) {
  const { lastProgress = 0, heading = null, windowBack = 250, windowAhead = 2000, global = false } = opts;
  const { shape, cum } = route;
  const cosLat = Math.cos(pos[0] * Math.PI / 180);
  let best = null;
  for (let i = 0; i < shape.length - 1; i++) {
    if (!global && (cum[i + 1] < lastProgress - windowBack || cum[i] > lastProgress + windowAhead)) continue;
    const a = shape[i], b = shape[i + 1];
    const bx = (b[1] - a[1]) * cosLat * 111320, by = (b[0] - a[0]) * 110540;
    const px = (pos[1] - a[1]) * cosLat * 111320, py = (pos[0] - a[0]) * 110540;
    if (Math.abs(px) > 3000 || Math.abs(py) > 3000) continue;
    const len2 = bx * bx + by * by || 1e-9, len = Math.sqrt(len2);
    const t = Math.max(0, Math.min(1, (px * bx + py * by) / len2));
    const d = Math.hypot(px - t * bx, py - t * by);
    if (best && d > best.score + 5) continue;
    const prog = cum[i] + t * len;
    let score = d;
    if (!global) score += Math.max(0, lastProgress - prog) * 0.15 + Math.max(0, prog - lastProgress - 300) * 0.03;
    if (heading != null && len > 3) {
      const segB = (Math.atan2(bx, by) * 180 / Math.PI + 360) % 360;
      const diff = Math.abs(((heading - segB) % 360 + 540) % 360 - 180);
      score += (1 - Math.cos(diff * Math.PI / 180)) * 20; // walking against this segment costs +40 m
    }
    if (!best || score < best.score) best = { score, dist: d, prog, idx: i, t };
  }
  return best;
}
/* Nearest point on the route, anywhere (map taps, projections). */

/* Every pass of the route within `maxD` metres of a point — a loop can pass a sight twice. */
function passesNear(route, pos, maxD = 60) {
  const { shape, cum } = route, cosLat = Math.cos(pos[0] * Math.PI / 180), out = [];
  for (let i = 0; i < shape.length - 1; i++) {
    const a = shape[i], b = shape[i + 1];
    const bx = (b[1] - a[1]) * cosLat * 111320, by = (b[0] - a[0]) * 110540, px = (pos[1] - a[1]) * cosLat * 111320, py = (pos[0] - a[0]) * 110540;
    if (Math.abs(px) > maxD + 200 || Math.abs(py) > maxD + 200) continue;
    const len2 = bx * bx + by * by || 1e-9, t = Math.max(0, Math.min(1, (px * bx + py * by) / len2));
    const d = Math.hypot(px - t * bx, py - t * by);
    if (d > maxD) continue;
    const prog = cum[i] + t * Math.sqrt(len2);
    const last = out[out.length - 1];
    if (last && prog - last.prog < 200) { if (d < last.dist) { last.dist = d; last.prog = prog; } }
    else out.push({ prog, dist: d });

const KIND_SCORE = { cathedral: 10, basilica: 10, museum: 8, palace: 8, castle: 8, church: 6, viewpoint: 6, monument: 5, memorial: 4, garden: 5, park: 4, attraction: 5, market: 4, theatre: 4, gallery: 3, fountain: 3, artwork: 2, "city gate": 5, ruins: 5, "archaeological site": 5, tower: 5, building: 3, chapel: 4, synagogue: 5 };

  if (/cathedral|basilica/.test(t.building || "")) sc = 10;
  if (t.wikipedia || t["wikipedia:en"]) sc += 4; else if (t.wikidata) sc += 2;

function rankPOIs(pois, route, perKm = 5) {

    return { ...p, score: scorePOI(p), prog: m ? m.prog : 0, lateral: m ? m.dist : 9999 };
  }).filter(p => p.lateral <= 140);

  for (const p of scored) (buckets[Math.floor(p.prog / 1000)] ||= []).push(p);

function positionAt(route, progress) {
  const { shape, cum } = route;
  let lo = 0, hi = cum.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (cum[mid] < progress) lo = mid + 1; else hi = mid; }
  const i = Math.max(1, lo), seg = cum[i] - cum[i - 1] || 1, t = Math.max(0, Math.min(1, (progress - cum[i - 1]) / seg));

function upcoming(route, progress, n = 3) {
  const ms = route.maneuvers;

  let cur = 0;
  for (let i = 0; i < ms.length; i++) if (ms[i].d0 <= progress + 8) cur = i; else break;
  const list = [];
  const start = (cur === 0 && progress < 30) ? 0 : cur + 1; // show the "head north on…" step while still at the start
  for (let i = start; i < ms.length && list.length < n; i++) list.push({ m: ms[i], in: Math.max(0, ms[i].d0 - progress) });

class WalkDirections extends HTMLElement {
  connectedCallback() {
    this.innerHTML = `
      <div class="dir-status"><span class="dot" id="dot"></span><span id="statusText">Preview mode</span><span class="spacer"></span><span id="remaining"></span><button class="iconbtn" id="compactBtn" title="Show fewer / more instructions">▲</button></div>
      <ol class="dir-list" id="list"></ol>
      <div class="scrub" id="scrub">
        <button id="prevTurn" title="Previous turn">◀</button>
        <button id="back" title="Back 100 m">−100</button>
        <input type="range" id="range" min="0" max="1000" value="0" step="1">
        <button id="fwd" title="Forward 100 m">+100</button>
        <button id="nextTurn" title="Next turn">▶</button>
        <span class="lab" id="lab">0 m</span>
      </div>`;
    const range = $("#range", this);
    range.addEventListener("input", () => { const r = state.data.route; if (!r) return; setPreviewProgress(r.length * range.value / 1000); });
    $("#back", this).onclick = () => setPreviewProgress(Math.max(0, state.data.progress - 100));
    $("#fwd", this).onclick = () => setPreviewProgress(Math.min(state.data.route?.length || 0, state.data.progress + 100));
    const jumpTurn = dir => {
      const r = state.data.route; if (!r) return;
      const p = state.data.progress, ms = r.maneuvers;
      const target = dir > 0 ? ms.find(m => m.d0 > p + 8) : [...ms].reverse().find(m => m.d0 < p - 8);
      if (target) setPreviewProgress(Math.max(0, target.d0 - 5));
    };
    this.setCompact(store.get("walk:compact") === true, false);
    $("#compactBtn", this).onclick = e => { e.stopPropagation(); this.setCompact(!this.classList.contains("compact")); };
    $("#prevTurn", this).onclick = () => jumpTurn(-1);
    $("#nextTurn", this).onclick = () => jumpTurn(1);
    state.on(d => this.render(d));
  }
  setCompact(v, save = true) { this.classList.toggle("compact", v); $("#compactBtn", this).textContent = v ? "▼" : "▲"; if (save) store.set("walk:compact", v); }
  render(d) {
    const list = $("#list", this), dot = $("#dot", this), st = $("#statusText", this), rem = $("#remaining", this);
    if (!d.route) { list.innerHTML = `<li class="dir-empty">No route yet.</li>`; return; }
    const detour = d.mode === "gps" && d.reroute;
    const { current, list: up } = detour ? upcoming(d.reroute.route, d.reroute.progress, 3) : upcoming(d.route, d.progress, 3);
    const left = Math.max(0, d.route.length - d.progress);
    rem.textContent = `${fmtDist(left)} left · ~${fmtTime(left / 1.3)}`;
    $("#range", this).value = Math.round(1000 * d.progress / d.route.length);
    $("#lab", this).textContent = fmtDist(d.progress);
    if (d.mode === "gps") {
      dot.className = "dot " + (d.pos ? (d.offRoute ? "off" : "live") : "");
      st.textContent = !d.pos ? "Waiting for GPS…" : d.weakSignal ? `Weak GPS signal (±${Math.round(d.accuracy)} m) — holding position` :
        detour ? `Detour back to the route · ${fmtDist(Math.max(0, d.reroute.route.length - d.reroute.progress))} to go` :
        d.offRoute ? `${fmtDist(d.offDist)} from the path${d.rerouting ? " — finding a way back…" : " — head back to the blue line"}` :
        (current?.street ? `On ${current.street}` : current?.towards ? `Heading to ${current.towards}` : "On route");
    } else {
      dot.className = "dot";
      st.textContent = current?.street ? `Preview · on ${current.street}` : current?.towards ? `Preview · heading to ${current.towards}` : "Preview — drag the slider or tap the map to move";
    }
    if (!up.length) {
      list.innerHTML = `<li class="dir-item primary"><div class="icon">${ICON.arrive}</div><div class="text"><div class="main">${esc(detour ? "Rejoin the route" : current?.text || "You have arrived")}</div><div class="sub">${detour ? "Back on the blue line" : "End of the walk"}</div></div><div class="dist"></div></li>`;

    const mainHtml = m => {

function setPreviewProgress(p) {

/* =====================================================================
   Controller
   ===================================================================== */
let watchId = null;
async function loadWalk(gpxText, { force = false } = {}) {
  const parsed = parseGPX(gpxText);
  const key = "walk:route2:" + hashStr(JSON.stringify(parsed.route.map(p => [+p.lat.toFixed(5), +p.lon.toFixed(5)])));
  store.set("walk:gpx", gpxText);
  $("#title").textContent = parsed.name;
  state.set({ name: parsed.name, points: parsed.route, highlights: parsed.highlights, route: null, pois: [], poisStatus: "idle", progress: 0, pos: null });
  const overlay = $("#overlay"), ot = $("#overlayText");
  let route = force ? null : store.get(key);
  if (!route) {
    overlay.classList.remove("hidden");
    try {
      route = await computeRoute(parsed.route, s => ot.textContent = s);
      // don't cache the derived cum/d0/d1 (recomputed) — cache shape + maneuvers
      store.set(key, { shape: route.shape, maneuvers: route.maneuvers.map(({ i0, i1, text, street, kind, len }) => ({ i0, i1, text, street, kind, len })), time: route.time, provider: route.provider });
    } catch (e) {
      console.error(e);
      ot.innerHTML = `<b>Couldn't reach a routing service.</b><br>${esc(e.message)}<br><small>Check your connection, then try again.</small><br><button onclick="location.reload()">Retry</button>`;
      return;
    }
  }
  overlay.classList.add("hidden");
  const enriched = route.enriched;
  if (enriched) fetchNamedStreets(route.shape).then(ways => state.set({ ways })).catch(() => { });
  route = finishRoute(route.shape, route.maneuvers, route.time, route.provider);
  $("#stat").textContent = `${fmtDist(route.length)} · ~${fmtTime(route.length / 1.3)}`;
  state.set({ route, roadside: buildRoadside(route, parsed.highlights, []) });
  setPreviewProgress(0);
  if (!enriched) {
    try {
      const ways = await fetchNamedStreets(route.shape);
      state.set({ ways });
      const r2 = enrichRoute(route, ways);
      store.set(key, { shape: r2.shape, maneuvers: r2.maneuvers.map(({ i0, i1, text, street, kind, len }) => ({ i0, i1, text, street, kind, len })), time: r2.time, provider: r2.provider, enriched: true });
      if (state.data.route === route) { state.set({ route: r2 }); setPreviewProgress(state.data.progress); }
      route = r2;
    } catch (e) { console.warn("street-name lookup failed", e); toast("Couldn't look up street names (OpenStreetMap busy) — try Recalculate later."); }
  }
  loadPOIs(route, key);
}
/* Sights that sit on the route itself, with the progress at which you pass them (each pass of a loop). */
function buildRoadside(route, highlights, topPois) {
  const out = [];
  highlights.forEach((h, i) => passesNear(route, [h.lat, h.lon], 70).forEach(p => out.push({ id: "hl/" + i, name: h.name, desc: h.desc, kind: "highlight", prog: p.prog })));
  topPois.filter(p => p.score >= 8 && p.lateral <= 60).forEach(p => passesNear(route, [p.lat, p.lon], 60).forEach(q => out.push({ id: p.id, name: p.name, desc: p.kind, kind: p.kind, prog: q.prog })));
  out.sort((a, b) => a.prog - b.prog);
  // don't announce the same thing twice within 150 m
  return out.filter((x, i) => !out.slice(0, i).some(y => y.name === x.name && Math.abs(y.prog - x.prog) < 150));
}
async function loadPOIs(route, key) {
  const pk = key + ":pois";
  const cached = store.get(pk);
  let pois;
  if (cached && Date.now() - cached.t < 7 * 864e5) pois = cached.pois;
  else {
    state.set({ poisStatus: "loading" });
    try { pois = await fetchPOIs(route.shape); store.set(pk, { t: Date.now(), pois }); }
    catch (e) { console.warn(e); state.set({ poisStatus: "error" }); }
  }
  const ranked = pois ? rankPOIs(pois, route, 5) : { all: [], top: [] };
  state.set({ pois: ranked.top, poisAll: ranked.all, poisStatus: pois ? "ok" : state.data.poisStatus, roadside: buildRoadside(route, state.data.highlights, ranked.top) });
}

/* ---------- live tracking ---------- */
const tracker = {
  fixes: [], heading: null, lost: true, onCount: 0, offCount: 0, jumpCount: 0, lastRerouteAt: 0, lastRerouteFrom: null, detourOff: 0,
  reset() { this.fixes = []; this.heading = null; this.lost = true; this.onCount = 0; this.offCount = 0; this.jumpCount = 0; this.detourOff = 0; },
  anchor(prog) { this.lost = false; this.onCount = 2; this.offCount = 0; this.jumpCount = 0; },
  push(p) {
    const fix = { pos: [p.coords.latitude, p.coords.longitude], acc: p.coords.accuracy || 50, speed: p.coords.speed, head: p.coords.heading };
    this.fixes.push(fix); if (this.fixes.length > 8) this.fixes.shift();
    if (fix.head != null && !isNaN(fix.head) && fix.speed > 0.6) this.heading = fix.head;
    else for (let i = this.fixes.length - 2; i >= 0; i--) { const q = this.fixes[i]; if (haversine(q.pos, fix.pos) >= 8) { this.heading = bearing(q.pos, fix.pos); break; } }
    return fix;
  }
};
function onFix(fix) {
  const d = state.data, r = d.route, pos = fix.pos;
  const onThreshold = Math.max(35, fix.acc * 0.7);
  const patch = { mode: "gps", pos, accuracy: fix.acc, gps: true, weakSignal: false };
  // 1. match against the main route (windowed around where we were; whole route when lost)
  let m = matchToRoute(r, pos, { lastProgress: d.progress, heading: tracker.heading, global: tracker.lost });
  const onRoute = m.dist <= onThreshold;
  if (onRoute) {
    tracker.onCount++; tracker.offCount = 0; tracker.jumpCount = 0;
    if (tracker.lost || tracker.onCount >= 2) { tracker.lost = false; patch.progress = m.prog; patch.offRoute = false; }
    patch.offDist = m.dist;
  } else {
    tracker.onCount = 0; tracker.offCount++;
    patch.offDist = m.dist;
    // maybe we are on the route, just not where the window expected (wrong pass of the loop, or a big skip)
    const g = matchToRoute(r, pos, { global: true, heading: tracker.heading });
    if (g.dist <= onThreshold && Math.abs(g.prog - d.progress) > 250) {
      tracker.jumpCount++;
      if (tracker.jumpCount >= 3) { tracker.jumpCount = 0; tracker.offCount = 0; tracker.lost = false; patch.progress = g.prog; patch.offRoute = false; patch.offDist = g.dist; patch.reroute = null; toast("Re-synced to the route"); }
    } else tracker.jumpCount = 0;
    if (tracker.offCount >= 3 && patch.progress == null) {
      patch.offRoute = true;
      if (m.dist < 150 && m.prog >= d.progress - 30) patch.progress = m.prog; // small wander: keep counting progress along the line
    }
  }
  // 2. detour handling
  if (d.reroute) {
    const rm = matchToRoute(d.reroute.route, pos, { lastProgress: d.reroute.progress, heading: tracker.heading });
    if (rm.dist <= 40) { tracker.detourOff = 0; patch.reroute = { ...d.reroute, progress: rm.prog }; }
    else if (++tracker.detourOff >= 4) { patch.reroute = null; tracker.detourOff = 0; }
    if (onRoute && tracker.onCount >= 2) { patch.reroute = null; patch.offRoute = false; }
  }
  const nowOff = patch.offRoute ?? d.offRoute;
  if (nowOff && !d.reroute && m.dist > 60 && !d.rerouting) {
    const since = Date.now() - tracker.lastRerouteAt, moved = tracker.lastRerouteFrom ? haversine(tracker.lastRerouteFrom, pos) : 1e9;
    if (since > 30000 && moved > 40) requestReroute(pos, positionAt(r, Math.max(d.progress, m.prog) + 15).pos);
  }
  state.set(patch);
}
async function requestReroute(from, to) {
  tracker.lastRerouteAt = Date.now(); tracker.lastRerouteFrom = from;
  state.set({ rerouting: true });
  try {
    let leg = await routeOSRM([{ lat: from[0], lon: from[1] }, { lat: to[0], lon: to[1] }]);
    if (state.data.ways) leg = enrichRoute(leg, state.data.ways);
    if (leg.maneuvers.length) { const last = leg.maneuvers[leg.maneuvers.length - 1]; if (last.kind === "arrive") last.text = "Rejoin the route"; }
    if (state.data.mode === "gps" && state.data.offRoute) { state.set({ reroute: { route: leg, progress: 0, from, to }, rerouting: false }); toast(`Detour: ${fmtDist(leg.length)} back to the route`); }
    else state.set({ rerouting: false });
  } catch (e) { console.warn("reroute failed", e); state.set({ rerouting: false }); }
}
function startGPS() {
  if (!navigator.geolocation) { toast("Geolocation isn't available in this browser."); return; }
  if (location.protocol === "file:" || !window.isSecureContext) {
    alert("Browsers refuse location access to pages opened straight from a file (file://) or over plain http.\n\nTo use GPS, open this file from an https address (e.g. GitHub Pages, Netlify Drop, your own web server) or, on a computer, from http://localhost.\n\nPreview mode still works: drag the slider or tap the route to move along the walk.");
    return;
  }
  const btn = $("#gpsBtn"); btn.classList.add("busy");
  tracker.reset();
  watchId = navigator.geolocation.watchPosition(p => {
    btn.classList.remove("busy"); btn.classList.add("on");
    const r = state.data.route; if (!r) return;
    if ((p.coords.accuracy || 0) > 80) { // too vague to match against streets 10 m apart
      state.set({ mode: "gps", gps: true, pos: [p.coords.latitude, p.coords.longitude], accuracy: p.coords.accuracy, weakSignal: true });
      return;
    }
    onFix(tracker.push(p));
  }, err => {
    btn.classList.remove("busy");
    if (err.code === 1) alert("Location permission was denied.\n\nCheck the site's location permission in the browser (the padlock/aA icon in the address bar) and that Location Services are on for the browser in the phone's settings, then tap GPS again.\n\nPreview mode keeps working in the meantime.");
    else toast("Couldn't get a GPS fix: " + err.message);
    stopGPS();
  }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
  state.set({ mode: "gps", gps: true });
  document.getElementById("map").setFollow(true);
  if (navigator.wakeLock) navigator.wakeLock.request("screen").then(l => (window._wl = l)).catch(() => { });
}
function stopGPS() {
  if (watchId != null) navigator.geolocation.clearWatch(watchId); watchId = null;
  $("#gpsBtn").classList.remove("on", "busy");
  window._wl?.release?.();
  const r = state.data.route;
  state.set({ mode: "preview", gps: false, offRoute: false, reroute: null, rerouting: false, weakSignal: false, ...(r ? { pos: positionAt(r, state.data.progress).pos } : {}) });
}
/* ---------- New walk planner: names in, geocoded stops out ---------- */
const PHOTON = "https://photon.komoot.io/api/";
const NOMINATIM = "https://nominatim.openstreetmap.org/search";
async function geocode(q, bias) {
  try {
    const u = `${PHOTON}?q=${encodeURIComponent(q)}&limit=1&lang=en${bias ? `&lat=${bias[0]}&lon=${bias[1]}` : ""}`;
    const r = await fetch(u); if (r.ok) { const f = (await r.json()).features?.[0]; if (f) { const pr = f.properties || {}; return { lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0], label: [pr.name, pr.street && pr.name !== pr.street ? pr.street : "", pr.city].filter(Boolean).join(", ") }; } }
  } catch (e) { console.warn("photon", e); }
  try {
    await new Promise(res => setTimeout(res, 1100)); // Nominatim asks for ≤ 1 request per second
    const r = await fetch(`${NOMINATIM}?q=${encodeURIComponent(q)}&format=json&limit=1&accept-language=en`);
    if (r.ok) { const j = (await r.json())[0]; if (j) return { lat: +j.lat, lon: +j.lon, label: j.display_name.split(",").slice(0, 3).join(",") }; }
  } catch (e) { console.warn("nominatim", e); }
  return null;
}
const planner = {
  stops: [], tapMode: false, busy: false,
  open() {
    document.body.classList.add("planning"); document.body.classList.remove("map-full");
    if (!$("#planName").value) $("#planName").value = "";
    this.render(); document.getElementById("map").setPlanPins(this.stops);
  },
  close() { document.body.classList.remove("planning"); document.getElementById("map").planLayer.clearLayers(); document.getElementById("map").fit(); },
  parse(text) {
    return text.split(/\n/).map(l => l.trim()).filter(Boolean).map(l => {
      let start = false;
      l = l.replace(/^(\d+[.)]|[-•*])\s*/, "");
      if (/^start\s*:/i.test(l)) { start = true; l = l.replace(/^start\s*:\s*/i, ""); }
      const m = l.match(/^(.*?)\s+(?:—|–|-|:)\s+(.*)$/);
      return { text: l, name: (m ? m[1] : l).trim(), desc: m ? m[2].trim() : "", start, lat: null, lon: null, status: "pending" };
    });
  },
  async find() {
    if (this.busy) return;
    const city = $("#planCity").value.trim();
    const fresh = this.parse($("#planText").value);
    // keep coordinates of stops the user already fixed by dragging
    fresh.forEach(st => { const old = this.stops.find(o => o.text === st.text && o.lat != null); if (old) Object.assign(st, { lat: old.lat, lon: old.lon, status: old.status, label: old.label }); });
    this.stops = fresh; this.busy = true; this.render();
    let bias = null;
    if (city) { const c = await geocode(city); if (c) bias = [c.lat, c.lon]; }
    for (const st of this.stops) {
      if (st.lat != null) continue;
      $("#planStatus").textContent = `Looking up “${st.name}”…`;
      const q = city && !st.name.toLowerCase().includes(city.toLowerCase()) ? `${st.name}, ${city}` : st.name;
      const g = await geocode(q, bias);
      if (g && (!bias || haversine(bias, [g.lat, g.lon]) < 40000)) { st.lat = g.lat; st.lon = g.lon; st.label = g.label; st.status = "ok"; }
      else st.status = "missing";
      this.render(); document.getElementById("map").setPlanPins(this.stops);
    }
    this.busy = false;
    const missing = this.stops.filter(s => s.status === "missing").length;
    $("#planStatus").textContent = missing ? `${missing} not found — rephrase them (add the street or district) or tap the map to place them.` : "Check the pins, drag any that are off, then build the route.";
    this.render();
  },
  addAt(lat, lon) {
    const n = this.stops.length + 1;
    this.stops.push({ text: `Stop ${n}`, name: `Stop ${n}`, desc: "", lat, lon, status: "ok", label: `${lat.toFixed(5)}, ${lon.toFixed(5)}` });
    // reverse-geocode a friendlier name in the background
    fetch(`https://photon.komoot.io/reverse?lat=${lat}&lon=${lon}&lang=en`).then(r => r.json()).then(j => {
      const pr = j.features?.[0]?.properties; const st = this.stops[n - 1];
      if (pr && st && st.name === `Stop ${n}`) { st.name = pr.name || [pr.housenumber, pr.street].filter(Boolean).join(" ") || st.name; st.label = pr.city || ""; this.render(); document.getElementById("map").setPlanPins(this.stops); }
    }).catch(() => { });
    this.render(); document.getElementById("map").setPlanPins(this.stops);
  },
  moved(i, lat, lon) { const st = this.stops[i]; if (!st) return; st.lat = lat; st.lon = lon; st.status = "ok"; st.label = "moved by hand"; this.render(); },
  remove(i) { this.stops.splice(i, 1); this.render(); document.getElementById("map").setPlanPins(this.stops); },
  move(i, dir) { const j = i + dir; if (j < 0 || j >= this.stops.length) return; [this.stops[i], this.stops[j]] = [this.stops[j], this.stops[i]]; this.render(); document.getElementById("map").setPlanPins(this.stops); },
  prompt() {
    const city = $("#planCity").value.trim() || "the city";
    const first = this.parse($("#planText").value)[0];
    const start = first ? first.name : "[start address]";
    const km = $("#planKm").value || 8, loop = $("#planLoop").checked;
    return `Plan a sightseeing walking route in ${city} starting at ${start}, about ${km} km${loop ? ", finishing back at the start" : ""}. Reply with ONLY a plain list of stops in walking order, one per line, in exactly this format:\n\nPlace name — one sentence on why it is worth stopping\n\nUse the exact, searchable name of each place as it appears on a map (for example "Pont Neuf" or "Place des Vosges"), 8 to 14 stops, and include a stop at any street or square worth walking along so the route follows an interesting path rather than the shortest one. No numbering, no coordinates, no introduction or closing text.`;
  },
  build() {
    const stops = this.stops.filter(s => s.lat != null);
    if (stops.length < 2) return;
    const name = $("#planName").value.trim() || `${$("#planCity").value.trim() || "New"} walk`;
    const loop = $("#planLoop").checked;
    const rte = loop ? stops.concat([stops[0]]) : stops;
    const gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Paris Walk planner" xmlns="http://www.topografix.com/GPX/1/1">\n  <metadata><name>${esc(name)}</name></metadata>\n` +
      stops.map(s => `  <wpt lat="${s.lat.toFixed(6)}" lon="${s.lon.toFixed(6)}"><name>${esc(s.name)}</name>${s.desc ? `<desc>${esc(s.desc)}</desc>` : ""}</wpt>`).join("\n") +
      `\n  <rte><name>${esc(name)}</name>\n` + rte.map(s => `    <rtept lat="${s.lat.toFixed(6)}" lon="${s.lon.toFixed(6)}"><name>${esc(s.name)}</name></rtept>`).join("\n") + `\n  </rte>\n</gpx>\n`;
    this.close();
    loadWalk(gpx).catch(e => toast(e.message));
  },
  render() {
    const ol = $("#planStops");
    ol.innerHTML = this.stops.map((st, i) => `<li class="plan-stop ${st.status}"><span class="n">${i + 1}</span>
      <span><span class="name">${esc(st.name)}</span>${st.desc ? ` <span class="where">— ${esc(st.desc)}</span>` : ""}<br><span class="where">${st.status === "pending" ? "looking up…" : st.status === "missing" ? "not found — drag a pin here or rephrase" : esc(st.label || "")}</span></span>
      <span class="ctl"><button data-act="up" title="Move up">▲</button><button data-act="down" title="Move down">▼</button><button data-act="del" title="Remove">✕</button></span></li>`).join("");
    ol.querySelectorAll(".plan-stop").forEach((li, i) => {
      li.querySelector('[data-act="up"]').onclick = () => this.move(i, -1);
      li.querySelector('[data-act="down"]').onclick = () => this.move(i, 1);
      li.querySelector('[data-act="del"]').onclick = () => this.remove(i);
    });
    $("#planBuild").disabled = this.busy || this.stops.filter(s => s.lat != null).length < 2;
    $("#planFind").disabled = this.busy;
  }
};
$("#newWalkBtn").onclick = () => planner.open();
$("#planClose").onclick = () => planner.close();
$("#planFind").onclick = () => planner.find();
$("#planBuild").onclick = () => planner.build();
$("#planTap").onchange = e => { planner.tapMode = e.target.checked; if (planner.tapMode) toast("Tap the map to add a stop"); };
$("#planPrompt").onclick = async () => {
  const text = planner.prompt();
  try { await navigator.clipboard.writeText(text); toast("Prompt copied — paste it into your AI, then paste its answer here."); }
  catch { prompt("Copy this prompt:", text); }
};
$("#gpsBtn").onclick = () => state.data.gps ? stopGPS() : startGPS();
$("#menuBtn").onclick = e => { e.stopPropagation(); $("#menuList").classList.toggle("open"); };
document.addEventListener("click", e => { if (!e.target.closest(".menu")) $("#menuList").classList.remove("open"); });
$("#gpxFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { await loadWalk(await f.text()); toast(`Loaded ${f.name}`); } catch (err) { toast(err.message); }
  e.target.value = "";
};
$("#exportBtn").onclick = () => {
  const d = state.data; if (!d.route) return;
  const blob = new Blob([toGPX(d.name, d.route.shape, d.highlights)], { type: "application/gpx+xml" });
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: d.name.replace(/[^\w\-]+/g, "_") + "_snapped.gpx" });
  document.body.appendChild(a); a.click(); a.remove();
};
$("#rerouteBtn").onclick = () => loadWalk(store.get("walk:gpx") || $("#default-gpx").textContent, { force: true });
$("#resetBtn").onclick = () => { store.del("walk:gpx"); loadWalk($("#default-gpx").textContent); };
$("#aboutBtn").onclick = () => alert(
  "Paris Walk — a single-file walking companion.\n\n" +
  "• Route points come from your GPX; footpath routing by Valhalla (valhalla1.openstreetmap.de), with OSRM foot (routing.openstreetmap.de) as fallback. Both are free community servers — be gentle with them.\n" +
  "• Map tiles © OpenStreetMap contributors.\n" +
  "• Sights along the route come from OpenStreetMap via Overpass; facts on tap come from Wikipedia. Curated facts for the built-in loop were written by hand.\n" +
  "• Routes and sights are cached in this browser so the walk works with a flaky signal once loaded; map tiles still need a connection.\n" +
  (state.data.route ? `\nCurrent route: ${state.data.route.provider}` : "")
);

// Boot: use the last imported GPX if any, otherwise the built-in loop
loadWalk(store.get("walk:gpx") || $("#default-gpx").textContent);
</script>
