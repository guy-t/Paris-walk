<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d5e">
<title>Yonne & Nivernais — Migennes to Tannay by boat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #f3f5f4; --panel: #ffffff; --ink: #14212b; --muted: #64737f; --line: #e1e6e9;
    --accent: #0f3d5e; --water: #1d6fa5; --lock: #b45309; --bridge: #6b7280; --moor: #15803d; --warn: #b91c1c;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.08);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  header.bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); background: var(--accent); color: #f1f6fa; }
  header.bar h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header.bar button { background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 999px; padding: 6px 11px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  header.bar button.on { background: #22c55e; color: #052e16; }
  header.bar button.busy { opacity: .7; }
  header.bar .menu { position: relative; }
  .menu-list { position: absolute; right: 0; top: 40px; background: var(--panel); color: var(--ink); border-radius: 12px; box-shadow: var(--shadow); min-width: 250px; z-index: 1200; padding: 6px; display: none; }
  .menu-list.open { display: block; }
  .menu-list button { display: block; width: 100%; text-align: left; background: none; color: var(--ink); border: 0; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
  .menu-list button:hover { background: var(--bg); }
  .menu-list small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .menu-list hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }

  /* dashboard */
  canal-dash { display: block; background: var(--panel); border-bottom: 1px solid var(--line); }
  .status { display: flex; align-items: center; gap: 8px; padding: 6px 12px 0; font-size: 12px; color: var(--muted); flex-wrap: nowrap; }
  .status #statusText { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; }
  .status .dot.live { background: #15803d; box-shadow: 0 0 0 3px rgba(21,128,61,.18); }
  .status .dot.off { background: var(--warn); }
  .status .spacer { flex: 1; }
  .status .iconbtn { border: 0; background: var(--bg); color: var(--muted); border-radius: 999px; width: 26px; height: 26px; font-size: 12px; display: grid; place-items: center; }
  .status .dir { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 600; }
  .cards { display: grid; grid-template-columns: 1fr; gap: 6px; padding: 6px 10px 8px; }
  .card { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--bg); }
  .card.lock { background: #fff7ed; }
  .card.warn { background: #fef2f2; }
  .card .ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: #fff; }
  .card .ic svg { width: 22px; height: 22px; }
  .card.lock .ic { background: var(--lock); }
  .card.bridge .ic { background: var(--bridge); }
  .card.moor .ic { background: var(--moor); }
  .card.warn .ic { background: var(--warn); }
  .card.dest .ic { background: var(--water); }
  .card .t { min-width: 0; }
  .card .k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .card .n { font-weight: 700; font-size: 17px; line-height: 1.2; }
  .card.lock .n { font-size: 19px; }
  .card .s { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .d { text-align: right; white-space: nowrap; }
  .card .d b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .card .d span { font-size: 12px; color: var(--muted); }
  .card .s.alert { color: var(--warn); font-weight: 600; }
  .scrub { display: flex; align-items: center; gap: 6px; padding: 0 10px 10px; font-size: 12px; color: var(--muted); }
  .scrub input[type=range] { flex: 1; accent-color: var(--accent); min-width: 60px; }
  .scrub button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 8px; font-size: 12px; white-space: nowrap; }
  .scrub .lab { min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; font-size: 11px; }
  canal-dash.compact .cards .card:not(.lock), canal-dash.compact .scrub { display: none; }
  .dash-empty { padding: 16px 14px; color: var(--muted); font-size: 14px; }

  /* map */
  canal-map { display: block; flex: 1; min-height: 160px; position: relative; }
  canal-map .map { position: absolute; inset: 0; background: #dfe8ee; }
  .map-fabs { position: absolute; right: 10px; bottom: 12px; z-index: 900; display: flex; flex-direction: column; gap: 8px; }
  .fab { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--panel); color: var(--ink); box-shadow: var(--shadow); display: grid; place-items: center; }
  .fab.on { background: var(--accent); color: #fff; }
  .fab svg { width: 20px; height: 20px; }
  .leaflet-container { font: inherit; }
  .boat-marker { width: 22px; height: 22px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: #1d4ed8; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
  .mk { border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
  .mk.lock { width: 20px; height: 20px; background: var(--lock); border-radius: 4px; }
  .mk.bridge { width: 12px; height: 12px; background: var(--bridge); }
  .mk.moor { width: 16px; height: 16px; background: var(--moor); }
  .mk.hazard { width: 16px; height: 16px; background: var(--warn); }
  .mk.poi { width: 10px; height: 10px; background: #d97706; }
  .leaflet-popup-content { margin: 10px 12px; font-size: 13px; line-height: 1.35; }
  .map-note { position: absolute; left: 10px; top: 10px; z-index: 900; background: rgba(255,255,255,.92); border-radius: 10px; padding: 6px 10px; font-size: 12px; color: var(--muted); box-shadow: var(--shadow); max-width: 70%; }

  /* sheet */
  canal-nearby { display: flex; flex-direction: column; flex-shrink: 0; background: var(--panel); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(0,0,0,.06); z-index: 950; transition: max-height .25s ease; max-height: 52px; overflow: hidden; }
  canal-nearby.open { max-height: 58vh; }
  .sheet-head { position: relative; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; cursor: pointer; user-select: none; flex-shrink: 0; }
  .sheet-head .grip { width: 36px; height: 4px; border-radius: 2px; background: #d4d4d4; position: absolute; left: 50%; transform: translateX(-50%); top: 6px; }
  .sheet-head h2 { font-size: 15px; margin: 0; flex: 1; }
  .sheet-head .count { font-size: 12px; color: var(--muted); }
  .sheet-head .close { border: 0; background: var(--bg); color: var(--ink); border-radius: 999px; width: 30px; height: 30px; font-size: 16px; display: none; place-items: center; }
  canal-nearby.open .sheet-head .close { display: grid; }
  canal-nearby.open .sheet-head #chev { display: none; }
  .tabs { display: flex; gap: 4px; padding: 0 10px 8px; flex-shrink: 0; overflow-x: auto; }
  .tabs button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .sheet-body { overflow-y: auto; flex: 1; min-height: 0; padding: 0 10px 12px; -webkit-overflow-scrolling: touch; }
  .poi { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; background: var(--panel); }
  .poi-head { display: flex; align-items: baseline; gap: 8px; cursor: pointer; }
  .poi-head .name { font-weight: 600; font-size: 14px; flex: 1; }
  .poi-head .kind { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .poi-head .dist { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .poi-head .caret { color: var(--muted); font-size: 11px; transition: transform .15s; }
  .poi.open .poi-head .caret { transform: rotate(180deg); }
  .poi-body { display: none; margin-top: 8px; font-size: 13px; line-height: 1.45; color: #374151; }
  .poi.open .poi-body { display: block; }
  .poi-body img { float: right; width: 84px; height: 84px; object-fit: cover; border-radius: 8px; margin: 0 0 6px 10px; }
  .poi-body .fact { margin: 0 0 6px; }
  .poi-body .meta { font-size: 12px; color: var(--muted); margin-top: 6px; clear: both; }
  .poi-body a { color: var(--water); }
  .poi-body .actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .poi-body .actions button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 10px; font-size: 12px; }
  .poi.passed { opacity: .55; }
  .sheet-empty { color: var(--muted); font-size: 13px; padding: 12px 6px; }
  .group-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 10px 4px 6px; }

  /* settings */
  #settings { display: none; flex-direction: column; background: var(--panel); border-bottom: 1px solid var(--line); max-height: 70vh; flex-shrink: 0; }
  body.settings #settings { display: flex; }
  body.settings canal-dash, body.settings canal-nearby, body.settings .map-note { display: none !important; }
  .set-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px 6px; flex-shrink: 0; }
  .set-head h2 { margin: 0; font-size: 16px; flex: 1; }
  .set-head .close { border: 0; background: var(--bg); color: var(--ink); border-radius: 999px; width: 30px; height: 30px; font-size: 16px; }
  .set-body { overflow-y: auto; padding: 0 12px 12px; }
  .set-body label { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .set-body input, .set-body select { font: inherit; font-size: 14px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 110px; background: var(--panel); color: var(--ink); }
  .set-body .hint { font-size: 12px; color: var(--muted); margin: 8px 0; line-height: 1.4; }
  .set-body button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin: 6px 6px 0 0; }

  /* full-screen map */
  body.map-full { display: flex; flex-direction: column; }
  body.map-full header.bar, body.map-full canal-nearby, body.map-full .map-note { display: none !important; }
  body.map-full canal-map { flex: 1; }
  body.map-full canal-dash { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 8px; right: 8px; z-index: 1000; border-radius: 14px; border: 0; box-shadow: var(--shadow); overflow: hidden; }

  .toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 13px; z-index: 2000; box-shadow: var(--shadow); max-width: 90vw; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .overlay { position: fixed; inset: 0; background: rgba(243,245,244,.94); z-index: 1500; display: grid; place-items: center; text-align: center; padding: 24px; font-size: 15px; color: var(--muted); }
  .overlay .spinner { width: 28px; height: 28px; border: 3px solid #d1d5db; border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
  .overlay b { color: var(--ink); }
  .overlay button { margin-top: 12px; border: 0; background: var(--accent); color: #fff; border-radius: 8px; padding: 8px 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (min-width: 900px) {
    body { display: grid; grid-template-columns: 420px 1fr; grid-template-rows: auto 1fr; }
    header.bar { grid-column: 1 / -1; }
    canal-dash, #settings { grid-row: 2; grid-column: 1; overflow-y: auto; border-right: 1px solid var(--line); border-bottom: 0; max-height: none; }
    canal-map { grid-row: 2; grid-column: 2; }
    canal-nearby { position: absolute; right: 12px; top: 64px; width: 380px; border-radius: 14px; border: 1px solid var(--line); box-shadow: var(--shadow); }
    canal-nearby.open { max-height: min(70vh, 720px); }
  }
</style>
</head>
<body>

<header class="bar">
  <h1 id="title">Migennes → Tannay</h1>
  <button id="gpsBtn" title="Follow the boat"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg><span>GPS</span></button>
  <div class="menu">
    <button id="menuBtn" title="More">⋯</button>
    <div class="menu-list" id="menuList">
      <button id="settingsBtn">Settings<small>Cruising speed, lock times, lock hours, direction</small></button>
      <button id="refreshBtn">Reload canal data<small>Fetches the waterway, locks, bridges and moorings again</small></button>
      <button id="seamarkBtn">Show OpenSeaMap marks<small>Buoys, beacons and notice boards as a map overlay</small></button>
      <button id="exportBtn">Export route as GPX</button>
      <hr>
      <button data-link="https://www.vnf.fr/vnf/services/avisbat/">VNF notices to skippers<small>Avis à la batellerie — closures, draught, works</small></button>
      <button data-link="https://www.vnf.fr/vnf/services/navi/">VNF Navi app<small>Live water levels, unavailable locks, clearances</small></button>
      <button data-link="https://www.canal-du-nivernais.com/carte-interactive/">Nivernais interactive map<small>Official: ports, haltes, services, restaurants</small></button>
      <button data-link="https://www.french-waterways.com/waterways/central/canal-nivernais/">French Waterways guide<small>Distances, locks, moorings, practicalities</small></button>
      <button id="debugBtn">Copy data summary<small>For troubleshooting</small></button>
      <hr>
      <button id="aboutBtn">About &amp; data sources</button>
    </div>
  </div>
</header>

<div id="settings">
  <div class="set-head"><h2>Settings</h2><button class="close" id="setClose">✕</button></div>
  <div class="set-body">
    <label>Direction <select id="setDir"><option value="auto">Auto-detect</option><option value="out">Towards Tannay</option><option value="back">Towards Migennes</option></select></label>
    <label>Cruising speed when GPS speed is unknown (km/h) <input type="number" id="setSpeed" min="2" max="15" step="0.5"></label>
    <label>Minutes per lock <input type="number" id="setLockMin" min="5" max="40" step="1"></label>
    <label>Locks open from <input type="time" id="setOpen"></label>
    <label>Locks close at <input type="time" id="setClose"></label>
    <label>Lunch closure (leave empty if none) <span><input type="time" id="setLunch1" style="width:90px"> – <input type="time" id="setLunch2" style="width:90px"></span></label>
    <label>Home mooring / start <input type="text" id="setHome" placeholder="Migennes" style="width:150px"></label>
    <p class="hint">Speed limit is 7 km/h on the canal (slower past moored boats). VNF lock hours vary by month — check the notice at your first lock and set them here; the app then warns when the next lock is likely to close before you reach it.</p>
    <button id="setSave">Save</button>
  </div>
</div>

<canal-dash id="dash"></canal-dash>
<canal-map id="map"></canal-map>
<canal-nearby id="nearby"></canal-nearby>

<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div><div class="spinner"></div><div id="overlayText">Loading the waterway from OpenStreetMap…</div></div></div>

<script>
/* =====================================================================
   Route definition: Migennes (Le Boat port on the Canal de Bourgogne junction)
   → river Yonne upstream → Auxerre → Canal du Nivernais → Tannay.
   The navigable line is derived from OpenStreetMap's waterway graph at runtime.
   ===================================================================== */
const ROUTE = {
  name: "Migennes → Tannay",
  from: { name: "Migennes (port)", lat: 47.9640, lon: 3.5215 },
  to: { name: "Tannay (halte)", lat: 47.3655, lon: 3.5915 },
  bbox: [47.30, 3.38, 48.02, 3.80] // south, west, north, east
};

/* Curated stops with facts — snapped to the waterway at runtime (coordinates are approximate) */
const CURATED = [
  { name: "Migennes", lat: 47.964, lon: 3.521, kind: "port", desc: "Port de plaisance at the Canal de Bourgogne junction; hire base, water, electricity, fuel nearby.", facts: ["Migennes grew up around the railway works and the junction where the Canal de Bourgogne meets the Yonne at Laroche-Saint-Cydroine. The lock at Laroche is the last of the Bourgogne canal's 189."] },
  { name: "Gurgy", lat: 47.869, lon: 3.561, kind: "halte", desc: "Small halte on the Yonne with a village bakery a short walk away." },
  { name: "Auxerre", lat: 47.798, lon: 3.575, kind: "port", desc: "Port de plaisance below the old town; water, electricity, shops, restaurants.", facts: ["The skyline of three churches — Saint-Étienne cathedral, the abbey of Saint-Germain and Saint-Pierre — rises above the quays. Saint-Germain's crypt holds 9th-century frescoes, among the oldest in France.", "The canal du Nivernais officially begins here (PK 0); its 174 km and 112 locks climb to the summit at Baye then descend to the Loire at Decize."] },
  { name: "Vaux", lat: 47.760, lon: 3.612, kind: "halte", desc: "Quiet halte at the village of Vaux." },
  { name: "Vincelles", lat: 47.706, lon: 3.630, kind: "halte", desc: "Halte nautique with a restaurant; Irancy and Saint-Bris wine villages up the hill.", facts: ["Bailly, across the river, hides the Caves de Bailly: 4 hectares of underground quarry galleries that supplied stone for the Panthéon and Notre-Dame, now used to age Crémant de Bourgogne."] },
  { name: "Cravant (Bazarnes)", lat: 47.684, lon: 3.690, kind: "halte", desc: "Halte near the fortified village of Cravant, where the Cure meets the Yonne.", facts: ["Cravant kept its 14th-century ramparts and gate; in 1423 an Anglo-Burgundian army beat a Franco-Scottish force here in one of the Hundred Years' War's forgotten battles."] },
  { name: "Mailly-la-Ville", lat: 47.629, lon: 3.650, kind: "halte", desc: "Halte with water; bakery in the village." },
  { name: "Rochers du Saussois", lat: 47.617, lon: 3.646, kind: "sight", desc: "50 m limestone cliffs rising straight from the river — the classic view of the Nivernais.", facts: ["The Saussois cliffs at Merry-sur-Yonne were where French climbing was born in the 1930s; you'll usually see climbers on the faces above the towpath."] },
  { name: "Mailly-le-Château", lat: 47.590, lon: 3.652, kind: "halte", desc: "Halte below the hilltop village; the medieval bridge with its tiny chapel is just upstream.", facts: ["The 15th-century bridge carries a chapel to Saint Nicholas, patron of boatmen; the village on the cliff above has a 13th-century church and a terrace looking down on the river."] },
  { name: "Châtel-Censoir", lat: 47.535, lon: 3.633, kind: "halte", desc: "Port with water and electricity; village shops.", facts: ["Above the port, the collegiate church of Saint-Potentien has a Romanesque choir of the 11th century and a Renaissance nave — one of the finest churches of the valley."] },
  { name: "Coulanges-sur-Yonne", lat: 47.523, lon: 3.545, kind: "halte", desc: "Halte in the village; supermarket, bakery and restaurants close to the water." },
  { name: "Clamecy", lat: 47.461, lon: 3.518, kind: "port", desc: "Port de plaisance; the biggest town between Auxerre and Tannay, with all shops.", facts: ["Clamecy was the capital of the flotteurs — the log-drivers who floated timber from the Morvan down the Yonne to heat Paris for three centuries. The Romain Rolland museum tells the story; the writer was born here in 1866.", "Boats leave the Yonne for good at Clamecy: from here to the summit it is canal all the way."] },
  { name: "Tannay", lat: 47.366, lon: 3.591, kind: "port", desc: "Halte nautique at the foot of the wine village; hire base, water, electricity.", facts: ["Tannay sits on a hill above the canal, ringed by the smallest appellation of the Nièvre — a handful of hectares of Chardonnay and Melon vines. The collegiate church of Saint-Léger dates from the 13th century."] }
];

/* =====================================================================
   Utilities
   ===================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
const R = 6371000;
function haversine(a, b) { const toRad = d => d * Math.PI / 180; const dLat = toRad(b[0] - a[0]), dLon = toRad(b[1] - a[1]); const s = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.sin(dLon / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(s)); }
function bearing(a, b) { const toRad = d => d * Math.PI / 180; const y = Math.sin(toRad(b[1] - a[1])) * Math.cos(toRad(b[0])); const x = Math.cos(toRad(a[0])) * Math.sin(toRad(b[0])) - Math.sin(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.cos(toRad(b[1] - a[1])); return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360; }
function fmtDist(m) { return m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(m < 10000 ? 1 : 0)} km`; }
function fmtKm(m) { return `${(m / 1000).toFixed(1)} km`; }

/* =====================================================================
   Wikipedia (English first)
   ===================================================================== */
async function wikiSummary(tags) {

  if (tags["wikipedia:en"]) { const s = await tryEn(tags["wikipedia:en"]); if (s) return s; }
  let lang = null, title = null;
  if (tags.wikipedia) { const m = tags.wikipedia.match(/^(\w+):(.+)$/); if (m) { lang = m[1]; title = m[2]; } else { lang = "en"; title = tags.wikipedia; } }
  if (title && lang === "en") { const s = await tryEn(title); if (s) return s; }
  if (title && lang !== "en") { try { const r = await fetch(`https://${lang}.wikipedia.org/w/api.php?action=query&prop=langlinks&lllang=en&redirects=1&format=json&origin=*&titles=${encodeURIComponent(title)}`); const j = r.ok ? await r.json() : null; const en = Object.values(j?.query?.pages || {})[0]?.langlinks?.[0]?.["*"]; if (en) { const s = await tryEn(en); if (s) return s; } } catch { } }
  if (tags.wikidata) { try { const r = await fetch(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${encodeURIComponent(tags.wikidata)}&props=sitelinks&format=json&origin=*`); const ent = r.ok ? Object.values((await r.json()).entities || {})[0] : null; const sl = ent?.sitelinks || {}; if (sl.enwiki) { const s = await tryEn(sl.enwiki.title); if (s) return s; } if (!title && sl.frwiki) { lang = "fr"; title = sl.frwiki.title; } } catch { } }
  if (title && lang) { try { return await summary(lang, title); } catch { return null; } }
  return null;
}

  data: { route: null, feats: null, pos: null, accuracy: null, gps: false, mode: "preview", progress: 0, speed: null, heading: null, dir: "out", offWater: false, offDist: 0, weak: false },
  subs: new Set(),
  set(patch) { Object.assign(this.data, patch); this.subs.forEach(fn => fn(this.data, patch)); },
  on(fn) { this.subs.add(fn); }
};
/* what lies ahead in the direction of travel */
function ahead(list, progress, dir, n = 3, minGap = 20) {
  const items = dir === "out" ? list.filter(x => x.prog > progress + minGap).sort((a, b) => a.prog - b.prog) : list.filter(x => x.prog < progress - minGap).sort((a, b) => b.prog - a.prog);
  return items.slice(0, n).map(x => ({ ...x, in: Math.abs(x.prog - progress) }));
}
function speedMps() { const s = state.data.speed; return (state.data.mode === "gps" && s != null && s > 0.4) ? s : settings.speed / 3.6; }
function lockHoursToday() {
  const parse = t => { if (!t) return null; const [h, m] = t.split(":").map(Number); const d = new Date(); d.setHours(h, m, 0, 0); return d; };
  return { open: parse(settings.open), close: parse(settings.close), lunch1: parse(settings.lunch1), lunch2: parse(settings.lunch2) };
}
/* ETA to a point `dist` metres ahead with `locksBefore` locks in between, allowing for lock hours */
function eta(dist, locksBefore) {
  const travel = dist / speedMps() + locksBefore * settings.lockMin * 60;
  let t = new Date(Date.now() + travel * 1000);
  const h = lockHoursToday();
  const notes = [];
  if (h.lunch1 && h.lunch2 && t > h.lunch1 && t < h.lunch2 && locksBefore >= 0) notes.push("lunch closure");
  if (h.close && t > h.close) notes.push("after closing");
  if (h.open && t < h.open) notes.push("before opening");
  return { seconds: travel, at: t, notes };
}

/* =====================================================================

    const r = d.route, f = d.feats, p = d.progress;

      st.textContent = !d.pos ? "Waiting for GPS…" : d.weak ? `Weak GPS (±${Math.round(d.accuracy)} m)` : d.offWater ? `${fmtDist(d.offDist)} from the waterway · ${where}` : `${where} · ${(d.speed != null && d.speed > 0.4 ? (d.speed * 3.6).toFixed(1) + " km/h" : "stationary")}`;

    const html = [];

    if (locks.length) {
      const l = locks[0], e = eta(l.in, 0);
      const next = locks.slice(1).map(x => `${x.label}${x.ref ? " (" + x.ref + ")" : ""} ${fmtKm(x.in)}`).join(" · ");
      const alert = e.notes.length ? `<div class="s alert">Likely ${e.notes.join(", ")} — ETA ${fmtClock(e.at)}, locks ${settings.open}–${settings.close}</div>` : "";
      html.push(`<div class="card lock" data-go="${l.prog}"><div class="ic">${ICON.lock}</div><div class="t"><div class="k">Next lock${l.seq ? ` · ${l.seq} of ${f.locks.length}` : ""}</div><div class="n">${esc(l.label)}${l.ref ? ` <span style="font-weight:500;color:var(--muted)">№ ${esc(l.ref)}</span>` : ""}</div>${alert || `<div class="s">${next ? "then " + esc(next) : "last lock before " + (d.dir === "out" ? "Tannay" : "Migennes")}</div>`}</div><div class="d"><b>${fmtDist(l.in)}</b><span>${fmtTime(e.seconds)} · ${fmtClock(e.at)}</span></div></div>`);

function setPreview(p) {
  const r = state.data.route; if (!r) return;
  p = Math.max(0, Math.min(r.length, p));
  if (state.data.mode === "gps") { state.set({ progress: p }); return; }
  state.set({ progress: p, pos: positionAt(r.line, r.cum, p).pos, offWater: false });
}

   <canal-map>

      <div class="map-fabs">

        <button class="fab" id="full" title="Full-screen map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
        <button class="fab" id="fit" title="Whole route"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>

    L.control.zoom({ position: "bottomleft" }).addTo(map);
    this.seamarks = L.tileLayer("https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png", { maxZoom: 18, attribution: '<a href="https://www.openseamap.org">OpenSeaMap</a>' });
    this.setSeamarks(store.get("canal:seamarks") === true, false);
    this.routeLine = L.polyline([], { color: "#1d6fa5", weight: 5, opacity: .9, smoothFactor: 1.5 }).addTo(map);
    this.doneLine = L.polyline([], { color: "#9ca3af", weight: 5, opacity: .9, smoothFactor: 1.5 }).addTo(map);
    this.layer = L.layerGroup().addTo(map);
    this.boat = L.marker([0, 0], { icon: L.divIcon({ className: "", html: '<div class="boat-marker"></div>', iconSize: [22, 22], iconAnchor: [11, 11] }), zIndexOffset: 1000 });
    this.acc = L.circle([0, 0], { radius: 0, color: "#1d4ed8", weight: 1, fillOpacity: .08 });

    map.on("zoomstart", () => { this.userZooming = true; }); map.on("zoomend", () => { this.userZooming = false; });
    map.on("click", e => { const d = state.data; if (!d.route) return; const p = project(d.route.line, d.route.cum, [e.latlng.lat, e.latlng.lng]); if (!p || p.dist > 300) return; if (d.mode === "preview") setPreview(p.prog); else { state.set({ progress: p.prog }); toast("Position set here"); } });

    $("#full", this).onclick = () => { const on = !document.body.classList.contains("map-full"); document.body.classList.toggle("map-full", on); $("#full", this).classList.toggle("on", on); const dash = document.getElementById("dash"); if (on) { this._wasCompact = dash.classList.contains("compact"); dash.setCompact(true, false); } else dash.setCompact(this._wasCompact ?? false, false); setTimeout(() => { map.invalidateSize(); if (state.data.pos) this.center(false); }, 50); };
    this.lastRoute = null; this.lastFeats = null; this.lastDoneIdx = -1; this.lastDoneAt = 0;

  setFollow(v) { this.follow = v; $("#follow", this).classList.toggle("on", v); }

        d.feats.hazards.forEach(h => mk(h, /^(danger|weir|tunnel)$/.test(h.kind) ? "hazard" : "bridge", /^(danger|weir|tunnel)$/.test(h.kind) ? "!" : "", `<b>${esc(h.name)}</b><br>${esc(h.detail || h.kind)}<br>km ${(h.prog / 1000).toFixed(1)}`));

  }
}

/* =====================================================================
   <canal-nearby>

class CanalNearby extends HTMLElement {
  connectedCallback() {

    this.innerHTML = `
      <div class="sheet-head" id="head"><div class="grip"></div><h2 id="sheetTitle">Nearby</h2><span class="count" id="count"></span><span id="chev">▲</span><button class="close" id="closeSheet">✕</button></div>
      <div class="tabs"><button data-tab="nearby" class="on">Nearby</button><button data-tab="ahead">Ahead</button><button data-tab="moorings">Moorings</button><button data-tab="locks">Locks, bridges &amp; marks</button><button data-tab="sights">Sights</button></div>
      <div class="sheet-body" id="body"></div>`;
    $("#head", this).onclick = () => this.toggle();
    $("#closeSheet", this).onclick = e => { e.stopPropagation(); this.toggle(false); };
    this.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { this.tab = b.dataset.tab; this.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b)); this.render(state.data); });

  toggle(force) { const open = force ?? !this.classList.contains("open"); this.classList.toggle("open", open); $("#chev", this).textContent = open ? "▼" : "▲"; if (open) this.render(state.data); }
  open(id) { this.toggle(true); this.openIds.add(id); const tab = id.startsWith("cur/") || state.data.feats?.moorings.some(m => m.id === id) ? "moorings" : "sights"; this.tab = tab; this.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x.dataset.tab === tab)); this.render(state.data); this.querySelector(`[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({ block: "nearest" }); this.loadWiki(id); }
  refresh(d) { if (this.tab === "nearby" || this.tab === "ahead") this.render(d); else this.querySelectorAll(".poi").forEach(el => { const x = this._list?.find(i => i.id === el.dataset.id); if (x && d.pos) { const lab = el.querySelector(".poi-head .dist"); if (lab) lab.textContent = this.distLabel(x, d); } }); }
  distLabel(x, d) {

    let list = this.items(d), title = "Nearby";
    const p = d.progress, out = d.dir === "out";
    if (this.tab === "nearby") { list = list.filter(x => x.straight != null && x.straight <= 1500 && x.group !== "lock").sort((a, b) => a.straight - b.straight).slice(0, 40); title = "Nearby (within 1.5 km)"; }
    else if (this.tab === "ahead") { list = list.filter(x => x.group !== "lock" && (out ? x.prog > p : x.prog < p) && Math.abs(x.prog - p) <= 8000).sort((a, b) => Math.abs(a.prog - p) - Math.abs(b.prog - p)); title = "Ahead (next 8 km)"; }
    else if (this.tab === "moorings") { list = list.filter(x => x.group === "mooring").sort((a, b) => out ? a.prog - b.prog : b.prog - a.prog); title = "Moorings"; }
    else if (this.tab === "locks") { list = list.filter(x => x.group === "lock").sort((a, b) => out ? a.prog - b.prog : b.prog - a.prog); title = "Locks, bridges & marks"; }
    else { list = list.filter(x => x.group === "sight").sort((a, b) => out ? a.prog - b.prog : b.prog - a.prog); title = "Sights"; }
    count.textContent = `${list.length}`; $("#sheetTitle", this).textContent = title;
    if (!list.length) { body.innerHTML = `<div class="sheet-empty">Nothing here.</div>`; return; }
    this._list = list;
    let html = "", lastGroup = "";
    for (const x of list) {
      if (this.tab === "nearby" || this.tab === "ahead") { const g = { mooring: "Moorings", food: "Food & drink", shop: "Shops", service: "Services", sight: "Sights" }[x.group] || "Other"; if (g !== lastGroup) { html += `<div class="group-title">${g}</div>`; lastGroup = g; } }
      const w = this.wiki[x.id], t = x.tags || {};
      const facts = (x.facts || []).map(f => `<p class="fact">${esc(f)}</p>`).join("");
      const wikiHtml = w === undefined ? "" : w === null ? `<p class="meta">No Wikipedia article found.</p>` : w === "loading" ? `<p class="meta">Loading…</p>` : `${w.thumb ? `<img src="${esc(w.thumb)}" alt="">` : ""}<p class="fact">${esc(w.extract)}</p><p class="meta"><a href="${esc(w.url)}" target="_blank" rel="noopener">Wikipedia${w.lang !== "en" ? ` (${w.lang.toUpperCase()})` : ""}</a></p>`;
      const meta = [x.facilities?.length ? "Facilities: " + esc(x.facilities.join(", ")) : "", t.opening_hours ? "Hours: " + esc(t.opening_hours) : "", t.phone ? esc(t.phone) : "", t.website ? `<a href="${esc(t.website)}" target="_blank" rel="noopener">Website</a>` : "", `km ${(x.prog / 1000).toFixed(1)}`].filter(Boolean).join(" · ");
      const passed = out ? x.prog < p - 50 : x.prog > p + 50;
      const hasWiki = t.wikipedia || t["wikipedia:en"] || t.wikidata;
      html += `<div class="poi ${passed ? "passed" : ""} ${this.openIds.has(x.id) ? "open" : ""}" data-id="${esc(x.id)}">
        <div class="poi-head"><span class="name">${esc(x.name)}</span><span class="kind">${esc(x.kind)}</span><span class="dist">${this.distLabel(x, d)}</span><span class="caret">▼</span></div>
        <div class="poi-body">${x.desc ? `<p class="meta">${esc(x.desc)}</p>` : ""}${facts}${wikiHtml}<p class="meta">${meta}</p>
          <div class="actions"><button data-act="map">Show on map</button>${hasWiki && w === undefined ? `<button data-act="wiki">Read more (Wikipedia)</button>` : ""}</div></div></div>`;
    }
    body.innerHTML = html;
    body.querySelectorAll(".poi").forEach(el => {
      const id = el.dataset.id;
      $(".poi-head", el).onclick = () => { if (this.openIds.has(id)) this.openIds.delete(id); else this.openIds.add(id); el.classList.toggle("open"); };
      $('[data-act="map"]', el).onclick = () => { const x = list.find(i => i.id === id); document.getElementById("map").flyTo([x.lat, x.lon]); };
      const wb = $('[data-act="wiki"]', el); if (wb) wb.onclick = () => this.loadWiki(id);
    });
  }
  async loadWiki(id) {
    const x = this.items(state.data).find(i => i.id === id);
    if (!x || !x.tags || this.wiki[id] !== undefined) return;
    this.wiki[id] = "loading"; this.render(state.data);
    try { this.wiki[id] = await wikiSummary(x.tags); } catch { this.wiki[id] = null; }
    this.render(state.data);
  }
}
customElements.define("canal-nearby", CanalNearby);

/* =====================================================================
   Controller
   ===================================================================== */
const CACHE_KEY = "canal:data:v2:" + ROUTE.name;
async function loadCanal({ force = false } = {}) {
  const overlay = $("#overlay"), ot = $("#overlayText");
  let data = force ? null : store.get(CACHE_KEY);
  if (!data) {
    overlay.classList.remove("hidden");
    try {
      ot.textContent = "Loading the waterway network from OpenStreetMap (this can take a minute)…";
      const wayEls = await fetchWaterways(ROUTE.bbox);
      ot.textContent = "Finding the navigable line…";
      const { line, usedWays } = deriveRoute(wayEls, ROUTE.from, ROUTE.to);
      const slim = simplify(line, 4);
      const cum = cumulative(slim);
      ot.textContent = "Loading locks, bridges, moorings and places along the way…";
      const featEls = await fetchFeatures(slim);
      const feats = buildFeatures(featEls, wayEls, slim, cum);
      const limits = {};
      for (const t of usedWays) for (const k of ["maxheight", "maxwidth", "maxlength", "draft", "maxdraft", "CEMT", "maxspeed"]) if (t[k] && !limits[k]) limits[k] = t[k];
      data = { line: slim, feats, limits, fetched: Date.now() };
      if (!store.set(CACHE_KEY, data)) toast("Too much data to cache in this browser — it will reload next time.");
    } catch (e) {
      console.error(e);
      ot.innerHTML = `<b>Couldn't load the waterway.</b><br>${esc(e.message)}<br><small>Needs a data connection the first time; afterwards it's cached.</small><br><button onclick="loadCanal({force:true})">Retry</button>`;
      return;
    }
  }
  overlay.classList.add("hidden");
  const cum = cumulative(data.line);
  const route = { line: data.line, cum, length: cum[cum.length - 1], limits: data.limits || {} };
  $("#title").textContent = `${ROUTE.name} · ${fmtKm(route.length)} · ${data.feats.locks.length} locks`;
  state.set({ route, feats: data.feats, dir: settings.dir === "back" ? "back" : "out" });
  setPreview(state.data.progress || 0);
  if (!data.feats.locks.length) toast("No locks were found in OpenStreetMap for this stretch — lock cards will be empty.", 5000);
}

/* ---------- GPS ---------- */
let watchId = null, fixes = [];
function onFix(p) {
  const d = state.data, r = d.route; if (!r) return;
  const pos = [p.coords.latitude, p.coords.longitude], acc = p.coords.accuracy || 50;
  if (acc > 150) { state.set({ mode: "gps", gps: true, pos, accuracy: acc, weak: true }); return; }
  const m = project(r.line, r.cum, pos);
  fixes.push({ pos, prog: m.prog, t: p.timestamp || Date.now() }); if (fixes.length > 12) fixes.shift();
  let speed = p.coords.speed;
  if (speed == null || isNaN(speed)) { const a = fixes[0], b = fixes[fixes.length - 1]; const dt = (b.t - a.t) / 1000; if (dt > 5) speed = haversine(a.pos, b.pos) / dt; }
  // direction: from progress trend over the last ~150 m of movement
  let dir = d.dir;
  { const a = fixes[0], b = fixes[fixes.length - 1], delta = b.prog - a.prog;
    if (settings.dir === "auto") { if (Math.abs(delta) > 120) dir = delta > 0 ? "out" : "back"; }
    else { dir = settings.dir; if (Math.abs(delta) > 500 && (delta > 0) !== (dir === "out")) { settings.dir = "auto"; store.set("canal:settings", settings); $("#setDir").value = "auto"; dir = delta > 0 ? "out" : "back"; toast("You seem to be heading the other way — direction set to auto"); } } }
  const off = m.dist > Math.max(80, acc);
  state.set({ mode: "gps", gps: true, pos, accuracy: acc, weak: false, speed, dir, offWater: off, offDist: m.dist, progress: m.dist < 400 ? m.prog : d.progress });
}
function startGPS() {
  if (!navigator.geolocation) { toast("Geolocation isn't available in this browser."); return; }
  if (location.protocol === "file:" || !window.isSecureContext) { alert("Browsers only allow location on https pages (or localhost). Open this from your GitHub Pages address."); return; }
  const btn = $("#gpsBtn"); btn.classList.add("busy"); fixes = [];
  watchId = navigator.geolocation.watchPosition(p => { btn.classList.remove("busy"); btn.classList.add("on"); onFix(p); }, err => {
    btn.classList.remove("busy");
    if (err.code === 1) alert("Location permission was denied. Check the site's location permission (padlock icon) and the phone's Location Services, then tap GPS again."); else toast("No GPS fix: " + err.message);
    stopGPS();
  }, { enableHighAccuracy: true, maximumAge: 3000, timeout: 30000 });
  state.set({ mode: "gps", gps: true });
  document.getElementById("map").setFollow(true);
  if (navigator.wakeLock) navigator.wakeLock.request("screen").then(l => (window._wl = l)).catch(() => { });
}
function stopGPS() {
  if (watchId != null) navigator.geolocation.clearWatch(watchId); watchId = null;
  $("#gpsBtn").classList.remove("on", "busy"); window._wl?.release?.();
  const r = state.data.route;
  state.set({ mode: "preview", gps: false, offWater: false, weak: false, speed: null, ...(r ? { pos: positionAt(r.line, r.cum, state.data.progress).pos } : {}) });
}
$("#gpsBtn").onclick = () => state.data.gps ? stopGPS() : startGPS();
$("#menuBtn").onclick = e => { e.stopPropagation(); $("#menuList").classList.toggle("open"); };
document.addEventListener("click", e => { if (!e.target.closest(".menu")) $("#menuList").classList.remove("open"); });

/* ---------- settings ---------- */
function fillSettings() { $("#setDir").value = settings.dir; $("#setSpeed").value = settings.speed; $("#setLockMin").value = settings.lockMin; $("#setOpen").value = settings.open; $("#setClose").value = settings.close; $("#setLunch1").value = settings.lunch1; $("#setLunch2").value = settings.lunch2; $("#setHome").value = settings.home; }
fillSettings();
$("#settingsBtn").onclick = () => { document.body.classList.add("settings"); document.body.classList.remove("map-full"); };
$("#setClose").onclick = () => document.body.classList.remove("settings");
$("#setSave").onclick = () => {
  Object.assign(settings, { dir: $("#setDir").value, speed: +$("#setSpeed").value || DEFAULTS.speed, lockMin: +$("#setLockMin").value || DEFAULTS.lockMin, open: $("#setOpen").value, close: $("#setClose").value, lunch1: $("#setLunch1").value, lunch2: $("#setLunch2").value, home: $("#setHome").value });
  store.set("canal:settings", settings); document.body.classList.remove("settings");
  state.set({ dir: settings.dir === "back" ? "back" : settings.dir === "out" ? "out" : state.data.dir });
  toast("Settings saved");
};
$("#refreshBtn").onclick = () => { store.del(CACHE_KEY); loadCanal({ force: true }); };
$("#seamarkBtn").onclick = () => { const m = document.getElementById("map"); m.setSeamarks(!m.seamarksOn); };
document.querySelectorAll("#menuList [data-link]").forEach(b => b.onclick = () => window.open(b.dataset.link, "_blank", "noopener"));
$("#exportBtn").onclick = () => {
  const r = state.data.route, f = state.data.feats; if (!r) return;
  const w = f.locks.map(l => `  <wpt lat="${l.lat.toFixed(6)}" lon="${l.lon.toFixed(6)}"><name>${esc(l.label)}${l.ref ? " " + esc(l.ref) : ""}</name><type>lock</type></wpt>`).concat(f.moorings.map(m => `  <wpt lat="${m.lat.toFixed(6)}" lon="${m.lon.toFixed(6)}"><name>${esc(m.name)}</name><type>mooring</type></wpt>`)).join("\n");
  const gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Canal app" xmlns="http://www.topografix.com/GPX/1/1">\n${w}\n  <trk><name>${esc(ROUTE.name)}</name><trkseg>\n${r.line.map(p => `    <trkpt lat="${p[0].toFixed(6)}" lon="${p[1].toFixed(6)}"></trkpt>`).join("\n")}\n  </trkseg></trk>\n</gpx>\n`;
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([gpx], { type: "application/gpx+xml" })), download: "migennes_tannay.gpx" }); document.body.appendChild(a); a.click(); a.remove();
};
$("#debugBtn").onclick = async () => {
  const r = state.data.route, f = state.data.feats; if (!r) return;
  const txt = `Route ${ROUTE.name}: ${fmtKm(r.length)}, ${r.line.length} pts, limits ${JSON.stringify(r.limits)}\nLocks (${f.locks.length}): ${f.locks.map(l => `${(l.prog / 1000).toFixed(1)} ${l.label}${l.ref ? " #" + l.ref : ""}`).join("; ")}\nBridges: ${f.bridges.length}\nMoorings (${f.moorings.length}): ${f.moorings.map(m => `${(m.prog / 1000).toFixed(1)} ${m.name}`).join("; ")}\nHazards: ${f.hazards.map(h => h.name).join("; ")}\nPOIs: ${f.pois.length}`;
  try { await navigator.clipboard.writeText(txt); toast("Summary copied"); } catch { prompt("Data summary:", txt); }
};
$("#aboutBtn").onclick = () => alert(
  "Yonne & Canal du Nivernais — Migennes to Tannay.\n\n" +
  "• The navigable line is derived from OpenStreetMap's waterway network (weighted shortest path, preferring tagged navigable channels and lock cuts over weir arms).\n" +
  "• Locks, bridges, moorings, shops and sights come from OpenStreetMap; a few haltes and facts are curated by hand and snapped to the water (marked approx.).\n" +
  "• ETAs use your GPS speed (or the cruising speed in Settings) plus a fixed time per lock, and warn when the next lock is likely to be shut.\n" +
  "• Map tiles © OpenStreetMap contributors. Facts on tap from Wikipedia.\n\nThis is an aid, not a navigation chart — obey the signs, VNF notices and the lock-keepers." +
  (state.data.route?.limits ? `\n\nWaterway limits from OSM: ${JSON.stringify(state.data.route.limits)}` : "")
);

loadCanal();
