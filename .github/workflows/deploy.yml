name: Deploy

# Every push to main publishes the site to GitHub Pages. Nothing is ever uploaded by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A broken build must never reach the site, so both gates run before
      # anything is assembled.
      - run: pnpm typecheck
      - run: pnpm test

      # Make GitHub Actions the Pages source, so the owner never has to open
      # repository settings.
      #
      # actions/configure-pages' `enablement` only switches Pages *on*; on a
      # site already publishing from a branch it leaves the source alone. That
      # is not a loud failure — the branch keeps serving the committed files,
      # so the old URLs work and the deploy looks green while the built output
      # goes nowhere. Setting build_type explicitly is what actually moves it.
      # Best effort: the Pages *settings* API needs repo-admin rights, which
      # the default GITHUB_TOKEN does not have. It works if PAGES_ADMIN_TOKEN
      # (a PAT with repo admin) is set as a secret; otherwise the source has
      # to be set once by hand in Settings → Pages → Source → GitHub Actions.
      # Either way the check at the end of the deploy job says whether the
      # live site is really serving this build.
      - name: Make GitHub Actions the Pages source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN || github.token }}
        run: |
          if gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow; then
            echo "Pages source set to GitHub Actions."
          else
            echo "::warning::Could not set the Pages source automatically (needs repo-admin rights). If the deploy check below fails, set Settings → Pages → Source to 'GitHub Actions' once, by hand."
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Stamped into the app so the site can say which build it is serving,
      # in the same place the APK says it. The channel is part of the string
      # because the two workflows have their own run numbers.
      - name: Build the site
        run: SLOWNAV_VERSION="$(date -u +%Y.%m.%d).${{ github.run_number }} web ${GITHUB_SHA:0:7}" pnpm build

      - name: Assemble site
        run: |
          set -eux
          mkdir -p site
          # The original single-file apps, still serving their existing URLs.
          # They stay until each port has been walked with and trusted.
          cp index.html hike.html canalmap.html pariswalk.html hike-sw.js site/
          cp -r tracks site/tracks
          # The ported apps, published alongside at /next/ so both can be
          # compared on the same phone.
          test -f apps/web/dist/hike.html  # never publish an empty build
          mkdir -p site/next
          cp -r apps/web/dist/. site/next/
          # Static artifact: no Jekyll processing.
          touch site/.nojekyll
          find site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Prove the live site is actually serving this build. A green deploy is
      # not evidence on its own: when Pages was still publishing from the
      # branch, every old URL kept working while the built output was never
      # served at all.
      - name: Check the live site is serving the artifact
        run: |
          set -eu
          base="${{ steps.deployment.outputs.page_url }}"
          # -H no-cache matters: the Pages CDN caches 404s, so a path that
          # was missing before this deploy keeps answering 404 from the edge
          # long after the deploy that added it. Without this the check is a
          # false negative on every deploy.
          nocache() { curl -s -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$1"; }
          for attempt in 1 2 3 4 5 6; do
            sleep 10
            code=$(nocache "${base}next/hike.html")
            repo=$(nocache "${base}package.json")
            echo "attempt ${attempt}: next/hike.html=${code} package.json=${repo}"
            # The built page must be there, and a repo file that is not in the
            # artifact must not be — that second check is what catches a
            # branch deploy masquerading as a successful one.
            if [ "$code" = "200" ] && [ "$repo" = "404" ]; then
              # A 200 on the HTML shell proves very little — it is a few
              # hundred bytes that load nothing by themselves. Follow the
              # script it references and check that actually exists, which is
              # what catches a build written with the wrong base path.
              asset=$(curl -s -H 'Cache-Control: no-cache' "${base}next/hike.html" |
                grep -o 'src="[^"]*\.js"' | head -1 | sed 's/src="//; s/"//')
              if [ -z "$asset" ]; then
                echo "::error::The deployed page references no script."
                exit 1
              fi
              asset_code=$(nocache "https://guy-t.github.io${asset}")
              echo "  referenced script ${asset} -> ${asset_code}"
              if [ "$asset_code" != "200" ]; then
                echo "::error::The deployed page references ${asset}, which is not being served. Check the Vite base path."
                exit 1
              fi
              echo "Live site is serving the built artifact, and its script loads."
              exit 0
            fi
          done
          echo "::error::The live site is not serving this build."
          exit 1
