name: Android

# Builds an installable APK on every push to main and publishes it to a
# release with a fixed tag, so there is always one stable URL to download from
# a phone. The web deploy is a separate workflow; neither blocks the other.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write # to publish the APK as a release asset

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - run: pnpm install --frozen-lockfile

      # The same gates the web deploy runs. An APK that ships broken logic is
      # worse than no APK, because it is already on the phone.
      - run: pnpm typecheck
      - run: pnpm test

      # Worked out before the web build, not after, because the app itself
      # now shows this string: an APK that quietly failed to update looks
      # exactly like one built without the change, and the only way to tell
      # from a hillside is to ask the app which build it is. The short commit
      # goes in too, so the answer can be read straight off the repository.
      - name: Work out the version
        run: |
          set -eu
          VERSION_NAME="$(date -u +%Y.%m.%d).${{ github.run_number }}"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "SLOWNAV_VERSION=${VERSION_NAME} apk ${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      # The native build differs from the web one only in its base path:
      # relative, so assets resolve from the device rather than from a path on
      # a domain. Shipping the Pages build inside the APK would point every
      # asset at a URL the phone may have no signal to reach.
      - name: Build the web app for the shell
        run: pnpm --filter @slownav/web build:native

      - name: Sync into the native project
        working-directory: apps/mobile
        run: pnpm sync

      # versionCode must increase for every build Android is asked to install
      # over the last one; the run number is monotonic and free. The name is
      # the one already worked out above, so the package and the screen agree.
      - name: Stamp the version into the package
        working-directory: apps/mobile/android
        run: |
          set -eu
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VERSION_NAME}\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      # Android identifies an app by package name AND signing key, and refuses
      # to update one signed with a different key. Gradle's debug key is
      # generated per machine, so CI minted a fresh one every run and every
      # update failed with "App not installed". A stable key, kept in secrets
      # and never in the repository, is the fix.
      - name: Unlock the signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret. Building a debug APK, which cannot update an install signed by a different key."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/slownav.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        working-directory: apps/mobile/android
        env:
          SLOWNAV_KEYSTORE: ${{ steps.signing.outputs.signed == 'true' && format('{0}/slownav.jks', runner.temp) || '' }}
          SLOWNAV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SLOWNAV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SLOWNAV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Name the artifact
        run: |
          set -eu
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            SRC=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          else
            SRC=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          fi
          test -f "$SRC"   # never publish a missing build
          mkdir -p out
          cp "$SRC" "out/slow-navigator-${VERSION_NAME}.apk"
          ls -la out

      # The signing certificate must not change between builds, or the next
      # update fails the same way. Printing it makes a drift visible in the log
      # rather than on a phone halfway up a mountain.
      - name: Report the signing certificate
        run: |
          set -eu
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs out/*.apk | grep -i "SHA-256 digest" || true

      - uses: actions/upload-artifact@v4
        with:
          name: slow-navigator-apk
          path: out/*.apk
          if-no-files-found: error

      # A rolling release, so the download link never changes and can be
      # bookmarked on the phone.
      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest out/*.apk \
            --title "Slow Navigator — latest Android build" \
            --notes "Built from ${{ github.sha }} on $(date -u +'%Y-%m-%d %H:%M') UTC.

          ${{ steps.signing.outputs.signed == 'true' && 'Signed with the stable release key, so it updates in place over any earlier build that used it.' || 'DEBUG-SIGNED — this build cannot update an existing install. Add the ANDROID_KEYSTORE_BASE64 secret to fix that.' }}

          Android will ask you to allow installing from your browser the first time.

          Download: https://github.com/${{ github.repository }}/releases/download/android-latest/slow-navigator-${VERSION_NAME}.apk"
