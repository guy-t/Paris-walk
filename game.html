<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1b2620">
  <title>Trail Jumper</title>
  <style>
    :root {
      --bg: #1b2620; --btn: rgba(255, 255, 255, .16); --btn-on: rgba(255, 255, 255, .38);
      --btn-ink: #f3f7f4; --a: #e2533b; --b: #e8a33a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: var(--bg); color: var(--btn-ink); touch-action: none; user-select: none;
      -webkit-user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }

    .top { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 8px; right: 8px;
      display: flex; justify-content: space-between; pointer-events: none; z-index: 3; }
    .top a, .top button {
      pointer-events: auto; width: 36px; height: 36px; border-radius: 18px; border: 0;
      background: rgba(0, 0, 0, .35); color: #fff; font-size: 17px; line-height: 36px; text-align: center;
      text-decoration: none; padding: 0; cursor: pointer;
    }
    .top .right { display: flex; gap: 8px; }

    /* Controls: overlaid in landscape, a pad below the screen in portrait. */
    .pad { display: none; width: 100%; justify-content: space-between; align-items: center;
      padding: 12px max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    body.touch .pad { display: flex; }
    body.touch:not(.portrait) .pad { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; }
    body.portrait .pad { flex: 1; padding-top: 20px; }
    .group { display: flex; gap: 14px; align-items: center; }
    .ctl {
      width: 72px; height: 72px; border-radius: 50%; background: var(--btn); color: var(--btn-ink);
      display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700;
      border: 2px solid rgba(255, 255, 255, .22);
    }
    .ctl.on { background: var(--btn-on); transform: scale(.96); }
    .ctl.a { background: color-mix(in srgb, var(--a) 70%, transparent); }
    .ctl.b { background: color-mix(in srgb, var(--b) 65%, transparent); width: 60px; height: 60px; font-size: 20px; }
    .ctl.a.on, .ctl.b.on { filter: brightness(1.3); }
    body.portrait .ctl { width: 84px; height: 84px; }
    body.portrait .ctl.b { width: 68px; height: 68px; }
    .ctl.b.off { visibility: hidden; }
  </style>
</head>

<body>
  <div class="top">
    <a href="index.html" aria-label="Back to Slow Navigator">✕</a>
    <div class="right">
      <button id="pauseBtn" aria-label="Pause">❚❚</button>
      <button id="soundBtn" aria-label="Sound">♪</button>
    </div>
  </div>
  <canvas id="c"></canvas>
  <div class="pad" id="pad">
    <div class="group">
      <div class="ctl" data-k="left">◀</div>
      <div class="ctl" data-k="right">▶</div>
    </div>
    <div class="group">
      <div class="ctl b off" data-k="fire">✱</div>
      <div class="ctl a" data-k="jump">▲</div>
    </div>
  </div>

  <script>
    "use strict";
    /*
     * Trail Jumper — a little side-scrolling platformer.
     *
     * One file, no assets: every sprite is drawn with fillRect and every sound
     * is an oscillator, so it works offline once loaded, like the other apps.
     * Physics run on a fixed 60 Hz step so a slow phone plays the same game
     * as a fast one, only with fewer frames drawn.
     */

    const T = 16;            // tile size in game pixels
    const VIEW_H = 15 * T;   // 240: fifteen rows, always
    let VIEW_W = 256;        // widens to the screen's shape in landscape

    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");

    // ---------------------------------------------------------------- storage
    const store = {
      get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
    };

    // ------------------------------------------------------------------ sound
    let actx = null;
    let soundOn = store.get("trailjump:sound", true);
    function unlockAudio() {
      if (actx) { if (actx.state === "suspended") actx.resume(); return; }
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { actx = null; }
    }
    function tone(freq, dur, type = "square", vol = 0.08, slide = 0, delay = 0) {
      if (!soundOn || !actx) return;
      const t0 = actx.currentTime + delay;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t0);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(actx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    }
    const sfx = {
      jump() { tone(330, 0.16, "square", 0.06, 420); },
      coin() { tone(988, 0.07, "square", 0.06); tone(1319, 0.22, "square", 0.06, 0, 0.07); },
      stomp() { tone(220, 0.1, "square", 0.08, -120); },
      bump() { tone(140, 0.08, "triangle", 0.12); },
      brk() { tone(180, 0.12, "sawtooth", 0.06, -100); tone(90, 0.1, "square", 0.05, 0, 0.05); },
      power() { [392, 494, 587, 784, 988].forEach((f, i) => tone(f, 0.09, "square", 0.05, 0, i * 0.06)); },
      sprout() { tone(300, 0.3, "triangle", 0.08, 300); },
      hurt() { [600, 450, 300].forEach((f, i) => tone(f, 0.09, "square", 0.06, 0, i * 0.08)); },
      die() { [523, 494, 466, 440, 392, 330, 262].forEach((f, i) => tone(f, 0.12, "square", 0.06, 0, i * 0.11)); },
      throw() { tone(700, 0.07, "triangle", 0.08, -300); },
      oneup() { [660, 784, 1319, 1047, 1175, 1568].forEach((f, i) => tone(f, 0.08, "square", 0.05, 0, i * 0.08)); },
      flag() { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.12, "square", 0.05, 0, i * 0.1)); },
    };

    // ----------------------------------------------------------------- tiles
    const E = 0, GROUND = 1, BRICK = 2, QCOIN = 3, QPOW = 4, USED = 5, STONE = 6,
      PIPE_TL = 7, PIPE_TR = 8, PIPE_L = 9, PIPE_R = 10, MULTI = 11;
    const SOLID = new Set([GROUND, BRICK, QCOIN, QPOW, USED, STONE, PIPE_TL, PIPE_TR, PIPE_L, PIPE_R, MULTI]);

    // A level is described by a function that calls a small builder, which is
    // far easier to read and to tune than fifteen 200-character strings.
    function build(def) {
      const W = def.width, H = 15;
      const g = Array.from({ length: H }, () => new Uint8Array(W));
      const coins = [], enemies = [], multi = new Map();
      const b = {
        ground(x0, x1, top = 13) { for (let x = x0; x < x1; x++) for (let y = top; y < H; y++) g[y][x] = GROUND; },
        row(y, x, s) {
          [...s].forEach((ch, i) => {
            const c = { B: BRICK, "?": QCOIN, M: QPOW, S: STONE, C: MULTI }[ch];
            if (c) g[y][x + i] = c;
            if (c === MULTI) multi.set((y * W) + x + i, 6);
            if (ch === "o") coins.push({ x: (x + i) * T + 3, y: y * T + 2 });
          });
        },
        coins(y, x, n) { for (let i = 0; i < n; i++) coins.push({ x: (x + i) * T + 3, y: y * T + 2 }); },
        pipe(x, h) {
          for (let y = 13 - h; y < 13; y++) { g[y][x] = PIPE_L; g[y][x + 1] = PIPE_R; }
          g[13 - h][x] = PIPE_TL; g[13 - h][x + 1] = PIPE_TR;
        },
        up(x, n) { for (let i = 0; i < n; i++) for (let j = 0; j <= i; j++) g[12 - j][x + i] = STONE; },
        down(x, n) { for (let i = 0; i < n; i++) for (let j = 0; j < n - i; j++) g[12 - j][x + i] = STONE; },
        enemy(type, x, y = 12) { enemies.push({ type, x: x * T, y: y * T }); },
      };
      def.make(b);
      return { ...def, W, H, g, coins, enemies, multi };
    }

    const LEVELS = [
      {
        name: "1 · The Meadow", width: 212, start: 3, flag: 198, time: 300,
        sky: ["#6fb7ff", "#bfe3ff"], hills: ["#7bb06a", "#5c9a52"], peaks: "#a9c3d6", snow: true,
        groundTop: "#5fae3c", groundFill: "#9a6234", groundDot: "#7a4a24",
        make(b) {
          b.ground(0, 69); b.ground(71, 86); b.ground(89, 150); b.ground(152, 212);
          b.row(9, 16, "?"); b.row(9, 20, "BMB?B"); b.row(5, 22, "?");
          b.pipe(28, 2); b.pipe(38, 3); b.pipe(46, 4); b.pipe(57, 4);
          b.enemy("beetle", 22); b.enemy("beetle", 40); b.enemy("beetle", 51); b.enemy("beetle", 53);
          b.row(9, 64, "o o o");
          b.row(9, 77, "BMB"); b.row(5, 80, "BBBBBBBB"); b.row(5, 91, "BBB?"); b.row(9, 94, "C");
          b.enemy("beetle", 81, 4); b.enemy("beetle", 83, 4);
          b.row(9, 100, "BB"); b.row(9, 106, "?"); b.row(9, 109, "?"); b.row(9, 112, "?"); b.row(5, 109, "M");
          b.enemy("beetle", 97); b.enemy("beetle", 99); b.enemy("goat", 107);
          b.row(9, 118, "B"); b.row(5, 121, "BBB"); b.row(5, 128, "B??B"); b.row(9, 129, "BB");
          b.enemy("beetle", 114); b.enemy("beetle", 116); b.enemy("beetle", 124); b.enemy("beetle", 126);
          b.up(134, 4); b.down(140, 4); b.up(146, 4); b.down(152, 4);
          b.pipe(163, 2); b.row(9, 168, "BB?B"); b.enemy("beetle", 172); b.enemy("beetle", 174); b.pipe(179, 2);
          b.coins(8, 166, 2);
          b.up(181, 8); b.row(4, 189, "S");
        },
      },
      {
        name: "2 · The Gorge", width: 216, start: 3, flag: 202, time: 300,
        sky: ["#e98a5a", "#ffd39a"], hills: ["#8a6a4f", "#6d523e"], peaks: "#b98a73", snow: false,
        groundTop: "#c58b42", groundFill: "#8a5a35", groundDot: "#6b4226",
        make(b) {
          b.ground(0, 24); b.ground(27, 40); b.ground(44, 60); b.ground(66, 72); b.ground(78, 120);
          b.ground(124, 128); b.ground(132, 160); b.ground(165, 216);
          b.row(9, 10, "?M?"); b.enemy("hog", 18); b.enemy("beetle", 32); b.enemy("beetle", 34);
          b.row(8, 40, "SSSS"); b.row(4, 41, "oo");
          b.row(9, 48, "B?B"); b.enemy("hog", 52); b.enemy("goat", 56);
          b.row(9, 60, "SS"); b.row(7, 63, "SS"); b.coins(5, 63, 2); b.row(10, 72, "SS"); b.row(8, 75, "SS");
          b.pipe(84, 3); b.enemy("beetle", 88); b.enemy("hog", 92); b.pipe(96, 4);
          b.row(9, 100, "BBCBB"); b.row(5, 101, "?M?"); b.enemy("goat", 104); b.enemy("beetle", 110); b.enemy("beetle", 112);
          b.up(114, 5); b.row(8, 120, "S"); b.row(8, 122, "S"); b.row(9, 128, "SSSS");
          b.coins(6, 128, 4); b.enemy("hog", 140); b.enemy("hog", 143); b.row(9, 138, "B?B?B");
          b.row(5, 146, "BBMBB"); b.enemy("goat", 150); b.enemy("beetle", 154); b.enemy("beetle", 156);
          b.row(10, 160, "S"); b.row(8, 162, "S");
          b.pipe(170, 2); b.enemy("hog", 176); b.pipe(180, 3); b.enemy("goat", 184);
          b.up(186, 8); b.row(4, 193, "S");
        },
      },
      {
        name: "3 · The Ridge", width: 224, start: 3, flag: 210, time: 300,
        sky: ["#13203f", "#3b4f80"], hills: ["#3a4f6a", "#2b3c54"], peaks: "#dfe8f2", snow: true, night: true,
        groundTop: "#eef4fa", groundFill: "#6c7a8c", groundDot: "#56637a",
        make(b) {
          b.ground(0, 18); b.ground(22, 30); b.ground(36, 52); b.ground(56, 58); b.ground(62, 64);
          b.ground(68, 100); b.ground(106, 140); b.ground(146, 150); b.ground(155, 224);
          b.row(9, 8, "?M?"); b.enemy("goat", 14);
          b.row(9, 30, "SS"); b.row(7, 33, "SS"); b.coins(5, 33, 2);
          b.enemy("hog", 40); b.enemy("beetle", 44); b.enemy("beetle", 46); b.row(9, 42, "BCB");
          b.row(10, 52, "S"); b.coins(9, 56, 2); b.coins(9, 62, 2); b.row(10, 66, "S");
          b.pipe(72, 3); b.enemy("goat", 76); b.enemy("hog", 80); b.pipe(84, 4); b.row(5, 86, "?M?");
          b.enemy("beetle", 90); b.enemy("beetle", 92); b.enemy("beetle", 94); b.row(9, 88, "BBBBB");
          b.row(9, 100, "S"); b.row(7, 103, "S"); b.coins(5, 102, 3);
          b.up(108, 4); b.enemy("goat", 115); b.enemy("hog", 118); b.row(8, 120, "B?B?B?B");
          b.enemy("beetle", 124); b.enemy("beetle", 126); b.enemy("goat", 132); b.down(135, 5);
          b.row(9, 140, "S"); b.row(8, 143, "S"); b.row(9, 151, "SS"); b.coins(7, 151, 2);
          b.row(9, 160, "?M?"); b.enemy("hog", 164); b.enemy("hog", 167); b.enemy("goat", 172);
          b.pipe(176, 2); b.enemy("beetle", 180); b.enemy("beetle", 182); b.pipe(186, 3); b.enemy("goat", 190);
          b.up(194, 9); b.row(3, 202, "S");
        },
      },
    ];

    // ---------------------------------------------------------------- input
    const keys = { left: false, right: false, jump: false, fire: false };
    const prev = { jump: false, fire: false };
    const KEYMAP = {
      ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
      ArrowUp: "jump", KeyW: "jump", Space: "jump", KeyZ: "jump", KeyX: "fire", ShiftLeft: "fire", ShiftRight: "fire",
    };
    addEventListener("keydown", (e) => {
      unlockAudio();
      if (e.code === "KeyP" || e.code === "Escape") { togglePause(); return; }
      if (e.code === "Enter") { pressStart(); return; }
      const k = KEYMAP[e.code]; if (k) { keys[k] = true; e.preventDefault(); if (k === "jump") pressStart(); }
    });
    addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });

    // Touch: every active pointer is hit-tested against every button on each
    // change, so a thumb can slide from ◀ to ▶ without lifting.
    const pad = document.getElementById("pad");
    const ctls = [...pad.querySelectorAll(".ctl")];
    const pointers = new Map();
    function refreshTouch() {
      const on = { left: false, right: false, jump: false, fire: false };
      const rects = ctls.map((el) => [el, el.getBoundingClientRect()]);
      for (const p of pointers.values()) {
        let best = null, bestD = 1e9;
        for (const [el, r] of rects) {
          if (el.classList.contains("off")) continue;
          const pad = 14;
          if (p.x < r.left - pad || p.x > r.right + pad || p.y < r.top - pad || p.y > r.bottom + pad) continue;
          const d = Math.hypot(p.x - (r.left + r.right) / 2, p.y - (r.top + r.bottom) / 2);
          if (d < bestD) { bestD = d; best = el; }
        }
        if (best) on[best.dataset.k] = true;
      }
      for (const el of ctls) el.classList.toggle("on", on[el.dataset.k]);
      Object.assign(keys, on);
    }
    function onPointer(e) {
      if (e.pointerType === "mouse" && e.buttons === 0 && e.type !== "pointerup") return;
      if (e.type === "pointerdown") { unlockAudio(); }
      if (e.type === "pointerup" || e.type === "pointercancel") pointers.delete(e.pointerId);
      else pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      refreshTouch();
      e.preventDefault();
    }
    for (const t of ["pointerdown", "pointermove", "pointerup", "pointercancel"]) pad.addEventListener(t, onPointer);
    canvas.addEventListener("pointerdown", (e) => { unlockAudio(); pressStart(); e.preventDefault(); });
    addEventListener("contextmenu", (e) => e.preventDefault());

    const isTouch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
    document.body.classList.toggle("touch", isTouch);

    const soundBtn = document.getElementById("soundBtn");
    const paintSound = () => { soundBtn.style.opacity = soundOn ? 1 : 0.45; soundBtn.textContent = soundOn ? "♪" : "✕♪"; };
    soundBtn.addEventListener("click", () => { unlockAudio(); soundOn = !soundOn; store.set("trailjump:sound", soundOn); paintSound(); });
    paintSound();
    document.getElementById("pauseBtn").addEventListener("click", () => togglePause());

    // ---------------------------------------------------------------- layout
    function layout() {
      const vw = innerWidth, vh = innerHeight;
      const portrait = vh > vw * 1.1;
      document.body.classList.toggle("portrait", portrait && isTouch);
      let cw, ch;
      if (portrait && isTouch) {
        VIEW_W = 256; cw = vw; ch = vw * VIEW_H / VIEW_W;
        if (ch > vh * 0.62) { ch = vh * 0.62; cw = ch * VIEW_W / VIEW_H; }
      } else {
        VIEW_W = Math.max(256, Math.min(480, Math.round(VIEW_H * vw / vh)));
        ch = vh; cw = ch * VIEW_W / VIEW_H;
        if (cw > vw) { cw = vw; ch = cw * VIEW_H / VIEW_W; }
      }
      canvas.width = VIEW_W; canvas.height = VIEW_H;
      canvas.style.width = Math.floor(cw) + "px"; canvas.style.height = Math.floor(ch) + "px";
      ctx.imageSmoothingEnabled = false;
    }
    addEventListener("resize", layout);
    layout();

    // ----------------------------------------------------------------- state
    let mode = "title";   // title | intro | play | dying | clear | over | won
    let paused = false;
    let L, player, enemies, items, parts, coinsList, popups, bumps, shots;
    let cam = 0, timer = 0, modeT = 0, frame = 0;
    let score = 0, coins = 0, lives = 3, levelIdx = 0;
    let best = store.get("trailjump:best", 0);

    function togglePause() {
      if (mode !== "play") return;
      paused = !paused;
      document.getElementById("pauseBtn").textContent = paused ? "▶" : "❚❚";
    }
    document.addEventListener("visibilitychange", () => { if (document.hidden && mode === "play" && !paused) togglePause(); });

    function pressStart() {
      if (paused) { togglePause(); return; }
      if (mode === "title" || mode === "over" || mode === "won") {
        score = 0; coins = 0; lives = 3; levelIdx = 0;
        startLevel(true);
      }
    }

    function startLevel(fresh) {
      L = build(LEVELS[levelIdx]);
      player = {
        x: L.start * T, y: 12 * T - 2, w: 11, h: 14, vx: 0, vy: 0, dir: 1, ground: false,
        size: fresh ? 0 : (player ? player.size : 0), inv: 0, grow: 0, walkT: 0, jumpHeld: 0, fireCd: 0, flagged: false,
      };
      if (player.size > 0) { player.h = 26; player.y -= 12; }
      enemies = L.enemies.map((e) => makeEnemy(e.type, e.x, e.y));
      coinsList = L.coins.map((c) => ({ ...c, taken: false }));
      items = []; parts = []; popups = []; bumps = []; shots = [];
      cam = 0; timer = L.time; modeT = 0;
      mode = "intro";
    }

    function makeEnemy(type, x, y) {
      const e = { type, x: x + 1, y: y + 2, w: 14, h: 14, vx: -0.5, vy: 0, alive: true, dead: 0, flip: false, active: false, hopT: 60 + Math.random() * 60 };
      if (type === "goat") { e.h = 15; e.y = y + 1; e.vx = -0.7; }
      if (type === "hog") { e.vx = -0.4; }
      return e;
    }

    // -------------------------------------------------------------- physics
    const tileAt = (tx, ty) => (ty < 0 || ty >= L.H || tx < 0 || tx >= L.W) ? (ty >= L.H ? E : (tx < 0 || tx >= L.W ? STONE : E)) : L.g[ty][tx];
    const solidAt = (tx, ty) => SOLID.has(tileAt(tx, ty));

    // Move an axis-aligned body through the tile grid, X then Y. Returns which
    // sides touched, and the tile hit from below, for block bumping.
    function moveBody(o) {
      const res = { left: false, right: false, top: false, bottom: false, headTiles: [] };
      o.x += o.vx;
      if (o.vx !== 0) {
        const edge = o.vx > 0 ? o.x + o.w : o.x;
        const tx = Math.floor(edge / T);
        for (let ty = Math.floor(o.y / T); ty <= Math.floor((o.y + o.h - 0.01) / T); ty++) {
          if (solidAt(tx, ty)) {
            if (o.vx > 0) { o.x = tx * T - o.w - 0.001; res.right = true; }
            else { o.x = (tx + 1) * T + 0.001; res.left = true; }
            o.vx = 0; break;
          }
        }
      }
      o.y += o.vy;
      const x0 = Math.floor((o.x + 0.5) / T), x1 = Math.floor((o.x + o.w - 0.5) / T);
      if (o.vy > 0) {
        const ty = Math.floor((o.y + o.h) / T);
        for (let tx = x0; tx <= x1; tx++) if (solidAt(tx, ty)) { o.y = ty * T - o.h; o.vy = 0; res.bottom = true; break; }
      } else if (o.vy < 0) {
        const ty = Math.floor(o.y / T);
        for (let tx = x0; tx <= x1; tx++) if (solidAt(tx, ty)) res.headTiles.push(tx);
        if (res.headTiles.length) { o.y = (ty + 1) * T; o.vy = 0; res.top = true; res.headTy = ty; }
      }
      return res;
    }

    const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

    function addScore(n, x, y) {
      score += n;
      if (x != null) popups.push({ x, y, t: 40, s: String(n) });
    }
    function addCoin(x, y) {
      coins++; addScore(200, x, y); sfx.coin();
      if (coins >= 100) { coins -= 100; lives++; sfx.oneup(); popups.push({ x, y: y - 10, t: 50, s: "1UP" }); }
    }

    function hitBlock(tx, ty) {
      const t = L.g[ty][tx];
      // Anything standing on the block is knocked off it.
      for (const e of enemies) {
        if (!e.alive || e.dead) continue;
        if (e.x + e.w > tx * T && e.x < (tx + 1) * T && Math.abs(e.y + e.h - ty * T) < 3) killEnemy(e, true);
      }
      for (const c of coinsList) if (!c.taken && Math.floor((c.x + 5) / T) === tx && Math.floor((c.y + 6) / T) === ty - 1) { c.taken = true; addCoin(c.x, c.y); }
      if (t === QCOIN || t === MULTI) {
        coinPop(tx, ty);
        if (t === MULTI) {
          const key = ty * L.W + tx, left = L.multi.get(key) - 1;
          L.multi.set(key, left);
          if (left <= 0) L.g[ty][tx] = USED;
        } else L.g[ty][tx] = USED;
        bumps.push({ tx, ty, t: 8 });
      } else if (t === QPOW) {
        L.g[ty][tx] = USED; bumps.push({ tx, ty, t: 8 }); sfx.sprout();
        items.push({ kind: player.size === 0 ? "bread" : "cone", x: tx * T + 1, y: ty * T, w: 14, h: 14, vx: 0, vy: 0, rise: 16, dir: 1 });
      } else if (t === BRICK) {
        if (player.size > 0) {
          L.g[ty][tx] = E; sfx.brk(); addScore(50);
          for (let i = 0; i < 4; i++) parts.push({ x: tx * T + (i % 2) * 8 + 4, y: ty * T + (i > 1 ? 8 : 0) + 4, vx: (i % 2 ? 1.4 : -1.4), vy: i > 1 ? -4 : -6, t: 90, kind: "brick" });
        } else { bumps.push({ tx, ty, t: 8 }); sfx.bump(); }
      } else sfx.bump();
    }
    function coinPop(tx, ty) {
      parts.push({ x: tx * T + 4, y: ty * T - 4, vx: 0, vy: -5, t: 26, kind: "coin" });
      addCoin(tx * T, ty * T - 16);
    }

    function killEnemy(e, flip) {
      if (!e.alive || e.dead) return;
      if (flip) { e.alive = false; e.flip = true; e.vy = -4; e.vx = player.x < e.x ? 1 : -1; sfx.stomp(); addScore(200, e.x, e.y); }
      else { e.dead = 30; e.vx = 0; sfx.stomp(); addScore(100, e.x, e.y); }
    }

    function setSize(s) {
      const was = player.size;
      player.size = s;
      if (s > 0 && was === 0) { player.y -= 12; player.h = 26; }
      if (s === 0 && was > 0) { player.y += 12; player.h = 14; }
      player.grow = 40;
    }

    function hurt() {
      if (player.inv > 0 || mode !== "play") return;
      if (player.size > 0) { setSize(player.size - 1); player.inv = 120; sfx.hurt(); }
      else die();
    }
    function die() {
      mode = "dying"; modeT = 0; player.vy = -6; player.vx = 0; sfx.die();
    }

    function update() {
      frame++; modeT++;
      if (mode === "intro") { if (modeT > 120) { mode = "play"; modeT = 0; } return; }
      if (mode === "dying") {
        player.vy = Math.min(player.vy + 0.3, 7); if (modeT > 30) player.y += player.vy;
        if (modeT > 180) {
          lives--;
          if (lives <= 0) { mode = "over"; modeT = 0; saveBest(); }
          else startLevel(true);
        }
        return;
      }
      if (mode === "clear") { updateClear(); updateWorld(); return; }
      if (mode !== "play") return;

      if (frame % 40 === 0 && timer > 0) { timer--; if (timer === 0) { die(); return; } }
      updatePlayer();
      updateWorld();
    }

    function updatePlayer() {
      const p = player;
      const run = 2.1, accel = p.ground ? 0.14 : 0.09, fric = 0.16;
      const want = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      if (want) {
        p.vx += want * accel; p.dir = want;
        if (Math.sign(p.vx) !== want && p.ground) p.vx += want * fric;  // a skid turns quicker
      } else if (p.ground) {
        p.vx = Math.abs(p.vx) <= fric ? 0 : p.vx - Math.sign(p.vx) * fric;
      }
      p.vx = Math.max(-run, Math.min(run, p.vx));

      // Variable jump: holding the button keeps gravity light on the way up.
      const jumpPressed = keys.jump && !prev.jump;
      if (jumpPressed && p.ground) { p.vy = -6.9 - Math.abs(p.vx) * 0.25; p.ground = false; sfx.jump(); }
      const g = (p.vy < 0 && keys.jump) ? 0.3 : 0.72;
      p.vy = Math.min(p.vy + g, 7);

      if (p.size === 2 && keys.fire && !prev.fire && p.fireCd <= 0 && shots.length < 2) {
        shots.push({ x: p.x + (p.dir > 0 ? p.w : -6), y: p.y + 8, w: 6, h: 6, vx: 3.4 * p.dir, vy: 1, t: 0 });
        p.fireCd = 14; sfx.throw();
      }
      if (p.fireCd > 0) p.fireCd--;

      const r = moveBody(p);
      p.ground = r.bottom;
      if (r.top) {
        // Hit the block nearest the player's centre, as a head would.
        const cx = Math.floor((p.x + p.w / 2) / T);
        const tx = r.headTiles.includes(cx) ? cx : r.headTiles[0];
        hitBlock(tx, r.headTy);
      }
      if (p.x < cam) { p.x = cam; if (p.vx < 0) p.vx = 0; }
      if (p.ground && p.vx !== 0) p.walkT += Math.abs(p.vx);
      if (p.inv > 0) p.inv--;
      if (p.grow > 0) p.grow--;
      if (p.y > VIEW_H + 20) { die(); return; }

      // Coins
      for (const c of coinsList) if (!c.taken && overlap(p, { x: c.x, y: c.y, w: 10, h: 12 })) { c.taken = true; addCoin(c.x, c.y); }

      // The flag
      if (p.x + p.w >= L.flag * T + 6 && !p.flagged) {
        p.flagged = true; mode = "clear"; modeT = 0; p.vx = 0; p.vy = 0;
        p.x = L.flag * T + 6 - p.w;
        const h = Math.max(0, Math.round((12 * T - p.y) / 16));
        p.flagBonus = [100, 200, 400, 800, 1000, 2000, 4000, 5000][Math.min(7, Math.floor(h / 1.3))];
        addScore(p.flagBonus, p.x, p.y - 10); sfx.flag();
      }

      // The camera only ever scrolls forward, and its left edge is a wall.
      cam = Math.max(0, Math.min(L.W * T - VIEW_W, Math.max(cam, p.x - VIEW_W * 0.4)));
    }

    function updateClear() {
      const p = player;
      if (modeT < 70) {
        p.vy = 0; p.y = Math.min(p.y + 2, 12 * T + T - p.h);
      } else if (modeT < 200) {
        p.dir = 1; p.vx = 1.2; p.vy = Math.min(p.vy + 0.5, 7);
        const r = moveBody(p); p.ground = r.bottom; if (p.ground) p.walkT += 1.2;
        if (p.x > (L.flag + 5) * T) p.hidden = true;
      } else if (timer > 0) {
        const n = Math.min(timer, 3); timer -= n; score += n * 50;
        if (frame % 4 === 0) tone(1200, 0.03, "square", 0.03);
      } else if (modeT > 260) {
        saveBest();
        if (levelIdx + 1 < LEVELS.length) { levelIdx++; startLevel(false); }
        else { mode = "won"; modeT = 0; }
      }
      cam = Math.max(0, Math.min(L.W * T - VIEW_W, Math.max(cam, p.x - VIEW_W * 0.4)));
    }

    function updateWorld() {
      const p = player;
      for (const e of enemies) {
        if (!e.active) { if (e.x < cam + VIEW_W + 32) e.active = true; else continue; }
        if (e.dead) { e.dead--; continue; }
        if (!e.alive) { e.vy += 0.35; e.x += e.vx; e.y += e.vy; continue; }
        e.vy = Math.min(e.vy + 0.4, 7);
        if (e.type === "goat") {
          if (--e.hopT <= 0 && e.onGround) { e.vy = -5.5; e.hopT = 80 + Math.random() * 60; }
        }
        const r = moveBody(e);
        e.onGround = r.bottom;
        if (r.left) e.vx = Math.abs(e.type === "goat" ? 0.7 : e.type === "hog" ? 0.4 : 0.5);
        if (r.right) e.vx = -Math.abs(e.type === "goat" ? 0.7 : e.type === "hog" ? 0.4 : 0.5);
        // Hedgehogs turn at ledges rather than walk off them.
        if (e.type === "hog" && e.onGround) {
          const ahead = Math.floor((e.vx > 0 ? e.x + e.w + 1 : e.x - 1) / T);
          if (!solidAt(ahead, Math.floor((e.y + e.h + 1) / T))) e.vx = -e.vx;
        }
        if (e.y > VIEW_H + 40) { e.alive = false; e.gone = true; }
        // Enemies bump into each other and turn round.
        for (const o of enemies) {
          if (o === e || !o.alive || o.dead || !o.active) continue;
          if (overlap(e, o) && Math.sign(o.x - e.x) === Math.sign(e.vx)) { e.vx = -e.vx; }
        }
        if (mode !== "play") continue;
        if (overlap(p, e)) {
          const stomping = p.vy > 0 && (p.y + p.h) - e.y < 10;
          if (stomping && e.type !== "hog") {
            killEnemy(e, false); p.vy = keys.jump ? -6.5 : -4; p.y = e.y - p.h;
          } else if (player.inv <= 0) hurt();
        }
      }

      for (const s of shots) {
        s.t++; s.vy = Math.min(s.vy + 0.4, 5);
        const r = moveBody(s);
        if (r.bottom) s.vy = -3.2;
        if (r.left || r.right || s.x < cam - 16 || s.x > cam + VIEW_W + 16 || s.y > VIEW_H) { s.gone = true; parts.push({ x: s.x, y: s.y, vx: 0, vy: 0, t: 10, kind: "puff" }); }
        for (const e of enemies) if (e.alive && !e.dead && e.active && overlap(s, e)) { killEnemy(e, true); s.gone = true; }
      }
      shots = shots.filter((s) => !s.gone);

      for (const it of items) {
        if (it.rise > 0) { it.rise--; it.y -= 1; if (it.rise === 0) it.vx = it.kind === "bread" ? 1 : 0; continue; }
        it.vy = Math.min(it.vy + 0.4, 7);
        const r = moveBody(it);
        if (r.left) it.vx = 1; if (r.right) it.vx = -1;
        if (it.y > VIEW_H + 20) it.gone = true;
        if (mode === "play" && overlap(p, it)) {
          it.gone = true; sfx.power(); addScore(1000, it.x, it.y);
          if (it.kind === "bread") { if (p.size === 0) setSize(1); }
          else setSize(Math.max(2, p.size === 0 ? 1 : 2));
        }
      }
      items = items.filter((i) => !i.gone);

      for (const q of parts) { q.vy += q.kind === "puff" ? 0 : 0.35; q.x += q.vx; q.y += q.vy; q.t--; }
      parts = parts.filter((q) => q.t > 0);
      for (const q of popups) { q.y -= 0.6; q.t--; }
      popups = popups.filter((q) => q.t > 0);
      for (const b of bumps) b.t--;
      bumps = bumps.filter((b) => b.t > 0);
      document.querySelector(".ctl.b").classList.toggle("off", !(player.size === 2 && mode === "play"));
    }

    function saveBest() { if (score > best) { best = score; store.set("trailjump:best", best); } }

    // -------------------------------------------------------------- drawing
    function px(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }

    function drawSky() {
      const grd = ctx.createLinearGradient(0, 0, 0, VIEW_H);
      grd.addColorStop(0, L.sky[0]); grd.addColorStop(1, L.sky[1]);
      ctx.fillStyle = grd; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      if (L.night) {
        for (let i = 0; i < 60; i++) {
          const sx = ((i * 97) % 600 - cam * 0.05) % 600, sy = (i * 53) % 120;
          px((sx + 600) % 600 * VIEW_W / 600, sy, 1, 1, (i + (frame >> 4)) % 7 ? "#dfe8ff" : "#7d8cb8");
        }
        px(VIEW_W - 60, 26, 14, 14, "#f4f1d0"); px(VIEW_W - 56, 24, 8, 2, "#f4f1d0");
      } else {
        px(VIEW_W - 50, 24, 16, 16, L.name.startsWith("2") ? "#fff1b8" : "#fff6c4");
      }
      // Far peaks, then near hills, at different parallax rates.
      ctx.fillStyle = L.peaks;
      const off1 = -(cam * 0.15) % 160;
      for (let x = off1 - 160; x < VIEW_W + 160; x += 160) {
        ctx.beginPath(); ctx.moveTo(x, 170); ctx.lineTo(x + 50, 80); ctx.lineTo(x + 80, 110); ctx.lineTo(x + 110, 70); ctx.lineTo(x + 170, 170); ctx.fill();
        if (L.snow) {
          ctx.fillStyle = "#f6fbff";
          ctx.beginPath(); ctx.moveTo(x + 40, 98); ctx.lineTo(x + 50, 80); ctx.lineTo(x + 58, 94); ctx.fill();
          ctx.beginPath(); ctx.moveTo(x + 100, 88); ctx.lineTo(x + 110, 70); ctx.lineTo(x + 120, 86); ctx.fill();
          ctx.fillStyle = L.peaks;
        }
      }
      // Clouds
      if (!L.night) {
        const off2 = -(cam * 0.3) % 240;
        for (let x = off2 - 240; x < VIEW_W + 240; x += 240) {
          ctx.fillStyle = "rgba(255,255,255,.9)";
          ctx.beginPath(); ctx.arc(x + 40, 44, 10, 0, 7); ctx.arc(x + 54, 38, 13, 0, 7); ctx.arc(x + 70, 44, 10, 0, 7); ctx.fill();
          ctx.beginPath(); ctx.arc(x + 170, 64, 8, 0, 7); ctx.arc(x + 182, 59, 11, 0, 7); ctx.arc(x + 196, 64, 8, 0, 7); ctx.fill();
        }
      }
      const off3 = -(cam * 0.5) % 200;
      for (let x = off3 - 200; x < VIEW_W + 200; x += 200) {
        ctx.fillStyle = L.hills[0];
        ctx.beginPath(); ctx.ellipse(x + 60, 210, 70, 44, 0, Math.PI, 0); ctx.fill();
        ctx.fillStyle = L.hills[1];
        ctx.beginPath(); ctx.ellipse(x + 150, 210, 50, 28, 0, Math.PI, 0); ctx.fill();
      }
    }

    function drawTile(t, x, y, tx, ty) {
      switch (t) {
        case GROUND: {
          const topOpen = !solidAt(tx, ty - 1) || tileAt(tx, ty - 1) !== GROUND;
          px(x, y, T, T, L.groundFill);
          px(x + ((tx * 7) % 11), y + 6 + ((ty * 5) % 7), 2, 2, L.groundDot);
          px(x + ((tx * 3) % 9) + 4, y + ((tx + ty) % 5) + 2, 2, 2, L.groundDot);
          if (topOpen && tileAt(tx, ty - 1) === E) {
            px(x, y, T, 4, L.groundTop);
            px(x + (tx % 3) * 4, y + 4, 3, 2, L.groundTop);
          }
          break;
        }
        case BRICK:
          px(x, y, T, T, "#b5532d"); px(x, y + 7, T, 1, "#6b2d17"); px(x, y + 15, T, 1, "#6b2d17");
          px(x + 7, y, 1, 7, "#6b2d17"); px(x + 3, y + 8, 1, 7, "#6b2d17"); px(x + 11, y + 8, 1, 7, "#6b2d17");
          px(x, y, T, 1, "#e08b5f"); break;
        case QCOIN: case QPOW: case MULTI: {
          const glow = [0, 1, 2, 1][(frame >> 3) & 3];
          px(x, y, T, T, "#7a4a12"); px(x + 1, y + 1, 14, 14, ["#e8a33a", "#f0b84e", "#f7cf6b"][glow]);
          px(x + 1, y + 1, 1, 1, "#7a4a12"); px(x + 14, y + 1, 1, 1, "#7a4a12"); px(x + 1, y + 14, 1, 1, "#7a4a12"); px(x + 14, y + 14, 1, 1, "#7a4a12");
          // A "?" drawn in pixels.
          ctx.fillStyle = "#7a2f12";
          [[5, 3, 6, 2], [10, 4, 2, 4], [8, 7, 3, 2], [7, 8, 2, 2], [7, 11, 2, 2]].forEach(([a, b2, c, d]) => ctx.fillRect(x + a, y + b2, c, d));
          break;
        }
        case USED:
          px(x, y, T, T, "#5a3a20"); px(x + 1, y + 1, 14, 14, "#8a5a35");
          px(x + 3, y + 3, 2, 2, "#5a3a20"); px(x + 11, y + 3, 2, 2, "#5a3a20"); px(x + 3, y + 11, 2, 2, "#5a3a20"); px(x + 11, y + 11, 2, 2, "#5a3a20"); break;
        case STONE:
          px(x, y, T, T, "#5d6672"); px(x + 1, y + 1, 14, 14, "#8b95a2"); px(x + 1, y + 1, 14, 2, "#aab3bf"); px(x + 2, y + 12, 12, 2, "#6c7582"); break;
        case PIPE_TL: px(x - 1, y, 17, T, "#1e6b3a"); px(x, y + 1, 16, 14, "#3da35b"); px(x + 3, y + 1, 3, 14, "#7fd18f"); break;
        case PIPE_TR: px(x, y, 17, T, "#1e6b3a"); px(x, y + 1, 16, 14, "#3da35b"); px(x + 10, y + 1, 3, 14, "#2a8446"); break;
        case PIPE_L: px(x + 1, y, 15, T, "#1e6b3a"); px(x + 2, y, 14, T, "#3da35b"); px(x + 5, y, 3, T, "#7fd18f"); break;
        case PIPE_R: px(x, y, 15, T, "#1e6b3a"); px(x, y, 14, T, "#3da35b"); px(x + 8, y, 3, T, "#2a8446"); break;
      }
    }

    function drawLevel() {
      const x0 = Math.floor(cam / T), x1 = Math.min(L.W - 1, x0 + Math.ceil(VIEW_W / T) + 1);
      for (let ty = 0; ty < L.H; ty++) for (let tx = x0; tx <= x1; tx++) {
        const t = L.g[ty][tx]; if (!t) continue;
        const b = bumps.find((b) => b.tx === tx && b.ty === ty);
        const dy = b ? -Math.sin((8 - b.t) / 8 * Math.PI) * 5 : 0;
        drawTile(t, tx * T - Math.round(cam), ty * T + dy, tx, ty);
      }
      // Flag pole and the refuge at the end.
      const fx = L.flag * T - Math.round(cam) + 7;
      px(fx, 2 * T, 2, 11 * T - 2, "#d9dee4");
      px(fx - 2, 2 * T - 4, 6, 6, "#f0c040");
      const fy = mode === "clear" ? Math.min(11 * T, 2 * T + 4 + modeT * 2) : 2 * T + 4;
      px(fx - 14, fy, 14, 10, "#e2533b"); px(fx - 10, fy + 3, 5, 4, "#fff");
      px(fx - 3, 12 * T, 8, T, "#5d6672");
      const hx = (L.flag + 4) * T - Math.round(cam);
      px(hx, 10 * T, 5 * T, 3 * T, "#8a5a35"); px(hx + 2, 10 * T + 2, 5 * T - 4, 3 * T - 2, "#b07a4a");
      ctx.fillStyle = "#6b2d17"; ctx.beginPath(); ctx.moveTo(hx - 8, 10 * T); ctx.lineTo(hx + 2.5 * T, 8 * T - 4); ctx.lineTo(hx + 5 * T + 8, 10 * T); ctx.fill();
      px(hx + 2 * T, 11 * T + 2, T, 2 * T - 2, "#3a2414");
      px(hx + 6, 10 * T + 8, 10, 8, "#f7cf6b"); px(hx + 5 * T - 16, 10 * T + 8, 10, 8, "#f7cf6b");
    }

    function drawCoin(x, y, spin) {
      const w = [10, 8, 4, 8][spin & 3];
      px(x + (10 - w) / 2, y, w, 12, "#7a4a12");
      px(x + (10 - w) / 2 + 1, y + 1, Math.max(1, w - 2), 10, "#f7cf3b");
      if (w > 4) px(x + 4, y + 3, 2, 6, "#fff3a8");
    }

    function drawHiker(p) {
      if (p.hidden) return;
      if (p.inv > 0 && (frame >> 2) % 2 === 0) return;
      const big = p.size > 0;
      const x = Math.round(p.x - cam), y = Math.round(p.y), d = p.dir;
      const jacket = p.size === 2 ? "#f2f2f2" : "#2f6fd6", trim = p.size === 2 ? "#e2533b" : "#1d4a99";
      const air = !p.ground && mode !== "clear";
      const step = air ? 2 : (Math.abs(p.vx) > 0.1 || (mode === "clear" && p.vx)) ? Math.floor(p.walkT / 5) % 4 : 0;
      const flash = p.grow > 0 && (p.grow >> 2) % 2 === 0;
      const dying = mode === "dying";
      // Draw facing right into a mirrored frame when facing left.
      ctx.save();
      ctx.translate(x + (d < 0 ? p.w : 0), y);
      ctx.scale(d < 0 && !dying ? -1 : 1, 1);
      const S = (a, b, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(a, b, w, h); };
      if (!big) {
        // Small: 11 × 14
        S(1, 0, 8, 2, "#2e7d32"); S(0, 2, 11, 1, "#2e7d32");            // hat
        S(2, 3, 7, 4, "#f1c27d"); S(6, 4, 1, 1, "#222"); S(8, 5, 2, 1, "#d99a5b"); // face
        S(-1, 6, 3, 5, "#e8862a");                                        // rucksack
        S(2, 7, 7, 4, jacket); S(2, 7, 7, 1, trim);
        if (air) { S(2, 11, 3, 2, "#5b4636"); S(6, 10, 3, 2, "#5b4636"); S(1, 13, 4, 1, "#3a2a1e"); S(7, 12, 3, 1, "#3a2a1e"); }
        else {
          const a = [0, 1, 0, -1][step];
          S(3 + a, 11, 2, 2, "#5b4636"); S(6 - a, 11, 2, 2, "#5b4636");
          S(2 + a, 13, 3, 1, "#3a2a1e"); S(6 - a, 13, 3, 1, "#3a2a1e");
        }
        S(8, 8, 2, 2, "#f1c27d"); // hand
      } else {
        // Big: 11 × 26
        S(1, 0, 8, 3, "#2e7d32"); S(-1, 3, 13, 1, "#2e7d32");
        S(2, 4, 7, 6, "#f1c27d"); S(6, 6, 1, 2, "#222"); S(8, 8, 2, 1, "#d99a5b"); S(2, 9, 6, 1, "#a8743f");
        S(-2, 10, 4, 9, "#e8862a"); S(-2, 10, 4, 1, "#b8601a");
        S(2, 10, 8, 9, jacket); S(2, 10, 8, 1, trim); S(5, 11, 1, 7, trim);
        S(8, 13, 3, 3, "#f1c27d");
        if (p.size === 2) S(9, 11, 2, 2, "#e8a33a");
        if (air) {
          S(2, 19, 3, 4, "#5b4636"); S(6, 18, 3, 4, "#5b4636"); S(1, 23, 4, 2, "#3a2a1e"); S(7, 22, 4, 2, "#3a2a1e");
        } else {
          const a = [0, 2, 0, -2][step];
          S(3 + a, 19, 3, 5, "#5b4636"); S(6 - a, 19, 3, 5, "#5b4636");
          S(2 + a, 24, 4, 2, "#3a2a1e"); S(6 - a, 24, 4, 2, "#3a2a1e");
        }
        // walking pole
        S(10, 14 + (step % 2), 1, 12, "#9aa3ad");
      }
      if (flash) { ctx.globalAlpha = 0.5; S(-2, 0, 14, p.h, "#fff"); ctx.globalAlpha = 1; }
      ctx.restore();
    }

    function drawEnemy(e) {
      if (!e.active || e.gone) return;
      const x = Math.round(e.x - cam), y = Math.round(e.y);
      ctx.save();
      if (e.flip) { ctx.translate(x, y + e.h); ctx.scale(1, -1); } else ctx.translate(x, y);
      const S = (a, b, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(a, b, w, h); };
      const f = (frame >> 3) & 1;
      if (e.type === "beetle") {
        if (e.dead) { S(0, 10, 14, 4, "#6a2c8a"); S(2, 9, 10, 1, "#9b4fc4"); }
        else {
          S(1, 3, 12, 8, "#6a2c8a"); S(2, 2, 10, 2, "#9b4fc4"); S(6, 3, 1, 8, "#3e1752");
          S(e.vx < 0 ? 0 : 10, 6, 4, 4, "#3e1752");
          S(e.vx < 0 ? 1 : 11, 7, 1, 1, "#fff");
          S(1 + f, 11, 2, 3, "#2b1238"); S(6, 11, 2, 3, "#2b1238"); S(11 - f, 11, 2, 3, "#2b1238");
        }
      } else if (e.type === "hog") {
        S(1, 5, 12, 7, "#7a5a3c");
        for (let i = 0; i < 6; i++) S(1 + i * 2, 2 + (i % 2), 2, 4, "#3b2a1c");
        const fx = e.vx < 0 ? 0 : 10;
        S(fx, 7, 4, 4, "#d9b48a"); S(e.vx < 0 ? 0 : 13, 8, 1, 1, "#222"); S(fx + (e.vx < 0 ? 1 : 2), 7, 1, 1, "#222");
        S(2 + f, 12, 2, 2, "#3b2a1c"); S(9 - f, 12, 2, 2, "#3b2a1c");
      } else if (e.type === "goat") {
        if (e.dead) { S(0, 10, 14, 5, "#e8e2d6"); S(3, 9, 3, 1, "#8a7a64"); }
        else {
          const r = e.vx > 0;
          S(1, 5, 11, 6, "#e8e2d6"); S(1, 5, 11, 1, "#fff");
          const hx = r ? 10 : 0;
          S(hx, 1, 4, 5, "#e8e2d6"); S(hx + (r ? 2 : 0), 0, 2, 2, "#8a7a64"); S(hx + (r ? 3 : 0), 3, 1, 1, "#222");
          S(hx + (r ? 3 : 0), 6, 1, 2, "#ccc");
          const air = !e.onGround;
          S(2, 11, 2, air ? 2 : 4, "#5b4636"); S(9, 11, 2, air ? 2 : 4, "#5b4636");
          S(r ? 0 : 12, 4, 2, 2, "#e8e2d6");
        }
      }
      ctx.restore();
    }

    function drawItem(it) {
      const x = Math.round(it.x - cam), y = Math.round(it.y);
      if (it.kind === "bread") {
        px(x + 1, y + 4, 12, 9, "#c98a3b"); px(x + 1, y + 7, 12, 3, "#5fae3c"); px(x + 1, y + 6, 12, 1, "#e2533b");
        px(x + 2, y + 3, 10, 2, "#e0a95a"); px(x + 3, y + 4, 2, 1, "#f5d49a");
      } else {
        px(x + 4, y + 2, 6, 11, "#7a4a24");
        for (let i = 0; i < 4; i++) { px(x + 3, y + 3 + i * 3, 8, 2, "#a3693a"); }
        px(x + 6, y, 2, 3, "#2e7d32");
      }
    }

    function drawHUD() {
      ctx.font = "bold 9px ui-monospace, Menlo, Consolas, monospace";
      ctx.textBaseline = "top";
      const txt = (s, x, y, c = "#fff", align = "left") => {
        ctx.textAlign = align; ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillText(s, x + 1, y + 1); ctx.fillStyle = c; ctx.fillText(s, x, y);
      };
      // Spread between the ✕ on the left and the two buttons on the right.
      const top = 6, left = 48, span = (VIEW_W - left - 94) / 3;
      txt("SCORE", left, top); txt(String(score).padStart(6, "0"), left, top + 10);
      drawCoin(left + span, top + 9, frame >> 3);
      txt("×" + String(coins).padStart(2, "0"), left + span + 12, top + 10);
      txt("LIVES", left + span * 2, top); txt("♥ " + lives, left + span * 2, top + 10);
      txt("TIME", left + span * 3, top); txt(String(Math.max(0, timer)).padStart(3, "0"), left + span * 3, top + 10, timer < 60 && timer % 2 ? "#ffb0a0" : "#fff");
    }

    function centerText(lines, y0, size = 10) {
      ctx.textAlign = "center"; ctx.textBaseline = "top";
      lines.forEach(([s, c, sz], i) => {
        ctx.font = `bold ${sz || size}px ui-monospace, Menlo, Consolas, monospace`;
        ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillText(s, VIEW_W / 2 + 1, y0 + i * 16 + 1);
        ctx.fillStyle = c || "#fff"; ctx.fillText(s, VIEW_W / 2, y0 + i * 16);
      });
    }

    function draw() {
      if (mode === "title" && !L) { L = build(LEVELS[0]); player = { x: 3 * T, y: 12 * T - 14, w: 11, h: 14, dir: 1, size: 0, ground: true, vx: 0, walkT: 0, inv: 0, grow: 0 }; enemies = []; items = []; parts = []; popups = []; bumps = []; coinsList = L.coins.map((c) => ({ ...c })); shots = []; }
      if (mode === "intro") {
        ctx.fillStyle = "#000"; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
        drawHUD();
        centerText([[LEVELS[levelIdx].name.toUpperCase(), "#fff", 13]], 92);
        ctx.save(); ctx.translate(VIEW_W / 2 - 22 + cam, 0);
        drawHiker({ ...player, x: 0, y: 128, hidden: false, inv: 0, grow: 0, ground: true, vx: 0 });
        ctx.restore();
        centerText([["× " + lives, "#fff", 11]], 132);
        return;
      }
      drawSky();
      drawLevel();
      for (const c of coinsList) if (!c.taken) drawCoin(c.x - cam, c.y, (frame >> 3) + (c.x >> 4));
      for (const it of items) drawItem(it);
      for (const e of enemies) drawEnemy(e);
      for (const s of shots) {
        const x = s.x - cam, y = s.y; px(x, y, 6, 6, "#7a4a24"); px(x + 1, y + 1, 4, 4, "#a3693a"); px(x + 2 + ((s.t >> 2) % 2), y + 2, 1, 1, "#e0a95a");
      }
      if (mode !== "title") drawHiker(player);
      for (const q of parts) {
        if (q.kind === "coin") drawCoin(q.x - cam, q.y, frame >> 1);
        else if (q.kind === "brick") { px(q.x - cam, q.y, 6, 6, "#b5532d"); px(q.x - cam, q.y, 6, 1, "#e08b5f"); }
        else if (q.kind === "puff") { ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.beginPath(); ctx.arc(q.x - cam + 3, q.y + 3, 10 - q.t * 0.6, 0, 7); ctx.fill(); }
      }
      ctx.font = "bold 8px ui-monospace, Menlo, Consolas, monospace"; ctx.textAlign = "center";
      for (const q of popups) { ctx.fillStyle = "#fff"; ctx.fillText(q.s, q.x - cam + 6, q.y); }
      if (mode !== "title") drawHUD();

      if (mode === "title") {
        ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
        centerText([["TRAIL JUMPER", "#f7cf3b", 20]], 48);
        ctx.save(); ctx.translate(Math.round(VIEW_W * 0.18) + cam, 0);
        drawHiker({ ...player, size: 1, h: 26, x: 0, y: 12 * T + T - 26, walkT: frame, vx: 1, ground: true, inv: 0, grow: 0, hidden: false });
        ctx.restore();
        const blink = (frame >> 5) % 2 === 0;
        centerText([
          [isTouch ? "TAP TO START" : "PRESS ENTER OR SPACE", blink ? "#fff" : "rgba(255,255,255,.4)", 11],
          ["", "#fff"],
          [isTouch ? "◀ ▶ walk   ▲ jump" : "← → walk   ↑/Z/Space jump", "#e6eef5", 9],
          [isTouch ? "✱ throw pinecones (when you have them)" : "X / Shift throws pinecones", "#e6eef5", 9],
          ["BEST " + String(best).padStart(6, "0"), "#f7cf3b", 9],
        ], 128);
      }
      if (mode === "over") {
        ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
        centerText([["GAME OVER", "#e2533b", 18], ["", ""], ["SCORE " + score, "#fff", 10], ["BEST " + best, "#f7cf3b", 10], ["", ""], [isTouch ? "TAP TO PLAY AGAIN" : "PRESS ENTER", "#fff", 10]], 70);
      }
      if (mode === "won") {
        ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
        centerText([["SUMMIT REACHED!", "#f7cf3b", 16], ["", ""], ["All three stages walked.", "#fff", 10], ["SCORE " + score, "#fff", 10], ["BEST " + best, "#f7cf3b", 10], ["", ""], [isTouch ? "TAP TO WALK IT AGAIN" : "PRESS ENTER", "#fff", 10]], 60);
      }
      if (paused) {
        ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
        centerText([["PAUSED", "#fff", 16], ["", ""], [isTouch ? "tap the screen to carry on" : "press P to carry on", "#e6eef5", 9]], 96);
      }
    }

    // ------------------------------------------------------------------ loop
    const STEP = 1000 / 60;
    let last = performance.now(), acc = 0;
    function loop(now) {
      acc += Math.min(100, now - last); last = now;
      while (acc >= STEP) {
        if (!paused) update();
        prev.jump = keys.jump; prev.fire = keys.fire;
        acc -= STEP;
      }
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>

</html>
