<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1b2620">
  <title>Calculator</title>
  <style>
    :root {
      --bg: #1b2620; --ink: #f3f7f4; --muted: #9fb0a6;
      --key: rgba(255, 255, 255, .10); --key-on: rgba(255, 255, 255, .28);
      --op: #2f4f3e; --op-on: #3f6a54; --sci: rgba(255, 255, 255, .05);
      --eq: #e8a33a; --eq-on: #f2b858; --warn: #e2533b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--ink); -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      display: flex; flex-direction: column;
    }
    .top {
      display: flex; justify-content: space-between; align-items: center; flex: none;
      padding: max(8px, env(safe-area-inset-top)) 8px 0;
    }
    .top .left, .top .right { display: flex; align-items: center; gap: 8px; }
    /* The runner has the width of the phone under the bar. It asks for a
       height that follows the screen's, and it is the one thing in the column
       that yields: the calculator keeps the room its keys and display need,
       and the band shrinks towards a playable floor on a short phone. */
    dash-widget { display: block; margin: 6px 8px 0; flex: 0 1 clamp(84px, 16vh, 150px); min-height: 56px; }
    /* The second runner, below the first: three lanes seen from behind. It
       yields the same way, and on a phone shorter than 700px there is no room
       for a second band without squeezing the calculator, so it steps aside. */
    surf-widget { display: block; margin: 6px 8px 0; flex: 0 1 clamp(72px, 13vh, 120px); min-height: 56px; }
    @media (max-height: 699px) { surf-widget { display: none; } }
    /* The jump button: the cube's colour, and a size a thumb finds without looking. */
    .top button.jump { background: var(--eq); color: #1b2620; width: 52px; font-size: 20px; font-weight: 700; line-height: 36px; }
    .top button.jump:active { background: var(--eq-on); transform: scale(.94); }
    .top button.auto { width: auto; padding: 0 12px; font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
    .top button.auto[aria-pressed="true"] { background: var(--op-on); color: var(--ink); }
    .top a, .top button {
      width: 36px; height: 36px; border-radius: 18px; border: 0; padding: 0; cursor: pointer; touch-action: manipulation;
      background: rgba(255, 255, 255, .12); color: #fff; font-size: 17px; line-height: 36px; text-align: center;
      text-decoration: none; font-family: inherit;
    }
    /* The host's own display wins over the shadow's :host rule, so the
       column is laid out here: the screen grows, the keys keep their size. */
    slow-calc { flex: 1 1 auto; min-height: auto; display: flex; flex-direction: column; }
  </style>
</head>

<body>
  <div class="top">
    <div class="left">
      <a href="index.html" aria-label="Back to Slow Navigator">✕</a>
    </div>
    <div class="right">
      <button id="autoBtn" class="auto" aria-pressed="false" aria-label="Autopilot" title="Let the cube play itself">AUTO</button>
      <button id="jumpBtn" class="jump" aria-label="Jump" title="Jump (space)">▲</button>
      <button id="tapeBtn" aria-label="Show history" title="History">≡</button>
    </div>
  </div>
  <dash-widget></dash-widget>
  <surf-widget></surf-widget>
  <slow-calc></slow-calc>

  <script>
    'use strict';

    // ---- Numbers ---------------------------------------------------------
    // Every result is rounded to 15 significant digits before it is shown or
    // reused — as many as a double can honestly carry — so 0.1 + 0.2 reads
    // 0.3 and sin(30°) reads 0.5 rather than 0.49999999999999994.
    const SIG = 15;
    const PLAIN_MAX = 1e15;   // written out in full below this, as a power of ten above
    const round = (n) => (Number.isFinite(n) && n !== 0) ? +n.toPrecision(SIG) : n;

    // Thin spaces every three digits of an integer part of five or more,
    // so 1234567 reads as 1 234 567. The fraction is left alone.
    const group = (s) => s.replace(/^(−?)(\d{5,})/, (m, sign, digits) => sign + digits.replace(/\B(?=(\d{3})+$)/g, '\u2009'));

    // Plain up to 15 digits, exponent beyond, no trailing zeros, "−" not "-".
    const fmt = (n) => {
      if (!Number.isFinite(n)) return 'Error';
      const abs = Math.abs(n);
      let s = (abs !== 0 && (abs >= PLAIN_MAX || abs < 1e-9)) ? n.toExponential(SIG - 1) : n.toPrecision(SIG);
      if (!s.includes('e') && s.includes('.')) s = s.replace(/\.?0+$/, '');
      if (s.includes('e')) s = s.replace(/\.?0+e/, 'e').replace('e+', 'e').replace('e', 'ᴇ');
      return group(s.replace(/-/g, '−'));
    };

    class CalcError extends Error { }
    const fail = (msg) => { throw new CalcError(msg); };
    const INCOMPLETE = 'incomplete';   // a trailing operator: nothing to show yet, not a fault

    // ---- Functions -------------------------------------------------------
    // Trig in degrees handles the exact points itself: sin 180° is 0, not
    // 1.2e-16, and tan 90° is undefined rather than 1.6e16.
    const snap = (x) => Math.abs(x) < 1e-15 ? 0 : x;
    const sinD = (d) => {
      const r = ((d % 360) + 360) % 360;
      if (r % 180 === 0) return 0;
      if (r === 90) return 1;
      if (r === 270) return -1;
      return Math.sin(d * Math.PI / 180);
    };
    const tanD = (d) => {
      const r = ((d % 360) + 360) % 360;
      if (r % 180 === 0) return 0;
      if (r === 90 || r === 270) return NaN;
      return sinD(d) / sinD(d + 90);
    };
    const factorial = (n) => {
      if (n < 0 || n !== Math.floor(n)) return NaN;
      if (n > 170) return Infinity;
      let f = 1;
      for (let i = 2; i <= n; i++) f *= i;
      return f;
    };
    const FN = {
      sin: (x, deg) => deg ? sinD(x) : snap(Math.sin(x)),
      cos: (x, deg) => deg ? sinD(x + 90) : snap(Math.cos(x)),
      tan: (x, deg) => deg ? tanD(x) : snap(Math.tan(x)),
      asin: (x, deg) => Math.asin(x) * (deg ? 180 / Math.PI : 1),
      acos: (x, deg) => Math.acos(x) * (deg ? 180 / Math.PI : 1),
      atan: (x, deg) => Math.atan(x) * (deg ? 180 / Math.PI : 1),
      ln: (x) => x <= 0 ? NaN : Math.log(x), log: (x) => x <= 0 ? NaN : Math.log10(x),
      sqrt: (x) => Math.sqrt(x), cbrt: (x) => Math.cbrt(x),
      exp: (x) => Math.exp(x), pow10: (x) => Math.pow(10, x), abs: (x) => Math.abs(x),
    };
    const FN_LABEL = {
      sin: 'sin', cos: 'cos', tan: 'tan', asin: 'sin⁻¹', acos: 'cos⁻¹', atan: 'tan⁻¹',
      ln: 'ln', log: 'log', sqrt: '√', cbrt: '∛', exp: 'e^', pow10: '10^', abs: 'abs',
    };
    const POST = {
      '!': factorial, '%': (x) => x / 100, '²': (x) => x * x, '³': (x) => x * x * x, '⁻¹': (x) => x === 0 ? NaN : 1 / x,
    };
    const OP_LABEL = { '+': ' + ', '-': ' − ', '*': ' × ', '/': ' ÷ ', '^': '^', 'mod': ' mod ', 'root': 'ˣ√' };

    // ---- The expression --------------------------------------------------
    // Tokens: num (the digits as typed, exponent included), op, fn (which
    // opens a bracket), lp, rp, const (π, e), ans, rand (Ran#, with the value
    // it was dealt when pressed), post (!, %, ², ³, ⁻¹).
    const VALUE = { num: 1, const: 1, ans: 1, rand: 1 };
    const startsOperand = (t) => !!t && (t.t in VALUE || t.t === 'lp' || t.t === 'fn');
    const endsOperand = (t) => !!t && (t.t in VALUE || t.t === 'rp' || t.t === 'post');

    // A minus that is a sign sits against its number: "5 − −2", "−3²".
    const piece = (tokens, i) => {
      const t = tokens[i];
      switch (t.t) {
        case 'num': return group(t.v.replace('e+', 'e').replace('e', 'ᴇ').replace(/-/g, '−'));
        case 'op': return t.v === '-' && !endsOperand(tokens[i - 1]) ? '−' : OP_LABEL[t.v];
        case 'fn': return FN_LABEL[t.v] + '(';
        case 'lp': return '(';
        case 'rp': return ')';
        case 'const': return t.v;
        case 'ans': return 'Ans';
        case 'rand': return 'Ran#';
        case 'post': return t.v;
      }
    };
    // The pieces, each trimmed at the ends of the expression, so a row of
    // spans reads exactly as the joined string does.
    const pieces = (tokens) => tokens.map((t, i) => {
      let p = piece(tokens, i);
      if (i === 0) p = p.replace(/^\s+/, '');
      if (i === tokens.length - 1) p = p.replace(/\s+$/, '');
      return p;
    });
    const show = (tokens) => pieces(tokens).join('');

    // Recursive descent, lowest precedence first:
    //   + −  <  × ÷ mod  <  writing two things together  <  unary −  <  ^ ˣ√ (right)  <  postfix  <  atoms
    // so −3² is −9 and 2^3^2 is 512, as on a Casio. Brackets left open at
    // the end are closed for free.
    const evaluate = (tokens, deg, ans) => {
      let i = 0;
      const peek = () => tokens[i];
      const isOp = (t, ...vs) => !!t && t.t === 'op' && vs.includes(t.v);
      const expr = () => {
        let v = term();
        while (isOp(peek(), '+', '-')) { const o = tokens[i++].v; const r = term(); v = o === '+' ? v + r : v - r; }
        return v;
      };
      const term = () => {
        let v = juxta();
        for (;;) {
          const t = peek();
          if (!isOp(t, '*', '/', 'mod')) return v;
          i++;
          const r = juxta();
          if (t.v === '*') v = v * r;
          else if (r === 0) fail("Can't divide by 0");
          else v = t.v === '/' ? v / r : v - r * Math.floor(v / r);
        }
      };
      // Writing two things together multiplies — 2π, 3(4 + 5), 2sin(30) —
      // and binds tighter than ÷, so 1 ÷ 2π is 1 ÷ (2π), as on a Casio.
      const juxta = () => {
        let v = unary();
        while (startsOperand(peek())) v = v * unary();
        return v;
      };
      const unary = () => {
        if (isOp(peek(), '-')) { i++; return -unary(); }
        if (isOp(peek(), '+')) { i++; return unary(); }
        return power();
      };
      const power = () => {
        const v = postfix();
        const t = peek();
        if (isOp(t, '^', 'root')) { i++; const r = unary(); return t.v === '^' ? Math.pow(v, r) : Math.pow(r, 1 / v); }
        return v;
      };
      const postfix = () => {
        let v = atom();
        while (peek() && peek().t === 'post') v = POST[tokens[i++].v](v);
        return v;
      };
      const atom = () => {
        const t = tokens[i++];
        if (!t) fail(INCOMPLETE);
        switch (t.t) {
          case 'num': {
            // Digits typed at a caret before a number are their own token; read together they are one number.
            let v = t.v;
            while (peek() && peek().t === 'num') v += tokens[i++].v;
            const n = Number(v);
            if (Number.isNaN(n)) fail(INCOMPLETE);
            return n;
          }
          case 'const': return t.v === 'π' ? Math.PI : Math.E;
          case 'ans': return ans;
          case 'rand': return t.v;
          case 'lp': { const v = expr(); if (peek() && peek().t === 'rp') i++; return v; }
          case 'fn': { const v = expr(); if (peek() && peek().t === 'rp') i++; return FN[t.v](v, deg); }
        }
        fail('Syntax error');
      };
      if (tokens.length === 0) fail(INCOMPLETE);
      const v = expr();
      if (i < tokens.length) fail('Syntax error');
      if (Number.isNaN(v)) fail('Invalid input');
      if (!Number.isFinite(v)) fail('Too large');
      return round(v);
    };

    // ---- The state behind the keys -----------------------------------------
    class Calc {
      constructor(deg) {
        this.deg = deg; this.ans = 0;
        this.clear();
      }

      clear() { this.tokens = []; this.cur = 0; this.result = null; this.error = null; this.evaluated = false; this.recalled = false; }

      // The token before the caret: what a digit extends, what a postfix applies to.
      get last() { return this.tokens[this.cur - 1]; }

      // Moving the caret after "=" reopens the expression for editing, as a
      // Casio's replay does; the answer line empties until "=" again.
      moveCaret(d) {
        if (this.evaluated) { this.evaluated = false; this.result = null; this.recalled = false; }
        this.error = null;
        this.cur = Math.max(0, Math.min(this.tokens.length, this.cur + d));
      }
      setCaret(i) { this.moveCaret(i - this.cur); }
      get expression() { return show(this.tokens) + (this.evaluated && !this.recalled ? ' =' : ''); }

      // What the big line shows, and how: the answer after "=", an error,
      // or a muted preview of where the expression has got to.
      get display() {
        if (this.error) return { text: this.error, kind: 'err' };
        if (this.evaluated) return { text: fmt(this.result), kind: 'result' };
        if (this.tokens.length === 0) return { text: '0', kind: 'result' };
        if (this.tokens.length === 1 && this.tokens[0].t === 'num') return { text: show(this.tokens), kind: 'result' };
        try { return { text: fmt(evaluate(this.tokens, this.deg, this.ans)), kind: 'preview' }; }
        catch (e) { return { text: '', kind: 'preview' }; }
      }

      // Typing after "=" starts a new expression — unless it is an operator
      // or a postfix, which carry the answer on.
      begin(continues) {
        this.error = null;
        if (!this.evaluated) return;
        const carry = this.result === this.ans ? { t: 'ans' } : { t: 'num', v: String(this.result) };
        this.tokens = continues ? [carry] : [];
        this.cur = this.tokens.length;
        this.result = null; this.evaluated = false; this.recalled = false;
      }

      push(token) { this.tokens.splice(this.cur, 0, token); this.cur++; }

      digit(d) {
        this.begin(false);
        const l = this.last;
        if (l && l.t === 'num') {
          const [mant, exp] = l.v.split('e');
          if (exp === undefined ? mant.replace(/[-.]/g, '').length >= SIG : exp.replace('-', '').length >= 3) return;
          if (l.v === '0') l.v = '';
          l.v += d;
        } else this.push({ t: 'num', v: d });
      }

      point() {
        this.begin(false);
        const l = this.last;
        if (l && l.t === 'num') { if (!l.v.includes('.') && !l.v.includes('e')) l.v += '.'; }
        else this.push({ t: 'num', v: '0.' });
      }

      // ×10ˣ: the exponent is typed into the same number.
      ee() {
        this.begin(true);
        const l = this.last;
        if (l && l.t === 'num') { if (!l.v.includes('e')) l.v += 'e'; }
        else if (endsOperand(l)) { this.push({ t: 'op', v: '*' }); this.push({ t: 'num', v: '1e' }); }
        else this.push({ t: 'num', v: '1e' });
      }

      // ± puts a unary minus in front of the number, or takes one away, so
      // "−3²" means −(3²) on the screen and in the answer alike. Inside an
      // exponent it flips the exponent's sign.
      negate() {
        this.begin(true);
        const l = this.last;
        if (l && l.t === 'num' && l.v.includes('e')) {
          const [m, e] = l.v.split('e');
          l.v = m + 'e' + (e.startsWith('-') ? e.slice(1) : '-' + e);
          return;
        }
        const target = endsOperand(l) ? this.cur - 1 : this.cur;   // before the operand at the caret, or where the next one goes
        const before = this.tokens[target - 1];
        const beforeThat = this.tokens[target - 2];
        if (before && before.t === 'op' && before.v === '-' && !endsOperand(beforeThat)) { this.tokens.splice(target - 1, 1); this.cur--; }
        else { this.tokens.splice(target, 0, { t: 'op', v: '-' }); this.cur++; }
      }

      op(v) {
        this.begin(true);
        const l = this.last;
        if (l && l.t === 'op') {
          // A second operator replaces the first — except a minus after
          // × ÷ ^, which is a sign.
          if (v === '-' && !['-', '+'].includes(l.v)) this.push({ t: 'op', v });
          else l.v = v;
          return;
        }
        if (!l && v !== '-') this.push({ t: 'ans' });       // "× 3" at the start means Ans × 3
        if (l && (l.t === 'lp' || l.t === 'fn') && v !== '-') return;
        this.push({ t: 'op', v });
      }

      fn(v) { this.begin(false); this.push({ t: 'fn', v }); }
      constant(v) { this.begin(false); this.push({ t: 'const', v }); }
      ansKey() { this.begin(false); this.push({ t: 'ans' }); }
      // Ran#: 0.000 to 0.999, as on a Casio, dealt once when the key is
      // pressed so the preview does not reroll on every keystroke.
      random() { this.begin(false); this.push({ t: 'rand', v: Math.floor(Math.random() * 1000) / 1000 }); }
      lparen() { this.begin(false); this.push({ t: 'lp' }); }

      rparen() {
        this.begin(true);
        let depth = 0;
        for (const t of this.tokens.slice(0, this.cur)) { if (t.t === 'lp' || t.t === 'fn') depth++; else if (t.t === 'rp') depth--; }
        if (depth > 0 && endsOperand(this.last)) this.push({ t: 'rp' });
      }

      post(v) {
        this.begin(true);
        if (endsOperand(this.last)) this.push({ t: 'post', v });
      }

      backspace() {
        this.error = null;
        if (this.evaluated) { this.clear(); return; }
        const l = this.last;
        if (!l) return;
        if (l.t === 'num' && l.v.length > 1) l.v = l.v.slice(0, -1);
        else { this.tokens.splice(this.cur - 1, 1); this.cur--; }
      }

      // Returns the line for the tape, or null when there was nothing to do.
      equals() {
        this.error = null;
        if (this.evaluated || this.tokens.length === 0) return null;
        try {
          this.result = evaluate(this.tokens, this.deg, this.ans);
          // Brackets left open are closed on the screen too, so the tape reads sin(π) = 0.
          let depth = 0;
          for (const t of this.tokens) { if (t.t === 'lp' || t.t === 'fn') depth++; else if (t.t === 'rp') depth--; }
          while (depth-- > 0) this.tokens.push({ t: 'rp' });
          this.cur = this.tokens.length;
        } catch (e) {
          if (!(e instanceof CalcError)) throw e;
          this.error = e.message === INCOMPLETE ? 'Syntax error' : e.message;
          return null;
        }
        this.ans = this.result; this.evaluated = true;
        return `${show(this.tokens)} = ${fmt(this.result)}`;
      }

      // The tape gives back a result to carry on from: an operator continues
      // from it, a digit starts afresh, as after "=".
      use(n) { this.clear(); this.tokens = [{ t: 'num', v: String(n) }]; this.cur = 1; this.result = n; this.evaluated = true; this.recalled = true; }
    }

    // ---- The component -------------------------------------------------------
    // [label, kind, action] with an optional [label, action] for the 2nd layer.
    const KEYS = [
      ['2nd', 'sci', 'second'], ['DEG', 'sci', 'deg'], ['sin', 'sci', 'fn:sin', 'sin⁻¹', 'fn:asin'], ['cos', 'sci', 'fn:cos', 'cos⁻¹', 'fn:acos'], ['tan', 'sci', 'fn:tan', 'tan⁻¹', 'fn:atan'],
      ['x²', 'sci', 'post:²', 'x³', 'post:³'], ['xʸ', 'sci', 'op:^', 'ˣ√y', 'op:root'], ['√', 'sci', 'fn:sqrt', '∛', 'fn:cbrt'], ['ln', 'sci', 'fn:ln', 'eˣ', 'fn:exp'], ['log', 'sci', 'fn:log', '10ˣ', 'fn:pow10'],
      ['π', 'sci', 'const:π'], ['e', 'sci', 'const:e'], ['1/x', 'sci', 'post:⁻¹', '|x|', 'fn:abs'], ['x!', 'sci', 'post:!', 'mod', 'op:mod'], ['%', 'sci', 'post:%', 'Ran#', 'rand'],
      ['AC', 'fn', 'clear'], ['(', 'fn', 'lparen'], [')', 'fn', 'rparen'], ['⌫', 'fn', 'backspace'], ['÷', 'op', 'op:/'],
      ['7', 'num', '7'], ['8', 'num', '8'], ['9', 'num', '9'], ['±', 'fn', 'negate'], ['×', 'op', 'op:*'],
      ['4', 'num', '4'], ['5', 'num', '5'], ['6', 'num', '6'], ['EE', 'fn', 'ee'], ['−', 'op', 'op:-'],
      ['1', 'num', '1'], ['2', 'num', '2'], ['3', 'num', '3'], ['Ans', 'fn', 'ans'], ['+', 'op', 'op:+'],
      ['0', 'num wide', '0'], ['.', 'num', 'point'], ['=', 'eq wide', 'equals'],
    ];
    const ARIA = {
      '⌫': 'Backspace', 'AC': 'Clear', '2nd': 'Second functions', 'DEG': 'Degrees or radians', 'x²': 'Square', 'xʸ': 'Power',
      '√': 'Square root', '1/x': 'Reciprocal', 'x!': 'Factorial', 'EE': 'Exponent', '±': 'Change sign', 'π': 'Pi', 'e': 'e',
      'Ran#': 'Random number',
    };

    const TAPE_KEY = 'calc:tape';
    const DEG_KEY = 'calc:deg';
    const TAPE_MAX = 50;

    // The phone's storage may be off or full; neither is a reason for the keys to stop working.
    const stored = (key, fallback) => { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } };
    const store = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* nothing to do about it */ } };

    class SlowCalc extends HTMLElement {
      constructor() {
        super();
        this.calc = new Calc(stored(DEG_KEY, true) !== false);
        this.second = false;
        const list = stored(TAPE_KEY, []);
        this.tape = Array.isArray(list) ? list.filter((t) => t && typeof t.line === 'string') : [];
        const root = this.attachShadow({ mode: 'open' });
        root.innerHTML = `
          <style>
            :host { display: flex; flex-direction: column; }
            * { box-sizing: border-box; }
            /* The display's floor is what its three lines need; the band above yields before this does. */
            .screen {
              flex: 1; min-height: 118px; display: flex; flex-direction: column; justify-content: flex-end;
              padding: 4px 16px 10px; text-align: right;
            }
            .mode { color: var(--muted); font-size: 12px; letter-spacing: .08em; min-height: 16px; }
            .expr {
              color: var(--ink); font-size: 26px; line-height: 1.3; min-height: 34px; max-height: 40%;
              overflow-y: auto; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; white-space: pre-wrap;
            }
            .expr span { cursor: text; }
            .expr .caret {
              display: inline-block; width: 2px; height: 1em; margin: 0 -1px; vertical-align: -0.15em;
              background: var(--eq); animation: blink 1s steps(2, start) infinite;
            }
            .expr.done .caret { display: none; }
            @keyframes blink { to { visibility: hidden; } }
            .out { cursor: pointer; }

      // ---- The run ---------------------------------------------------------
      jump() { this.vy = JUMP_V; this.rot = 0; this.onGround = false; this.buffer = -Infinity; }

      loop(now) {

      step(dt) {

        const i0 = Math.floor(left / CELL), i1 = Math.floor((right - 0.01) / CELL);

        for (let i = i0; i <= i1; i++) { const c = this.col(i); if (c && c.h !== null) gh = Math.max(gh, c.h * LEVEL); }

        // The camera follows the ground the cube stands on, so a jump from
        // the top level stays in frame; it glides rather than snaps — except
        // that the cube is never let out of the top of the frame.
        const standing = gh === -Infinity ? this.cam : gh;
        this.cam += (standing - this.cam) * Math.min(1, dt * 6);

        const prevY = this.y;
        if (!this.onGround || this.y > gh) {

          this.y += this.vy * dt; this.vy -= G * dt;

        }
        if (this.y <= gh) {
          // A wall is ground the cube was already below before this frame
          // moved it; anything else is a landing, however fast it fell.
          if (prevY < gh - 4) { this.die(); return; }
          this.y = gh; this.vy = 0; this.rot = 0; this.onGround = true;
          if (this.held || performance.now() - this.buffer < 120) this.jump();   // held, or pressed just before landing
        } else if (this.y === gh) {
          this.onGround = true;
        } else if (gh === -Infinity && this.y < -CUBE * 1.5) { this.die(); return; }   // down a pit

        // A pad launches the cube the moment it touches one — on the ground
        // or skimming over it. An orb gives a second jump in the air, to a
        // press while the cube is on it, or a finger already held down.
        for (let i = i0; i <= i1; i++) {
          const c = this.col(i);
          if (c && c.pad && !c.used && this.y < c.h * LEVEL + 8) { c.used = true; this.vy = PAD_V; this.rot = 0; this.onGround = false; this.buffer = -Infinity; break; }
        }
        if (!this.onGround) {
          const cx = this.dist + PX + CUBE / 2, cy = this.y + CUBE / 2;
          const wants = this.held || performance.now() - this.buffer < 120;
          for (const o of this.orbs) {
            if (o.used || Math.abs(o.x - cx) > ORB_HIT || Math.abs(o.y - cy) > ORB_HIT) continue;
            if (wants) { o.used = true; this.vy = ORB_V; this.rot = 0; this.buffer = -Infinity; }
            break;
          }
        }
        const topGap = (this.h - 6 + this.cam) - CUBE - this.y;   // screen units above the cube
        if (topGap < 4) this.cam += 4 - topGap;

        // Spikes: the hit box is the upper two thirds, so a close shave is a shave.
        for (let i = i0; i <= i1; i++) {
          const c = this.col(i);
          if (!c || !c.spike) continue;
          const sx = i * CELL;
          if (left < sx + CELL - 3 && right > sx + 3 && this.y < c.h * LEVEL + SPIKE_H - 5) { this.die(); return; }
        }
        // Scoring: each feature once, when the cube is past it.
        for (let i = this.col0; i < i0; i++) {

      }

      die() {
        this.state = 'dead';

        if (navigator.vibrate) navigator.vibrate(20);

        // The cube goes to pieces: a dozen bits of it, flying, for half a second.
        const cx = PX + CUBE / 2, cy = this.y + CUBE / 2;
        this.particles = Array.from({ length: 12 }, (_, k) => {

      }

      burst(now) {
        if (this.state !== 'dead' || this.particles.length === 0) return;
        const dt = Math.min(0.05, (now - this.lastBurst) / 1000);
        this.lastBurst = now;
        for (const p of this.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 400 * dt; p.life -= dt; }
        this.particles = this.particles.filter((p) => p.life > 0);
        this.draw();
        if (this.particles.length) requestAnimationFrame(this.burst);
      }

      // ---- Drawing -----------------------------------------------------------
      skyline(layer, parallax, base) {
        const c = this.ctx, w = this.w;
        c.beginPath(); c.moveTo(0, this.h);
        for (let x = 0; x <= w; x += 4) {
          const wx = x + this.dist * parallax;
          let y = 0;
          for (const { a, f, p } of this.hills[layer]) y += a * Math.sin(wx * f + p);
          c.lineTo(x, base - y);
        }
        c.lineTo(w, this.h); c.closePath(); c.fill();
      }

      draw() {
        if (!this.ctx) return;
        const c = this.ctx, w = this.w, h = this.h, base = h - 6 + this.cam;
        c.clearRect(0, 0, w, h);
        const bg = c.createLinearGradient(0, 0, 0, h);
        bg.addColorStop(0, '#182a34'); bg.addColorStop(1, '#0e1a20');
        c.fillStyle = bg; c.fillRect(0, 0, w, h);
        c.fillStyle = '#17323a'; this.skyline(0, 0.25, h - 20 + this.cam * 0.3);
        c.fillStyle = '#1a3d3a'; this.skyline(1, 0.5, h - 12 + this.cam * 0.5);

        // Terrain: a column per cell, shaded by level, with a bright top edge.
        const shades = ['#1c3a30', '#245040', '#2d6650', '#357a60', '#3d8e70', '#45a280'];
        for (let i = this.col0; i < this.col0 + this.cols.length; i++) {
          const col = this.col(i);
          const sx = i * CELL - this.dist;
          if (sx > w || sx + CELL < 0) continue;
          if (col.h === null) continue;
          const top = base - col.h * LEVEL;
          c.fillStyle = shades[col.h]; c.fillRect(sx, top, CELL + 0.5, h - top);
          c.fillStyle = '#9fd9c4'; c.fillRect(sx, top, CELL + 0.5, 1);
          const prev = this.col(i - 1);
          if (prev && prev.h !== null && prev.h < col.h) { c.fillRect(sx, top, 1, (col.h - prev.h) * LEVEL); }
          if (col.spike) {
            c.beginPath(); c.moveTo(sx, top); c.lineTo(sx + CELL / 2, top - SPIKE_H); c.lineTo(sx + CELL, top); c.closePath();

          }

            c.fillStyle = col.used ? '#b08a3a' : '#f7d27a'; c.fillRect(sx + 2, top - 3, CELL - 4, 1);

        for (const o of this.orbs) {

          if (ox < -ORB_R || ox > w + ORB_R) continue;
          c.globalAlpha = o.used ? 0.3 : 1;

          c.strokeStyle = '#e8a33a'; c.lineWidth = 2.5; c.stroke();
          c.beginPath(); c.arc(ox, oy, 2.5, 0, Math.PI * 2); c.fillStyle = '#f7d27a'; c.fill();
          c.globalAlpha = 1;
        }

        // The cube — or, just after a crash, its pieces.
        if (this.particles.length) {
          for (const p of this.particles) {
            c.globalAlpha = Math.max(0, p.life / 0.5);
            c.fillStyle = '#e8a33a'; c.fillRect(p.x - 2, base - p.y - 2, 4, 4);
          }
          c.globalAlpha = 1;
        } else {
          c.save();
          c.translate(PX + CUBE / 2, base - CUBE / 2 - this.y);
          c.rotate(this.rot);
          c.fillStyle = this.state === 'dead' ? '#e2533b' : '#e8a33a';
          c.fillRect(-CUBE / 2, -CUBE / 2, CUBE, CUBE);
          c.fillStyle = '#1b2620'; c.fillRect(-CUBE / 2 + 3, -CUBE / 2 + 3, 4, 4); c.fillRect(1, -CUBE / 2 + 3, 4, 4);
          c.fillRect(-CUBE / 2 + 3, 2, CUBE - 6, 3);
          c.strokeStyle = '#1b2620'; c.lineWidth = 1.5; c.strokeRect(-CUBE / 2, -CUBE / 2, CUBE, CUBE);
          c.restore();
        }

        // Words
        c.font = '600 10px -apple-system, Segoe UI, Roboto, sans-serif';
        c.textBaseline = 'top'; c.textAlign = 'right';
        c.fillStyle = '#9fb0a6';
        if (this.state === 'idle') { c.fillText(this.best ? `best ${this.best} · tap ▶` : 'tap ▶', w - 5, 5); }
        else if (this.state === 'dead') {
          c.fillStyle = this.newBest ? '#e8a33a' : '#e2533b';
          c.fillText(this.newBest ? `★ new best ${this.score}` : `✕ ${this.score} · best ${this.best}`, w - 5, 5);
        }
        else if (this.state === 'paused') { c.fillText(`paused · ${this.score}`, w - 5, 5); }
        else { c.fillStyle = '#f3f7f4'; c.fillText(String(this.score), w - 5, 5); c.textAlign = 'left'; c.fillStyle = '#9fb0a6'; c.fillText(`#${this.attempt}${this.auto ? ' auto' : ''}`, 5, 5); }

    // ---- The second runner: three lanes, seen from behind -------------------

    // have to be dodged; coins are there to be collected. Everything comes
    // towards the camera along z, 1 at the horizon and 0 at the runner.
    const SURF_KEY = 'calc:surf';

    class SurfWidget extends HTMLElement {

            canvas { display: block; width: 100%; height: 100%; }
          </style>
          <canvas role="button" aria-label="Swipe to steer, up to jump, down to roll" tabindex="0"></canvas>`;
        this.canvas = root.querySelector('canvas');
        this.ctx = this.canvas.getContext('2d');

        this.state = 'idle';
        this.reset(1);
        this.canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); this.from = { x: e.clientX, y: e.clientY }; });
        this.onUp = (e) => {

          this.from = null;
          if (this.state !== 'running') { this.start(); return; }
          if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 18) this.steer(dx > 0 ? 1 : -1);
          else if (dy < -18) this.doJump();
          else if (dy > 18) this.doRoll();
          else this.doJump();                                   // a plain tap is a jump
        };
        // Arrows steer while a run is on, and the calculator's caret does not
        // see them; the rest of the time they are the caret's.
        this.onKey = (e) => {
          if (this.state !== 'running' || e.ctrlKey || e.metaKey || e.altKey) return;
          const act = { ArrowLeft: () => this.steer(-1), ArrowRight: () => this.steer(1), ArrowUp: () => this.doJump(), ArrowDown: () => this.doRoll() }[e.key];

      }

      connectedCallback() {
        window.addEventListener('pointerup', this.onUp);
        window.addEventListener('keydown', this.onKey, true);
        document.addEventListener('visibilitychange', this.onHide);

        this.fit();
      }
      disconnectedCallback() {
        window.removeEventListener('pointerup', this.onUp);
        window.removeEventListener('keydown', this.onKey, true);
        document.removeEventListener('visibilitychange', this.onHide);

      }

      fit() {
        if (!this.ctx) return;

        this.canvas.width = Math.round(this.w * dpr); this.canvas.height = Math.round(this.h * dpr);
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      }

      reset(seed) {

        this.speed = 0.9; this.dist = 0; this.coins = 0; this.items = []; this.nextAt = 0.5; this.spawned = 0;

      }

      start() {

        requestAnimationFrame(this.loop);
      }
      pause() { if (this.state === 'running') { this.state = 'paused'; this.draw(); } }
      steer(d) { if (this.state === 'running') this.lane = Math.max(0, Math.min(LANES - 1, this.lane + d)); }
      doJump() { if (this.state === 'running' && this.jump <= 0 && this.roll <= 0) this.jump = JUMP_T; }
      doRoll() { if (this.state === 'running' && this.jump <= 0 && this.roll <= 0) this.roll = ROLL_T; }

      loop(now) {
        if (this.state !== 'running') return;
        const dt = Math.min(0.05, (now - this.last) / 1000);
        this.last = now;
        this.step(dt);
        this.draw();
        if (this.state === 'running') requestAnimationFrame(this.loop);
      }

      // A row of things at the horizon, never blocking every lane, with a
      // free lane always reachable: rows are ROW_GAP apart in z, which at the
      // top speed is still twice a lane change.
      spawn() {
        const r = this.rng, lanes = [0, 1, 2].sort(() => r() - 0.5);
        const far = this.dist > 300, roll = r();
        const put = (lane, kind, z = 1) => this.items.push({ lane, kind, z, done: false });
        const coinsIn = (lane) => { for (let k = 0; k < 3; k++) put(lane, 'coin', 1 + k * 0.08); };
        if (roll < 0.35) { put(lanes[0], r() < 0.5 ? 'low' : 'high'); coinsIn(lanes[1]); }
        else if (roll < 0.6) { put(lanes[0], 'train'); coinsIn(lanes[1]); }
        else if (roll < 0.8) { put(lanes[0], 'low'); put(lanes[1], 'high'); coinsIn(lanes[2]); }
        else if (far && roll < 0.92) { put(lanes[0], 'train'); put(lanes[1], 'train'); coinsIn(lanes[2]); }
        else { coinsIn(lanes[0]); coinsIn(lanes[1]); }
        this.spawned++;
      }

      step(dt) {
        this.dist += this.speed * dt * 14;                         // metres, for the score
        this.speed = Math.min(1.6, this.speed + dt * 0.012);
        this.x += (this.lane - this.x) * Math.min(1, dt * 12);     // the lane change glides
        if (this.jump > 0) this.jump -= dt;
        if (this.roll > 0) this.roll -= dt;
        for (const it of this.items) it.z -= this.speed * dt;
        this.nextAt -= this.speed * dt;
        if (this.nextAt <= 0) { this.spawn(); this.nextAt = ROW_GAP + this.rng() * 0.4; }

        const airborne = this.jump > JUMP_T * 0.15 && this.jump < JUMP_T * 0.9;
        for (const it of this.items) {
          if (it.done || Math.abs(this.x - it.lane) > 0.5) continue;
          const len = it.kind === 'train' ? TRAIN_LEN : 0.04;
          if (it.z > 0.03 || it.z + len < -0.03) continue;        // not at the runner yet, or already past
          if (it.kind === 'coin') { it.done = true; this.coins++; continue; }
          if (it.kind === 'low' && airborne) continue;
          if (it.kind === 'high' && this.roll > 0) continue;
          this.die(); return;
        }
        this.items = this.items.filter((it) => it.z + (it.kind === 'train' ? TRAIN_LEN : 0) > -0.2);
      }

      die() {
        this.state = 'dead';
        const score = Math.floor(this.dist);
        this.newBest = score > this.best;
        if (this.newBest) { this.best = score; store(SURF_KEY, score); }
        if (navigator.vibrate) navigator.vibrate(20);
      }

      // Perspective: y and scale from z, so the far end is small and high.
      proj(z) {
        const h = this.h, horizon = h * 0.34;
        const f = Math.pow(Math.max(0, 1 - z), 1.7);
        return { y: horizon + (h - horizon) * f, s: 0.12 + 0.88 * f };
      }
      laneX(lane, s) { return this.w / 2 + (lane - 1) * this.w * 0.3 * s; }

      draw() {
        if (!this.ctx) return;
        const c = this.ctx, w = this.w, h = this.h;
        c.clearRect(0, 0, w, h);
        const sky = c.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, '#182a34'); sky.addColorStop(0.34, '#2a4a52'); sky.addColorStop(0.35, '#1c3a30'); sky.addColorStop(1, '#245040');
        c.fillStyle = sky; c.fillRect(0, 0, w, h);
        // The track: three lanes converging on the horizon.
        const near = this.proj(0), farP = this.proj(1);
        c.fillStyle = '#17323a';
        c.beginPath();
        c.moveTo(this.laneX(-0.5, near.s), near.y); c.lineTo(this.laneX(2.5, near.s), near.y);
        c.lineTo(this.laneX(2.5, farP.s), farP.y); c.lineTo(this.laneX(-0.5, farP.s), farP.y); c.closePath(); c.fill();
        c.strokeStyle = 'rgba(159, 217, 196, .45)'; c.lineWidth = 1;
        for (const l of [-0.5, 0.5, 1.5, 2.5]) { c.beginPath(); c.moveTo(this.laneX(l, near.s), near.y); c.lineTo(this.laneX(l, farP.s), farP.y); c.stroke(); }
        // Sleepers scroll towards the camera.
        for (let k = 0; k < 10; k++) {
          const z = ((k / 10) + (this.dist * 0.02) % 0.1) % 1;
          const p = this.proj(z);
          c.fillStyle = `rgba(159, 217, 196, ${0.08 + 0.15 * (1 - z)})`;
          c.fillRect(this.laneX(-0.5, p.s), p.y, this.laneX(2.5, p.s) - this.laneX(-0.5, p.s), Math.max(1, 2 * p.s));
        }
        // Things on the track, far to near.
        const sorted = [...this.items].sort((a, b) => b.z - a.z);
        for (const it of sorted) {
          if (it.done) continue;
          const p = this.proj(Math.max(0, it.z));
          const x = this.laneX(it.lane, p.s), lw = w * 0.22 * p.s, u = h * 0.3 * p.s;
          if (it.kind === 'coin') { c.fillStyle = '#e8a33a'; c.beginPath(); c.ellipse(x, p.y - u * 0.35, u * 0.14, u * 0.18, 0, 0, Math.PI * 2); c.fill(); c.fillStyle = '#f7d27a'; c.fillRect(x - 1, p.y - u * 0.45, 2, u * 0.2); }
          else if (it.kind === 'low') { c.fillStyle = '#e2533b'; c.fillRect(x - lw / 2, p.y - u * 0.4, lw, u * 0.4); c.fillStyle = '#f3f7f4'; c.fillRect(x - lw / 2, p.y - u * 0.4, lw, Math.max(1, u * 0.08)); }
          else if (it.kind === 'high') {
            c.fillStyle = '#9fb0a6'; c.fillRect(x - lw / 2, p.y - u * 1.3, Math.max(1, lw * 0.08), u * 1.3); c.fillRect(x + lw / 2 - Math.max(1, lw * 0.08), p.y - u * 1.3, Math.max(1, lw * 0.08), u * 1.3);
            c.fillStyle = '#e8a33a'; c.fillRect(x - lw / 2, p.y - u * 1.3, lw, u * 0.5);
          } else {
            // A train: its near face at z, its roof running back to z + TRAIN_LEN.
            const q = this.proj(Math.min(1, Math.max(0, it.z + TRAIN_LEN)));
            const xb = this.laneX(it.lane, q.s), lwb = w * 0.22 * q.s, ub = h * 0.3 * q.s;
            c.fillStyle = '#2d6650';
            c.beginPath(); c.moveTo(x - lw / 2, p.y - u * 1.2); c.lineTo(xb - lwb / 2, q.y - ub * 1.2); c.lineTo(xb + lwb / 2, q.y - ub * 1.2); c.lineTo(x + lw / 2, p.y - u * 1.2); c.closePath(); c.fill();
            c.fillStyle = '#3d8e70'; c.fillRect(x - lw / 2, p.y - u * 1.2, lw, u * 1.2);
            c.fillStyle = '#9fd9c4'; c.fillRect(x - lw / 2 + lw * 0.15, p.y - u * 1.05, lw * 0.3, u * 0.35); c.fillRect(x + lw / 2 - lw * 0.45, p.y - u * 1.05, lw * 0.3, u * 0.35);
            c.fillStyle = '#e8a33a'; c.fillRect(x - lw / 2 + lw * 0.1, p.y - u * 0.5, lw * 0.2, u * 0.15); c.fillRect(x + lw / 2 - lw * 0.3, p.y - u * 0.5, lw * 0.2, u * 0.15);
          }
        }
        // The runner: a hooded figure, mid-jump or rolled up.
        const pr = this.proj(0), px = this.laneX(this.x, pr.s), ph = h * 0.3;
        const lift = this.jump > 0 ? Math.sin(Math.PI * (1 - this.jump / JUMP_T)) * h * 0.22 : 0;
        const squash = this.roll > 0 ? 0.55 : 1;
        const bodyH = ph * 0.6 * squash, bodyW = w * 0.07;
        const baseY = pr.y - lift;
        c.fillStyle = this.state === 'dead' ? '#e2533b' : '#e8a33a';
        c.fillRect(px - bodyW / 2, baseY - bodyH, bodyW, bodyH);
        c.fillStyle = '#f3d6b0'; c.beginPath(); c.arc(px, baseY - bodyH - ph * 0.12 * squash, ph * 0.12, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#1b2620'; c.fillRect(px - bodyW / 2, baseY - bodyH * 0.25, bodyW * 0.4, bodyH * 0.25); c.fillRect(px + bodyW * 0.1, baseY - bodyH * 0.25, bodyW * 0.4, bodyH * 0.25);
        // Words
        const fs = Math.max(10, Math.min(14, h / 7));
        c.font = `600 ${fs}px -apple-system, Segoe UI, Roboto, sans-serif`;
        c.textBaseline = 'top'; c.textAlign = 'left';
        c.fillStyle = '#f3f7f4';
        if (this.state === 'idle') { c.fillStyle = '#9fb0a6'; c.fillText(this.best ? `best ${this.best} m` : 'swipe to steer', 6, 5); c.textAlign = 'right'; c.fillText('tap ▶', w - 6, 5); }
        else if (this.state === 'dead') { c.fillStyle = this.newBest ? '#e8a33a' : '#e2533b'; c.fillText(this.newBest ? `★ new best ${Math.floor(this.dist)} m` : `✕ ${Math.floor(this.dist)} m · best ${this.best} m`, 6, 5); c.textAlign = 'right'; c.fillStyle = '#9fb0a6'; c.fillText('tap ▶', w - 6, 5); }
        else if (this.state === 'paused') { c.fillStyle = '#9fb0a6'; c.fillText(`paused · ${Math.floor(this.dist)} m`, 6, 5); }
        else { c.fillText(`${Math.floor(this.dist)} m`, 6, 5); c.textAlign = 'right'; c.fillStyle = '#e8a33a'; c.fillText(`● ${this.coins}`, w - 6, 5); }
      }
    }
    customElements.define('surf-widget', SurfWidget);
    // pointerdown, not click: a jump has to happen on the press, not the release.
    document.getElementById('jumpBtn').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      document.querySelector('dash-widget').press();
    });
    document.getElementById('autoBtn').addEventListener('click', (e) => {
      const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
      e.currentTarget.setAttribute('aria-pressed', String(on));
      document.querySelector('dash-widget').setAuto(on);
    });
    document.getElementById('tapeBtn').addEventListener('click', () => {
      document.querySelector('slow-calc').press('toggleTape');
    });
  </script>
</body>

</html>
